{ id:'suap-vital', nom:'SUAP · Urgences vitales', icone:'❤️', couleur:'#c2185b', source:'SDIS 34 · RT SUAP 2025 (chapitre 05)',
  fiches:[
  { titre:'Arrêt cardiaque de l’adulte', tags:'acr arrêt cardiaque adulte rcp massage cardiaque fréquence rythme par minute 30 2 compressions 100 120 5 cm 6 cm dae défibrillateur relais 2 minutes insufflation oxygène guedel pouls carotidien',
    contenu:`## Conduite à tenir
- RCP immédiate : **30 compressions / 2 insufflations**
- **DAE** le plus tôt possible ; électrodes posées **sans interrompre** la RCP ; reprendre la RCP **aussitôt** après le choc (ou l’absence de choc)
- Oxygène en insufflation (15 l/min), aspiration si besoin, **Guedel systématique** (SDIS 34)
- **Relais toutes les 2 minutes**, pendant l’analyse du DAE
## Compressions de qualité
- Talon de la main sur la **moitié inférieure du sternum**, bras tendus, coudes verrouillés
- **100 à 120 / min**, profondeur **≈ 5 cm sans dépasser 6 cm**
- Temps de compression = temps de relâchement, thorax qui revient bien
## Organisation
- À 2 avec DAE : l’un masse, l’autre pose le DAE et demande le renfort après la 1re analyse
- À 3 ou plus : alerte, massage et DAE **en même temps**
## Reprise d’activité
- Pouls perçu mais respiration absente ou ≤ 6/min : arrêter les compressions, **10 insufflations / min**, contrôler le pouls en continu
- Respiration normale, mouvements, yeux ouverts : arrêter la RCP, garder la victime **sur le dos**, surveiller, prêt à reprendre (récidive fréquente)
> Les gants sont souhaitables mais ne doivent jamais retarder la RCP.` },
  { titre:'ACR de l’enfant, du nourrisson et du nouveau-né', tags:'acr enfant nourrisson nouveau-né juste-né rcp pédiatrique 5 insufflations 15 2 3 1 40 insufflations 1 minute fréquence cardiaque 60 100 noyade dae',
    contenu:`## Tableau SDIS 34
| | Juste-né / nouveau-né | Nourrisson | Enfant | Adulte |
| Début | 40 insufflations à l’air en 1 min | 5 insufflations | 5 insufflations | Compressions (sauf **noyade** : 5 insufflations) |
| RCP | **3 / 1** | **15 / 2** | **15 / 2** | **30 / 2** |
| DAE | **Non** | Oui | Oui | Oui |
| Pouls central | Fémoral | Carotidien | Carotidien | Carotidien |
- Pendant les insufflations initiales, guetter toux, mouvement ou reprise de la respiration
- Compressions : nourrisson et nouveau-né **un tiers du thorax (≈ 4 cm)**, 2 doigts (seul) ou 2 pouces (en équipe) ; enfant **≈ 5 cm**, talon d’une main
- Pouls présent sans respiration : nourrisson **25 à 30** insufflations/min, enfant **15 à 25**/min
## Nouveau-né à la naissance
- En bonne santé (cri, tonus) : peau à peau sur la mère, clamper le cordon **après 1 minute** au moins, sécher, couvrir la tête
- Pas en bonne santé : clamper, libérer les voies aériennes, **40 insufflations à l’air en 1 minute**
| Fréquence cardiaque | Conduite |
| < 60 /min | RCP 3 compressions / 1 insufflation (120/min), O2, **sans DAE** |
| 60 à 100 /min | Insufflations seules, réévaluer chaque minute |
| > 100 /min | Surveillance étroite |` },
  { titre:'Détresses circulatoire, respiratoire et neurologique', tags:'détresse circulatoire respiratoire neurologique position allongée demi-assise oxygène couverture surveillance',
    contenu:`| Détresse | Position | Gestes |
| **Circulatoire** | Allongée **horizontale** | Arrêter l’hémorragie, O2 selon SpO2, couvrir et réchauffer, surveiller conscience, pouls, PA |
| **Respiratoire** | **Assise ou demi-assise** (position de confort) | Désobstruer si besoin, desserrer les vêtements, O2 selon SpO2 |
| **Neurologique** | Allongée | O2 si besoin, protéger du froid, surveiller l’état neurologique |
- Sans SpO2 mesurable : O2 jusqu’à l’avis médical
- Détresse circulatoire : risque d’**arrêt brutal à la mobilisation** (relevage, brancardage)
- Victime qui perd connaissance : respire → perte de connaissance ; ne respire pas → ACR` },
  { titre:'Hémorragies : compression, garrot, PCU', tags:'hémorragie externe compression manuelle pansement compressif garrot 5 7 cm heure point compression distance fémoral humérale carotidien pcu pansement compressif urgence cou aisselle aine fesse crâne section membre',
    contenu:`## Hémorragie externe
- Gants, puis **compression manuelle** directe
- Efficace → **pansement compressif**
- Inefficace ou impossible → **garrot** (zone garrotable) ; au SDIS 34 pas de gaze hémostatique
- Couvrir et réchauffer, surveiller
- Fracture ouverte ou corps étranger : **ne pas y toucher** ; saignement massif → garrot
## Garrot
- À **5 à 7 cm** de la plaie, entre la plaie et la racine du membre, **jamais sur une articulation**
- Serrer jusqu’à l’arrêt du saignement, **noter l’heure** (garrot, fiche, front si nombreuses victimes)
- **Desserré seulement sur ordre d’un médecin**
- Saignement qui persiste : resserrer, puis **2e garrot** entre le 1er et la racine du membre
@schema garrot
## Points de compression à distance (SDIS 34)
- En attendant le garrot ou le pansement compressif
- **Pli de l’aine** (fémoral) : poing, bras tendu à la verticale
- **Face interne du bras** : pouce vers l’os, légère rotation
- **Base du cou** (carotidien) : pouce sans écraser la trachée, doigts derrière le cou
## Pansement compressif d’urgence (PCU)
- Pour les zones **non garrotables** : cou, aisselle, aine, fesse, crâne
- **Cou** : jamais circulaire, la bande passe sous l’**aisselle opposée**
- **Aisselle** : combler le creux avec des compresses, poser un **collier cervical** puis passer la bande sur le collier
- Reprise du saignement : recomprimer, refaire le pansement, alerter un médecin
## Section de membre
- Garrot privilégié, pansement compressif sur le moignon, victime isolée du sol et couverte
- Membre : champ stérile → sac étanche → sac isotherme avec froid **sans contact direct** ; noter nom et heure` },
  { titre:'Hémorragies extériorisées', tags:'saignement nez épistaxis bouche oreille vaginale anal femme enceinte côté gauche',
    contenu:`| Origine | Conduite |
| **Nez** (petit choc) | Assis, tête penchée en avant, se moucher fort, comprimer les narines **10 minutes**, respirer par la bouche ; sinon avis médical |
| Nez (choc violent) | Conduite du traumatisme de la face |
| **Bouche** | Allongée sur le côté (demi-assise si détresse respiratoire) |
| **Oreille** | Conduite du traumatisme du crâne |
| **Vaginale** | Allongée (côté **gauche** si grossesse), couleur de l’écoulement, grossesse et antécédents, protections absorbantes |
| Anale et autres | Allongée, protections absorbantes |` },
  { titre:'Obstruction des voies aériennes', tags:'obstruction voies aériennes corps étranger claques dos compressions abdominales heimlich thoraciques nourrisson obèse femme enceinte partielle complète',
    contenu:`## Obstruction partielle (la victime tousse, parle)
- **Jamais de désobstruction**, position de confort, encourager à tousser, O2 si besoin
- Passer à l’obstruction complète si la toux devient inefficace, si l’obstruction devient complète ou si la respiration s’arrête
## Obstruction complète, victime consciente
- Laisser debout ou assise
- **1 à 5 claques dans le dos**
- Puis **1 à 5 compressions** :
| Victime | Compressions |
| Adulte, enfant | Abdominales (Heimlich) |
| Nourrisson | Thoraciques |
| Obèse, femme enceinte, personne alitée | Thoraciques |
- Répéter jusqu’à toux, cris, pleurs, reprise de la respiration ou rejet du corps étranger
- Après : position de confort, surveillance, **avis médical systématique**
## La victime perd connaissance
- L’accompagner au sol, RCP en **commençant par les compressions** quel que soit l’âge
- Regarder dans la bouche à la fin de chaque cycle, retirer le corps étranger s’il est accessible` },
  { titre:'Perte de connaissance et PLS', tags:'perte connaissance pls position latérale sécurité respire traumatisme sur le dos femme enceinte gauche aspiration',
    contenu:`## Respire, pas de traumatisme suspecté
- **PLS** (femme enceinte : sur le **côté gauche**)
- Aspiration si encombrement, O2 si besoin, protéger du froid, surveiller la respiration
## Respire, traumatisme suspecté
- **Laisser sur le dos**, stabiliser la tête à deux mains, voies aériennes libres en permanence
- Avis médical ; PLS **à deux secouristes seulement sur indication médicale**
- Une palpation rapide aide à choisir le côté du retournement
## Ne respire pas ou respiration anormale
- Conduite de l’**arrêt cardiaque**` }

  Q("Pansement compressif d’urgence du cou :",["Jamais circulaire, bande sous l’aisselle opposée","Circulaire autour du cou","Sur le collier cervical","Interdit"],0,"Un point de compression carotidien précède la pose."),

{ id:'suap-malaises', nom:'SUAP · Malaises et atteintes circonstancielles', icone:'🌡️', couleur:'#7b1fa2', source:'SDIS 34 · RT SUAP 2025 (chapitres 06-07)',
  fiches:[
  { titre:'AVC, convulsions, asthme', tags:'avc accident vasculaire cérébral horizontale glycémie unité neuro-vasculaire convulsions crise épilepsie nourrisson fièvre asthme aérosol',
    contenu:`## AVC
- Victime consciente avec signes d’AVC : **strictement à plat** (PLS si nausées ou vomissements ; 2/3 ont des troubles de la déglutition)
- O2 si besoin, **glycémie**, éléments spécifiques au 4e regard, avis médical
- Garder la même position pendant le transport ; objectif : **unité neuro-vasculaire**
## Crise convulsive
- **Ne jamais contraindre** les mouvements ; allonger au sol, écarter les objets et les personnes
- Protéger la tête, **rien dans la bouche** (elle n’avalera pas sa langue)
- Après : voies aériennes, respiration ; PLS si elle respire, RCP sinon
- Noter **l’heure et la durée**, glycémie après la crise, bilan
- Nourrisson : en plus, **température**, le découvrir, linges humides sur le front et la nuque, bilan systématique
## Crise d’asthme
- Soustraire au déclencheur, position **assise ou demi-assise**, rassurer
- Aider à prendre son **aérosol**, O2 si besoin, avis médical` },
  { titre:'Douleur thoracique, hypoglycémie, allergie, malaise', tags:'douleur thoracique hypoglycémie diabétique sucre 4 morceaux 15 minutes allergie anaphylaxie adrénaline auto-injecteur malaise vagal manœuvres physiques',
    contenu:`## Douleur thoracique
- Selon la détresse : respiratoire (assis) ou circulatoire (allongé)
- Sans détresse : **repos immédiat**, position de confort, O2 si besoin, avis médical après le 4e regard, PA aux deux bras
- Traitement habituel donné à la demande de la victime ou du médecin régulateur
## Hypoglycémie du diabétique
- Glycémie **< 0,6 g/l** (ou cause inconnue) et victime réveillée qui avale : **sucre**
- Adulte : **4 morceaux** ou cuillères ; enfant : **2 à 3**
- Effet en **10 à 15 minutes** ; sans amélioration au bout de 15 min, 2e dose
## Réaction allergique grave
- Supprimer le contact avec l’allergène
- Traiter la détresse (respiratoire : assis ; circulatoire : à plat ; ACR)
- **Auto-injecteur d’adrénaline** à la demande de la victime ou du médecin ; 2e injection possible après **10 à 15 minutes** sans amélioration
## Malaise
- Repos (allongé le plus souvent, assis si gêne respiratoire), rassurer, protéger, avis médical
- Malaise **vagal** connu : manœuvres physiques (s’accroupir, croiser les jambes, crocheter les doigts en tirant)` },
  { titre:'Chaleur, hypothermie, gelures', tags:'chaleur crampe insolation coup de chaleur 39,4 hypothermie réchauffement passif actif défibrillation 3 chocs 30 °c gelures 37 39 °c',
    contenu:`## Affections liées à la chaleur
- Soustraire à la chaleur ; sans détresse : réhydrater (boisson sucrée et salée)
- **Crampe** : froid, étirements doux, massage
- **Insolation, coup de chaleur** : déshabiller (garder les sous-vêtements), ventiler, mouiller avec de l’eau à température ambiante, linges froids, glace aux plis de l’aine, aisselles, tête, nuque (jamais au contact direct)
- Coup de chaleur : objectif **< 39,4 °C**, avis médical sans délai
## Hypothermie
- Abri, retirer les vêtements mouillés **très délicatement** (risque d’arrêt cardiaque)
- ACR : rechercher les signes de vie **pendant 1 minute** ; thorax rigide ; **3 chocs maximum** tant que la température est < 30 °C
- Légère (frissons) : réchauffement **passif** (drap + couverture)
- Modérée ou sévère (sans frissons) : réchauffement **actif**, O2, évacuation rapide, mobilisation sans à-coups
## Gelures
- Abri, prévenir l’hypothermie, retirer bagues, gants, chaussures ; **ne pas frictionner**
- Gelures mineures : contre la peau du sauveteur 10 minutes
- Ne réchauffer que sans risque de nouveau froid : eau entre **37 et 39 °C** pendant 20 à 30 minutes ; jamais de chaleur sèche` },
  { titre:'Noyade, pendaison, électricité, plongée, explosion', tags:'noyade 5 insufflations pas de désobstruction mousse pendaison strangulation preuves accident électrique haute tension véhicule ligne foudre plongée 15 l/min eau plate aspirine explosion souffle',
    contenu:`## Noyade
- Sauvetage en sécurité (alerter, ne pas entrer seul, matériel de flottaison)
- ACR : **5 insufflations** puis RCP ; compressions **hors de l’eau** seulement
- O2 **15 l/min** ; **sécher le thorax** avant le DAE
- **Jamais de claques ni de Heimlich** ; la mousse aux lèvres ne gêne pas
- Régurgitation : tourner sur le côté, vider la bouche, aspirer
## Pendaison, strangulation
- Soutenir la victime, desserrer le lien, allonger en limitant les mouvements du cou
- **Ne pas jeter ni déplacer les objets** (preuves) ; forces de l’ordre si besoin
## Accident électrique
- **Ne pas toucher** la victime tant que le courant n’est pas coupé (haute tension : attendre l’exploitant)
- Véhicule touché par une ligne : les occupants **restent dedans**
- La victime de la **foudre** peut être touchée sans danger
- Brûlures : traiter comme thermique **et** électrique ; femme enceinte à signaler
## Accident de plongée
- Sortir et déséquiper, O2 **MHC 15 l/min** quelle que soit la SpO2
- **Eau plate 0,5 à 1 l** en une heure (sauf trouble de conscience ou vomissements) ; aspirine sur avis médical
- Recueillir : profondeur, durée, paliers, ordinateur, plongées des 24 h
## Explosion
- Sécurité ; bilan **systématique** pour toute personne exposée au souffle (lésions retardées)` },
  { titre:'Intoxications, piqûres et morsures', tags:'intoxication ne pas faire vomir opiacés naloxone 14 ans myosis environnement toxique piqûre abeille dard méduse vinaigre eau chaude vive rascasse serpent tique morsure',
    contenu:`## Intoxications
- Rechercher le produit, la dose, l’heure ; garder les emballages
- **Ne pas faire vomir, ne pas faire boire**
- **Opiacés** (respiration lente, troubles de conscience, **myosis**) : O2, retirer les patchs, ventiler si FR < 6, **naloxone intranasale à partir de 14 ans**, à renouveler après 2 à 3 minutes
- Environnement toxique : se protéger, sortir la victime, agir **à distance** de l’atmosphère toxique
## Piqûres d’insectes
- Retirer le dard sans écraser la poche à venin, retirer les bagues, froid
- Bilan **urgent** si piqûre dans la bouche ou la gorge (sucer de la glace) ou si allergie connue
## Animaux marins
- **Méduse** : retirer les filaments avec un gant, **vinaigre**, mousse à raser ou sable puis racler avec une carte, puis **eau chaude**
- **Vive, rascasse** : eau chaude **30 minutes** au moins
## Serpent
- **Jamais d’aspiration** ni de sérum ; allonger, calmer, immobiliser le membre, retirer les bagues, laver sans frotter, pansement
## Autres
- Morsure animale ou humaine : laver, traiter comme une plaie grave
- Tique : tire-tique, consulter si rougeur ou éruption` },
  { titre:'Accouchement inopiné et nouveau-né', tags:'accouchement inopiné femme enceinte côté gauche contractions poche des eaux délivrance placenta cordon clamper nouveau-né peau à peau transport juste-né',
    contenu:`## Avant l’accouchement
- Femme enceinte **sur le côté** (jamais sur le dos)
- 4e regard : suivi de grossesse, accouchements précédents, terme, grossesse multiple, présentation, **heure et fréquence des contractions**, perte des eaux (heure, couleur)
- Avis médical : transport allongée sur le côté et ceinturée, ou accouchement sur place
## Accouchement sur place
- Préparer serviettes, récipient, matériel de réanimation (O2, BAVU pédiatrique, aspiration, oxymètre)
- Gants, masque, lunettes
- Faire pousser pendant les contractions ; à la **moitié de la tête**, arrêter de faire pousser et retenir doucement la tête
- Vérifier un **circulaire du cordon** et le dégager ; ne jamais tirer sur l’enfant ; noter l’**heure de naissance**
## Délivrance
- Ne tirer ni sur le placenta ni sur le cordon ; le recueillir et l’apporter à l’hôpital
- Surveiller l’**hémorragie** après la délivrance
## Nouveau-né
- Peau à peau sur la mère, sécher, bonnet ; clamper le cordon après **1 minute** au moins s’il va bien
- Transport (SDIS 34) : maman ceinture ventrale, bébé **peau à peau** ; code de la route sans critère d’urgence` },

{ id:'suap-trauma', nom:'SUAP · Traumatismes et nombreuses victimes', icone:'🦴', couleur:'#5d4037', source:'SDIS 34 · RT SUAP 2025 (chapitres 08 et 11)',
  fiches:[
  { titre:'Brûlures (règles SDIS 34)', tags:'brûlure simple grave cloque wallace 9 18 4,5 main 1 % refroidissement 30 minutes 10 20 minutes eau tempérée gel d’eau 15 minutes chimique 20 minutes électrique inhalation voies aériennes',
    contenu:`## Simple ou grave ?
- **Simple** : rougeur chez l’adulte, ou cloque plus petite que la **moitié de la paume** de la victime
- **Grave** : cloques plus grandes, peau blanchâtre, cartonnée ou noirâtre, brûlure **circulaire**, visage, cou, mains, articulations, orifices naturels, voies aériennes (traces noires, toux, voix rauque), électrique ou radiologique ; rougeur étendue chez l’enfant
## Surface (règle des 9 de Wallace)
- Face avant du tronc de l’adulte = **18 %** ; un membre supérieur de l’enfant = **9 %** ; un avant-bras de nourrisson = **4,5 %**
- Main de la victime = **1 %**
## Refroidir
- Le plus tôt possible, si la brûlure a **moins de 30 minutes**, à l’**eau tempérée** qui ruisselle sans pression
- Brûlure grave : **10 minutes minimum, idéalement 20** ; arrêter dès que la victime a froid ou frissonne
- Brûlure simple : jusqu’à la disparition de la douleur
! Pas de refroidissement si : victime inconsciente, détresse circulatoire (pas de pouls radial ou PA < 80), surface brûlée **> 20 % chez l’adulte** ou **> 10 % chez l’enfant**, ou aucun moyen de réchauffer ensuite.
- Gel d’eau (WaterGel, BrulStop) : à retirer après **15 minutes**, sauf visage, mains et pieds
## Ensuite
- Retirer vêtements et bijoux non collés, **ne pas percer les cloques**, film plastique ou champ stérile, couverture isotherme
- **Chimique** : retirer les vêtements imbibés en se protégeant, laver **20 minutes** ; œil : rincer sans couler sur l’autre œil
- **Électrique** : points d’entrée et de sortie, traiter comme une brûlure thermique
- **Ingestion** : sur le côté, ne pas faire vomir ni boire ; **inhalation** : surveiller la respiration (aggravation retardée)` },
  { titre:'Plaies, thorax, abdomen, face', tags:'plaie grave simple corps étranger thorax pansement non occlusif 3 côtés soufflante abdomen éviscération jambes fléchies œil dent lait face cou',
    contenu:`## Plaies
- Plaie grave : **ne jamais retirer un corps étranger**, pansement stérile (humidifié si détresse)
- Plaie simple : se laver les mains, gants, nettoyer à l’eau (savon si souillée), pansement ; vaccin antitétanique
- Injection sous pression : nature du produit et pression, avis médical
## Thorax
- Gêne respiratoire : **assis ou demi-assis**
- Plaie : **pansement non occlusif à 3 côtés** (SDIS 34) : emballage étanche collé sur 3 côtés, le **bas reste libre**
- Plaies multiples : un pansement par hémithorax sur la plaie soufflante la plus haute ; plaie transfixiante : un sur chaque plaie soufflante
- Corps étranger laissé en place, sauf s’il empêche la RCP
## Abdomen
- À plat dos, **jambes fléchies** ; ne pas retirer de corps étranger
- **Éviscération** : ne pas remettre les viscères, champ stérile humidifié au sérum, sans comprimer
- Femme enceinte victime d’un choc violent : considérée comme traumatisée de l’abdomen
## Face et cou
- Toute plaie de la face ou du cou est grave ; cou : ne pas comprimer la trachée
- **Œil** : immobile, les deux yeux couverts sans appuyer, ne jamais retirer un corps étranger
- **Dent** : la saisir par la couronne, rincer 10 s maximum, la transporter dans un film alimentaire ou du **lait** (pas d’eau)` },
  { titre:'Bassin, crâne, rachis, membres', tags:'bassin ceinture pelvienne trochanters symphyse avis médical crâne casque rachis immobilisation critères 65 ans membres attelle dépression froid fracture ouverte pouls pédieux compression membre 4 heures',
    contenu:`## Bassin
- Allongé strict, examen par **palpation douce sans pression** (SDIS 34)
- Suspicion : traumatisme à haute cinétique + douleur du bassin ou du bas-ventre
- **Ceinture pelvienne sur avis médical** ; sans avis possible et détresse circulatoire : la poser
- Centrée sur les **grands trochanters**, fermée sur la **symphyse pubienne**, en 3 à 5 minutes ; elle reste en place à l’hôpital
- Pas de ceinture pour : fracture du col du fémur, haut de cuisse, chute de sa hauteur
- Immobilisation sur **matelas à dépression**
## Crâne
- Tête en position neutre, **retirer le casque**, O2 si besoin, surveillance (aggravation brutale possible)
## Rachis (dos et cou)
- L’immobilisation ne passe **jamais avant une détresse vitale**
- Immobiliser tout le corps si : réponses **non fiables** (conscience altérée, alcool, lésions multiples, communication difficile), **signes d’atteinte** du rachis ou de la moelle (douleur, déficit, fourmillements…), ou traumatisme à haut risque chez un **plus de 65 ans** ou avec des antécédents du rachis
## Membres
- Membre inférieur : allongé ; membre supérieur : assis, bras contre la poitrine
- **Attelle à dépression** (SDIS 34) immobilisant les articulations au-dessus et en dessous
- Froid sauf fracture ouverte ; fracture déformée : immobiliser **en respectant la déformation**
- Contrôler les **pouls pédieux et tibial postérieur** (SDIS 34)
## Compression de membre
- Évaluer la durée ; avis médical ; garrot seulement dans des circonstances exceptionnelles (sans avis possible, compression **> 4 heures**)` },
  { titre:'Nombreuses victimes : repérage', tags:'nombreuses victimes repérage triage noir rouge jaune vert prv catastrophe 10 100 respiration 30 pouls 120 15 secondes orsec',
    contenu:`## Définition
- Accident catastrophique à effet limité : **10 à 100 victimes**, moyens temporairement insuffisants
## Actions
- Reconnaître le site, assurer la sécurité, **transmettre et demander des renforts**, repérer les victimes, faire les gestes les plus urgents
## Repérage (victime par victime, en commençant par la plus proche)
| Couleur | Victime |
| **Noir** | Décès certain, ou inconsciente qui **ne respire pas** après libération des voies aériennes ; ne pas la déplacer |
| **Rouge** | Inconsciente qui respire (PLS), hémorragie, ou consciente avec **détresse vitale** |
| **Jaune** | Consciente, sans détresse, **ne peut pas se déplacer** |
| **Vert** | Sans détresse, **se déplace** seule ou aidée → point de regroupement (PRV) |
- Apprécier respiration et circulation **15 secondes maximum** chacune
- Détresse chez l’adulte : respiration **> 30/min** ou pouls **> 120/min**
- Gestes autorisés : arrêter l’hémorragie, libérer les voies aériennes, PLS, position d’attente ; puis victime suivante` }

{ id:'jsp1', nom:'JSP 1 · Premiers pas', icone:'🧒', couleur:'#f57c00', source:'Cours JSP SDIS 34 · JSP 1', groupe:'jsp',
  fiches:[
  { titre:'L’organisation nationale de la sécurité civile', tags:'sécurité civile DOS COS maire préfet zone sud ORSEC PCS DICRIM PFMS SDIS BSPP BMPM UIISC SAMU numéros urgence 18 112 15 17 114 196 DGSCGC COGIC Nîmes-Garons Dragon',
    contenu:`## La sécurité civile, c’est quoi ?
- **Prévenir** les risques, **informer et alerter** la population, **protéger** personnes, animaux, biens et environnement, **secourir** les victimes
- Loi : « **toute personne concourt par son comportement à la sécurité civile** » : le **citoyen est le 1er maillon** (je vois, j’alerte, j’agis, j’aide)
## Qui décide ? (plus la crise est grande, plus on monte)
| Niveau | Territoire |
| **Maire** | Sa commune |
| **Préfet du département** | Tout l’Hérault |
| **Préfet de zone** | Plusieurs départements (zone **Sud**, état-major à Marseille) |
| **Ministre de l’Intérieur** | Toute la France (DGSCGC, centre COGIC) |
- **DOS** = directeur des opérations de secours : le **maire** (ou le **préfet** si c’est plus grave). Il décide : évacuer, fermer une route, héberger
- **COS** = commandant des opérations de secours : un **sapeur-pompier** (chef d’agrès puis officier). Il commande sur le terrain et rend compte au DOS
## Les plans
- **ORSEC** : plan du préfet ; **PCS** (plan communal de sauvegarde) : plan du maire ; **PFMS** : plan familial de mise en sûreté ; **DICRIM** : document qui explique les risques de la commune
## Les acteurs
- **Un SDIS par département** (SDIS 34) ; pompiers militaires : **BSPP** (Paris), **BMPM** (Marseille), **UIISC**
- SAMU (15), gendarmes et policiers, associations (Croix-Rouge, Protection civile…), réserves communales
- Renforts de l’État : avions (base de **Nîmes-Garons**), hélicoptères **Dragon**, colonnes de renfort d’autres départements
- Chiffres 2024 : **256 400** sapeurs-pompiers dont **78 % volontaires**, **4,7 millions** d’interventions, **8 sur 10** pour du secours aux personnes
## Numéros d’urgence
| 18 | Pompiers |
| 112 | Urgence en Europe |
| 15 | SAMU |
| 17 | Police, gendarmerie |
| 114 | Par SMS |
| 196 | Urgence en mer |
> Le maire **dirige**, le pompier **commande** sur le terrain.
! Un faux appel est un délit : il bloque une ligne pour une vraie urgence.` },

  { titre:'Premiers secours citoyens (PSC)', tags:'PSC premiers secours protéger alerter étouffement obstruction hémorragie garrot PLS inconscience arrêt cardiaque massage DAE défibrillateur malaise brûlure plaie traumatisme 30/2',
    contenu:`## Protéger
- **Pas de sauveteur blessé** : je regarde le danger, je le supprime si je peux sans risque, je protège tout le monde
- **Dégagement d’urgence** seulement si le danger est réel, immédiat et impossible à supprimer
## Alerter
- **18** pompiers, **15** SAMU, **112** urgences en Europe, **114** par SMS
- Message : numéro d’où j’appelle, ce qui se passe et **combien de victimes**, **adresse précise** ; je ne raccroche que quand on me le dit
## Urgences vitales
- **Étouffement** (ne peut plus parler, tousser, respirer) : **1 à 5 claques dans le dos** puis **1 à 5 compressions abdominales** ; nourrisson : tête vers le bas, claques puis compressions sur la poitrine avec **2 doigts**
- **Saignement abondant** : j’appuie fort (main protégée), j’allonge, j’alerte, je ne relâche pas ; **garrot** seulement si appuyer ne suffit pas, sur un bras ou une jambe
- **Ne répond pas mais respire** : **PLS** (bouche vers le sol), j’alerte, je surveille la respiration sans arrêt
- **Arrêt cardiaque** (ne respire plus) : j’alerte et demande un **DAE**, je masse au centre de la poitrine **100 à 120 fois/min**, **30 compressions / 2 insufflations** (ou massage seul)
## Autres situations
- **Malaise** : allongé (assis s’il respire mal), je questionne, j’appelle le **15** ; sucre ou médicament seulement s’il le demande ou si le médecin le dit
- **Brûlure** : eau tempérée **au moins 10 min, idéalement 20** ; aucun produit, on ne perce jamais les cloques
- **Plaie grave** : je ne retire jamais un objet planté ; assis si plaie au thorax, allongé jambes pliées si ventre
- **Traumatisme** : je ne déplace pas la victime, je lui dis de ne pas bouger, je la couvre, je surveille
> Le DAE parle et dit quoi faire : tout le monde peut l’utiliser.
! Entraînement uniquement sur mannequin : jamais de compressions ni de claques réelles sur un camarade. Ce support ne remplace pas la formation PSC officielle.` },

  { titre:'Les objectifs de l’activité physique', tags:'sport activité physique ARI 18 kg intervention binôme stress bien-être ICP visite médicale SSSM hygiène de vie sommeil',
    contenu:`## Des missions très physiques
- Feu d’appartement (tenue, ARI, chaleur, escaliers, tuyaux), désincarcération, **déblai**, porter une victime, feu de forêt en pente, interventions qui durent **toute une nuit**
## Sous l’ARI, tout est plus dur
- **Plus lourd** : jusqu’à **18 kg** d’appareil
- **Plus chaud** : on transpire, on se déshydrate
- **Plus essoufflé** : l’air de la bouteille part plus vite
- **Moins de repères** : on voit et on entend moins bien
> Un porteur entraîné consomme moins d’air pour le même effort.
## Se protéger
- **Ma sécurité** : un corps entraîné se blesse moins, fatigue moins, fait moins d’erreurs
- **Mon binôme** : je dois pouvoir le tirer, le porter, le ramener ; une équipe vaut ce que vaut chacun
- **La tête** : moins de stress, meilleur sommeil, esprit d’équipe, confiance en soi
## Toute une carrière
- **Visite médicale** par le médecin du SDIS (aptitude)
- **ICP** (indicateurs de la condition physique) : tests **chaque année**
- Sport en service au centre **et** à la maison
## Et moi maintenant ?
- Bouger chaque jour, un sport en club, bien boire et manger, bien dormir (moins d’écrans le soir)
> Les JSP en forme d’aujourd’hui sont les pompiers en forme de demain.` },

  { titre:'La préparation physique', tags:'préparation physique entraînement régularité intensité récupération échauffement retour au calme test de la parole brevet natation 50 m course 12 minutes PSSP tractions pompes ICP Luc Léger rameur',
    contenu:`## Les qualités physiques
- **Endurance**, **force**, **vitesse**, **souplesse**, **coordination**, **mental**
## Les épreuves sportives du brevet (fin de JSP4)
| Épreuve | Contenu |
| Natation | **50 m** puis sortir seul du bassin |
| Course | **12 minutes** : la plus grande distance |
| Force des bras | Tractions ou pompes, au maximum |
| Parcours sportif | **PSSP** : sauter, ramper, tirer, porter |
- Pour valider : **au moins 3 A et 1 B** sur les 4 épreuves
## Les 3 règles d’or
- **Régularité** : un peu souvent, **2 à 3 fois par semaine**
- **Intensité** : forcer un peu, mais pas trop
- **Récupération** : c’est au repos que le corps progresse
## Une séance en 3 temps
- **Échauffement** 10 à 15 min, **corps de séance** 20 à 40 min, **retour au calme** 5 à 10 min
## Le test de la parole
- Je parle facilement = effort léger ; phrases courtes = effort moyen (endurance) ; je ne peux plus parler = effort très dur, temps courts seulement
## À mon âge et sans se blesser
- Travail **au poids du corps**, pas de charges lourdes ; varier ; la technique d’abord ; augmenter petit à petit
- Toujours s’échauffer, boire avant/pendant/après, attention à la chaleur l’été, bonnes chaussures
- Sommeil : environ **8 à 10 h** par nuit ; l’eau est la seule boisson indispensable
## Progresser
- ICP des pompiers : rameur **2 000 m**, **Luc Léger**, souplesse, pompes, tractions
- Je me teste, je me fixe un objectif réaliste, je m’entraîne, je me reteste toutes les **6 à 8 semaines**
> Je me compare à moi-même, pas aux autres.
! Douleur, malaise, essoufflement anormal : je m’arrête et je le dis à l’animateur. Malade ou blessé = repos.` },

  { titre:'Les grades', tags:'grades galons hommes du rang sous-officiers officiers sapeur caporal sergent adjudant lieutenant capitaine commandant colonel BSPP BMPM JSP blanc jaune orange vert',
    contenu:`## À quoi servent les grades ?
- Savoir **qui commande**, reconnaître l’**expérience** (ancienneté, formations), organiser l’équipe, respect mutuel
## Trois familles

| Sous-officiers | Sergent, sergent-chef, adjudant, adjudant-chef | Chefs d’équipe et d’agrès |

## Les galons de poitrine
- Hommes du rang : galons **rouges** (sapeur 2e classe sans galon, 1re classe 1, **caporal 2**, caporal-chef 3)
- Sous-officiers : galons **argent** (sergent 2, sergent-chef 3 ; adjudant et adjudant-chef : 1 galon à liseré rouge)
- Officiers : **capitaine 3**, commandant 4, lieutenant-colonel 5 alternés argent et or, colonel 5 argent ; contrôleur général : feuilles de chêne
## Les pompiers militaires
- **BSPP** (Paris) : armée de **Terre** (soldat, caporal, sergent… général)
- **BMPM** (Marseille) : **Marine nationale** (matelot, quartier-maître, second-maître, maître…)
## Les JSP : un galon par année
| JSP 1 | Blanc |
| JSP 2 | Jaune |
| JSP 3 | Orange |
| JSP 4 | Vert |
## S’adresser à un gradé
- « Caporal », « Sergent » ; officier : « **Mon** lieutenant », « Mon capitaine »… ; toujours bonjour et politesse
> Rouge = sapeurs et caporaux, argent = sous-officiers et officiers.` },

  { titre:'Les comportements qui sauvent', tags:'IPCS évacuation mise à l’abri confinement autoprotection signal national d’alerte SNA sirène FR-Alert radio ASSEC détecteur DAAF inondation feu de forêt séisme nuage toxique',
    contenu:`## Sortir ou rester à l’abri ?
- **Danger à l’intérieur** (incendie) : **j’évacue** par le chemin prévu, au point de rassemblement
- **Danger dehors** (nuage toxique, tempête, intrusion) : **je me mets à l’abri**, portes et fenêtres fermées
## Évacuer un bâtiment en feu
- J’arrête tout et laisse mes affaires, je suis les **panneaux verts**, **jamais l’ascenseur**
- Fumée : je me baisse ; je ferme les portes ; au point de rassemblement on fait l’appel ; je ne retourne **jamais** à l’intérieur
- Bloqué : je ferme la porte, je bouche le bas, je me montre à la fenêtre, j’appelle le **18**
## Les signaux d’alerte
- **Alarme incendie** : on évacue ; **sirène (SNA)** : on se met à l’abri ; **FR-Alert** : message sur tous les téléphones de la zone ; **radio** : les consignes
- **SNA** : 3 fois **1 min 41 s** d’un son qui monte et descend, séparés de **5 s** ; fin d’alerte : son continu de **30 s**
- Essai : **1er mercredi du mois à midi** (un seul cycle)
## Selon le danger
- **Inondation** : monter à l’étage, ne jamais traverser une route inondée, couper gaz et électricité
- **Feu de forêt** : rester dans la maison, volets fermés, ne pas fuir en voiture dans la fumée, débroussailler
- **Nuage toxique** : s’enfermer, boucher les aérations, ni flamme ni étincelle
- **Séisme** : sous une table solide, loin des vitres ; après, sortir et couper le gaz
- **Feu à la maison** : je sors, je ferme la porte de la pièce en feu, j’appelle le 18 une fois dehors ; le **détecteur de fumée** réveille
## Aider
- Alerter : 18, 15, 17, 112, 114 ; qui je suis, où, ce qui se passe ; je ne raccroche que quand on me le dit
- **ASSEC** : élèves formés pour aider pendant les exercices et alertes au collège ; le JSP montre l’exemple
! Pas de héros : je ne vais pas dans la fumée, l’eau ou près d’un câble. Un sauveteur blessé est une victime de plus.` },

  { titre:'Les protocoles et cérémonies', tags:'cérémonie protocole 8 mai 14 juillet 11 novembre Sainte-Barbe 4 décembre garde-à-vous repos drapeau gerbe Marseillaise minute de silence ordre serré commandements',
    contenu:`## Les grandes cérémonies
| Date | Ce qu’on commémore |
| **8 mai** | Victoire de 1945 (fin de la 2nde Guerre mondiale en Europe) |
| **14 juillet** | Fête nationale (Bastille 1789, Fédération 1790) |
| **11 novembre** | Armistice de 1918, hommage aux morts pour la France |
| **4 décembre** | **Sainte-Barbe**, patronne des sapeurs-pompiers |
- Pourquoi participer : se souvenir, représenter les pompiers, être ensemble, récompenser (grades, médailles)
## Le déroulement
- Mise en place, **arrivée des autorités** (garde-à-vous), **revue des troupes**, temps forts, fin et défilé
## Les temps forts
- **Honneur au drapeau**, **dépôt de gerbe**, **minute de silence**, **Marseillaise** : au garde-à-vous, immobile
## Les positions
- **Garde-à-vous** : talons joints, pointes écartées, corps droit, bras le long du corps, **mains ouvertes, doigts serrés**, regard devant
- **Repos** : pied gauche écarté (largeur d’épaules), mains dans le dos, silencieux
## Les commandements
- « À vos rangs ! » : en ligne ; « Alignement ! » puis « Fixe ! » ; « En avant… marche ! » : départ **pied gauche** ; « Halte ! » : arrêt en deux temps
## Le comportement
- Tenue impeccable, **pas de téléphone**, ni chewing-gum ni mains dans les poches, silence, immobile, aligné, fier
> Arriver en avance, en tenue complète et propre.
! Un JSP qui se sent mal le signale discrètement à son voisin ou à l’animateur.` },

  { titre:'L’engagement citoyen', tags:'engagement citoyenneté droits devoirs valeurs cadets sécurité civile JSP SPV service civique réserve opérationnelle réserve citoyenne bénévolat brevet JSP',
    contenu:`## Les mots
- **Citoyenneté** : faire partie d’un pays avec des **droits et des devoirs** (voter à 18 ans, respecter la loi)
- **Engagement** : **choisir librement** de donner son temps et son énergie pour les autres ou pour une cause
- Valeurs : altruisme, solidarité, responsabilité, respect, courage, fierté
## S’engager dans la sécurité civile
| Dispositif | Âge / principe |
| Cadets de la sécurité civile | Au collège |
| JSP | Dès **13 ans** dans la section, 4 ans jusqu’au brevet |
| Sapeur-pompier volontaire (SPV) | Dès **16 ans**, avec l’accord des parents |
| Bénévole associatif | Amicale, Croix-Rouge… |
## Ailleurs
- **Service civique** : mission d’intérêt général de quelques mois, **16 à 25 ans**, indemnisée
- **Réserve opérationnelle** : armée, gendarmerie, police, à partir de **17 ans**
- **Réserve citoyenne** : bénévole ; et le **bénévolat** (sport, aide, environnement)
## Les JSP dans la société
- Gestes qui sauvent, prévention auprès de la famille et des copains, représenter en tenue aux cérémonies, préparer l’avenir
## Ce que ça m’apporte
- À l’école : sérieux, entraide, secourisme, esprit d’équipe
- **Brevet de JSP** : valide une grande partie de la formation de SPV
- Accès facilité au métier de sapeur-pompier professionnel
> L’engagement va au-delà du devoir : il est volontaire.` },

  { titre:'Le réseau associatif fédéral', tags:'réseau associatif amicale section JSP UDSP union départementale union régionale FNSPF fédération Œuvre des pupilles ODP loi 1901 lien social cohésion solidarité représentativité',
    contenu:`## Ne pas confondre
- **SDIS** : un **service public** qui organise les secours, forme et équipe les pompiers
- **Associations (loi 1901)** : rassemblent pompiers et familles ; entraide, sport, fêtes (loto, bal du 13 juillet, cross)

  { titre:'Les valeurs et l’éthique des JSP', tags:'valeurs éthique honnêteté solidarité respect de l’autre respect des règles altruisme efficience discrétion réseaux sociaux règlement section bienveillance',
    contenu:`## Les 4 valeurs
- **Honnêteté** : dire la vérité, reconnaître ses erreurs, ne pas tricher
- **Solidarité** : s’entraider, personne ne reste seul
- **Respect de l’autre** : camarades, animateurs, public
- **Respect des règles** : horaires, tenue, consignes de sécurité
## Les 3 règles d’éthique
- **Altruisme** : penser aux autres, aider sans rien attendre en retour
- **Efficience** : bien faire sans gaspiller (temps, énergie, matériel)
- **Discrétion** : ce qu’on voit et entend chez les pompiers **reste chez les pompiers**
## Sur les réseaux sociaux
- Jamais : photo d’un camarade sans son accord, moquerie, photo d’accident ou de victime, parler au nom de la section
- Je peux : partager les publications officielles, être fier d’être JSP avec respect, demander à un animateur
## Le collectif
- Diversité et mixité = une force ; intelligence collective ; les anciens aident les nouveaux ; bienveillance
## Les règles de la section
- Le **dimanche de 9 h à 12 h**, à l’heure ; absence excusée **par les parents**
- Tenue complète, sans bijoux ni maquillage, cheveux longs attachés
- **Ni tabac ni alcool** ; on ne circule pas seul dans les locaux ; on participe aux manifestations
- Tenue de JSP **seulement aux activités** de la section
- Sanctions graduées : réprimande, avertissement, radiation
> 4 ans, 4 galons (blanc, jaune, orange, vert), puis le brevet national de JSP.` },

  { titre:'La marche générale des opérations (MGO)', tags:'MGO marche générale des opérations 11 actions reconnaissance placement des engins sauvetage mise en sécurité établissements attaque ventilation protection déblai traces indices surveillance remise en condition COS',
    contenu:`## La MGO
- **MGO = marche générale des opérations** : **11 actions** utilisées par le **COS** pour organiser l’intervention sur un feu
- Elles n’ont **pas d’ordre imposé** : plusieurs se font en même temps (ex. sauvetage et établissement)
## Arriver
- **Reconnaissance** : où est le feu, y a-t-il des personnes, quels dangers ; **couper les énergies** (électricité, gaz) ; elle permet au chef de choisir comment attaquer
- **Placement des engins** : en sécurité, près de l’eau ; le 1er engin **dépasse l’adresse** pour laisser la place à la **grande échelle**
- **Sauvetage** : personne en **danger immédiat** (toujours prioritaire) ; **mise en sécurité** : personne pas encore menacée qu’on met à l’abri
## Éteindre
- **Établissements** : dérouler et relier les tuyaux du point d’eau à la lance, sur ordre du chef d’agrès
- **Attaque** : le binôme éteint le plus vite possible avec le moins d’eau possible
- **Ventilation** : faire sortir fumée et chaleur
- **Protection** : empêcher le feu de s’étendre, protéger voisins et biens (bâches)
## Terminer
- **Déblai** : dégager ce qui a brûlé, chercher les points chauds
- **Traces et indices** : toucher le moins possible pour aider à trouver la cause
- **Surveillance** : vérifier qu’aucun feu ne reprend
- **Remise en condition** : les pompiers boivent, se reposent, se lavent ; le matériel est nettoyé, l’engin prêt
> Arriver, éteindre, terminer : reconnaissance, engins, sauvetages / établissements, attaque, ventilation, protection / déblai, traces, surveillance, remise en condition.` },

  { titre:'La défense extérieure contre l’incendie (DECI)', tags:'DECI défense extérieure contre l’incendie PEI poteau bouche incendie couleurs rouge bleu jaune vert débit Ø100 1000 l/min réseau maillé ramifié plaque signalisation citerne maire',
    contenu:`## Le principe
- **DECI = défense extérieure contre l’incendie** : des points d’eau installés à l’avance près des bâtiments
- Le **maire** est responsable des points d’eau ; un **règlement départemental** fixe les règles ; les pompiers conseillent et utilisent
- Citerne d’un engin ≈ **2 000 L** et lance à **500 L/min** : environ **4 minutes** d’eau seulement
## Les besoins en eau
| Risque | Exemple | Eau |
| Faible | Maison isolée | **30 m³** |
| Ordinaire | Lotissement, petit immeuble | **60 m³** |
| Important | Centre ancien | **120 m³** |
## Les points d’eau incendie (PEI)
- Poteaux et bouches (sous pression), points d’eau **naturels** (rivière, canal : il faut aspirer), **artificiels** (citerne, réserve), autodéfense des entreprises
## Les couleurs des poteaux
| Rouge | Eau sous pression |
| Rouge et vert | Sous pression, eau non potable |
| Bleu | Pas de pression : il faut **aspirer** |
| Jaune | Très forte pression (plus de **8 bars**) |
| Vert | Borne de puisage : **interdite aux pompiers** |
## Les poteaux d’incendie
| Diamètre | Débit | Ouverture |
| Ø80 | 500 L/min | 13 tours |
| **Ø100** (le plus courant) | **1 000 L/min** | 13 tours |
| Ø150 | 2 000 L/min | 17 tours |
- On ouvre dans le **sens inverse des aiguilles d’une montre** ; pression de **1 à 16 bars**
- Plaque : en haut le type, dans le rond le diamètre ou débit, en bas la distance ; en route, le binôme d’alimentation repère **2 points d’eau**
## Les réseaux
- **Ramifié** : une seule arrivée (branches d’arbre), une panne prive tout le bout du réseau
- **Maillé** : tuyaux reliés en filet, l’eau arrive par plusieurs chemins (**le plus sûr**)
> 1 m³ = 1 000 litres.` },

  { titre:'Les matériels de lutte contre l’incendie', tags:'tuyaux Ø25 Ø45 Ø70 Ø110 dévidoir tournant mobile pliage Z O couronne raccords demi-raccord réduction division clé fédérale clé de barrage crépine injecteur LDT LDV 40 LDV 65 lance canon rideau mousse émulseur extincteur poudre ABC CO2',
    contenu:`## Les tuyaux
| Diamètre | Rangement | Usage |
| Ø25 | Semi-rigide sur **dévidoir tournant** | Petits feux (LDT) |
| **Ø45** | 20 m, plié en Z ou en O, ou sur dévidoir | **Attaque (LDV 40)** |
| Ø70 | 20 m en Z ou 40 m sur **dévidoir mobile** | Alimentation, attaque |
| Ø110 | 20 m en couronne, 40 m en Z, 2 m semi-rigide | Alimenter l’engin-pompe |
- Pliage **en Z** = en accordéon, se déroule en marchant ; **en O** = en rond (escaliers)
## Les jonctions
- **Demi-raccords** identiques qui s’emboîtent ; **réductions** (ex. 65 vers 40) ; **pièces intermédiaires** (65/65) ; **bouchons**
## Les accessoires hydrauliques
- **Division** : partage l’eau d’un gros tuyau vers deux plus petits
- **Clé fédérale** : ouvre un **poteau** ; **clé de barrage** : ouvre une **bouche** ; coude et retenue sur la bouche
- **Crépine** : filtre l’eau aspirée ; **injecteur** : mélange l’émulseur à l’eau
- Trajet de l’eau : point d’eau, engin-pompe (pression), division, lance
## Les lances
- **LDT** (petits feux), **LDV 40** (la plus utilisée), **LDV 65** (tenue à plusieurs), **lance canon** (très gros feux), **lance rideau** (mur d’eau), **lance à mousse** (feux de liquides)
- **LDV = lance à débit variable**
## La mousse
- **Émulseur** + **injecteur** + lance qui mélange de l’air : la mousse recouvre le liquide et l’étouffe
## Les extincteurs
- **Eau + additif** : solides ; **poudre ABC** : solides, liquides, gaz ; **CO2** : feux électriques et liquides
- Dos à la sortie, je vise la **base des flammes** et je balaie
! CO2 très froid : ne pas toucher le diffuseur. Tuyaux de 110 et dévidoir mobile lourds : porter à deux.` },

  { titre:'Les échelles à main', tags:'échelles à main coulisse 2 plans 3 plans crochets télescopique parachutes trait montants échelons 3 points de contact 660 °C aluminium',
    contenu:`## À quoi servent-elles ?
- **Sauver**, **reconnaître**, **établir** (monter un tuyau), itinéraire de secours : elles rétablissent les chemins coupés par le feu
## Les modèles
- **Coulisse 2 plans** : jusqu’au **2e étage**, la plus utilisée
- **Coulisse 3 plans** : jusqu’au **4e étage**, avec arcs-boutants
- **À crochets** : s’accroche à une fenêtre ou un balcon ; **télescopique** (VSRTU) ; grandes échelles sur camion (EPA, EPS)
## L’échelle à coulisse
- Plan supérieur qui coulisse, **montants** (côtés) et **échelons** (barreaux), **parachutes** (bloquent l’échelle dépliée), **trait** (corde pour déplier et replier), pieds
- **1 personne par plan** sauf sauvetage ; pied éloigné du mur d’environ **1/3 de la hauteur** ; parachutes enclenchés ; mains sur les **montants** en dépliant
## L’échelle à crochets
| Longueur dépliée | Environ 4,20 m |
| Poids | **15 kg** maximum |
| Échelons | **14**, espacés de 28 à 36 cm |
| Résistance | 300 kg |
- Elle ne résiste pas sur le côté : elle pend à la verticale
- Avant de monter : bien accrochée, **testée en se suspendant dessus**, plaquée ou tenue en bas ; en formation le JSP est **assuré** par une corde
## Pour toutes les échelles
- **3 points de contact**, casque jugulaire attachée et gants
- L’échelle n’isole pas : loin des **câbles électriques** ; l’aluminium fond vers **660 °C** ; attention au vent et aux gens autour
! Jamais les mains entre les échelons en dépliant ou repliant. Quelqu’un tient toujours l’échelle tant qu’une personne est dessus.` },

  { titre:'Le lot de sauvetage et de protection contre les chutes (LSPCC)', tags:'LSPCC lot sauvetage protection chutes corde 30 m 60 m sac jaune bleu harnais triangle descendeur en 8 sangles connecteurs poulie cordelette antichute entretien 10 ans',
    contenu:`## Le LSPCC
- **Lot de sauvetage et de protection contre les chutes** : sauver par l’extérieur, rejoindre une victime, puits et trous, se protéger des chutes
| Lot | Sac | Corde |
| **Engin** | **Jaune** | **30 m** |
| Échelle | Bleu | 60 m |
- Au centre : 1 lot engin dans le FPTGP, le CCFU et le VSRTU
## Le matériel principal
- **Corde** : résiste à **3 000 kg**
- **Harnais** : sécurise le sapeur-pompier
- **Triangle** : sur la victime pour la descendre ou la remonter
- **Descendeur en 8** : freine et contrôle la descente
## Le petit matériel
- Sangles **bleue (80 cm)** et **rouge (1,5 m)**, connecteurs à vis ou automatiques, poulie, cordelettes, **protection en cuir** (angles coupants), **antichute mobile** (montée à l’échelle)
## Le rangement
- **Haut** : triangle et son connecteur automatique ; **milieu** : porte-outils ; **bas** : corde **lovée** et sa protection ; rabats : un bout de corde, antichute, fiche de suivi
## Contrôler et entretenir
- Je **regarde**, je **touche** (toute la corde passe dans mes mains), je **note** dans le cahier de suivi, je **lave** (à la main, eau tiède, séché à l’ombre), je **signale**
- Textile remplacé au plus tard après **10 ans**
- Connecteur : **toujours fermé**, très solide dans sa longueur, beaucoup moins en travers
## Autres matériels de sauvetage
- Échelles, matelas de sauvetage, brancards et plans durs, cagoule d’évacuation

    contenu:`## Les fumées : l’ennemi n° 1

- La majorité des victimes d’incendie meurent **intoxiquées** par les fumées
## Deux façons de se protéger
- **Filtrer l’air** (masque + filtre) : il faut assez d’oxygène ; **jamais dans les fumées**
- **Emporter son air** (ARI) : seule solution dans les fumées
## Les appareils
- **ARI-CO** (circuit ouvert) : le plus utilisé au feu, l’air expiré part dehors
- **ARI-CF** (circuit fermé) : air recyclé, longue durée, spécialistes
- **Appareil filtrant** : poussières ou certains gaz, hors fumées

- Masque, soupape, manomètre, harnais, **bouteille d’air comprimé (pas d’oxygène pur)**, robinet, détendeur, cagoule d’évacuation
- Trajet de l’air : bouteille (forte pression), détendeur (baisse la pression), soupape (donne l’air à l’inspiration), masque
- **Sifflet** : l’air commence à manquer, **on sort tout de suite**
- Contraintes : jusqu’à **18 kg**, on voit et entend moins bien, durée limitée
## Les matériels complémentaires
- **Balise de détresse** : sonne et clignote si le porteur ne bouge plus ou s’il fait trop chaud

  { titre:'La toxicité des fumées d’incendie', tags:'fumées toxicité CO HCN monoxyde carbone cyanure suies irritants COMIX je sais je sens je vois DECOPI P3 sac rouge douche DAAF contamination',
    contenu:`## Les 5 dangers des fumées (C-O-M-I-X)
- **Chaudes** : elles brûlent et chauffent tout autour
- **Opaques** : on ne voit plus rien, on se perd
- **Mobiles** : elles se déplacent vite dans tout le bâtiment
- **Inflammables** : elles peuvent prendre feu d’un coup
- **toXiques** : elles empoisonnent celui qui les respire
- La plupart des victimes d’incendie d’habitation meurent **intoxiquées par les fumées**, pas par les flammes
## Ce qu’il y a dans la fumée
| Toxique | Ce qu’il fait |
| **CO** (monoxyde de carbone) | invisible, sans odeur, prend la place de l’oxygène dans le sang |
| **HCN** (cyanure d’hydrogène) | vient des plastiques et mousses, le corps ne peut plus utiliser l’oxygène |
| Gaz irritants | brûlent yeux, gorge, poumons |
| Suies (particules) | collent à la peau et aux tenues, certaines donnent des cancers |
- Une maison moderne pleine de plastique : feu plus rapide, fumées plus toxiques
## 4 portes d’entrée dans le corps
- **Respiration**, **peau** (cou, visage, mains, poignets), **bouche** (mains sales), **yeux**
- Après le feu, les toxiques **se collent** aux tenues, **se libèrent** (cabine, vestiaire) et **voyagent** (engin, maison)
- Signes d’intoxication : mal de tête (souvent le 1er), vertiges, nausées, toux, somnolence, perte de connaissance
## Se protéger
- **ARI** dès qu’il y a de la fumée et **jusqu’à la fin du déblai**, EPI complets (cagoule, col fermé, gants), vent dans le dos
| Niveau | Nettoyage |
| **JE SAIS** (courte expo à l’air libre) | j’aère mes EPI, je rince le matériel à l’eau |
| **JE SENS** (tenue qui sent la fumée) | brossage à sec et aération des EPI, matériel brossé à l’eau |
| **JE VOIS** (expo longue, traces visibles) | EPI dans un sac, tenue propre au retour |
- Lot **DECOPI** : demi-masque **P3**, gants jetables, **sac rouge**, lingettes
- **Douche obligatoire** au retour au centre, cabine nettoyée, engin rangé vitres ouvertes
> Une tenue qui sent la fumée n’est pas une tenue propre.
! Chez soi : DAAF obligatoire, porte fermée, rester bas, sortir puis appeler le 18 ou le 112.` },
  { titre:'Classes de feux et agents extincteurs', tags:'classes feux A B C D F agents extincteurs eau mousse poudre ABC BC CO2 sable émulseur foisonnement inhibition friteuse électrique',
    contenu:`## Les 5 classes de feux (norme NF EN 2)
| Classe | Ce qui brûle |
| **A** | solides (bois, papier, tissus) : font des braises |
| **B** | liquides (essence, gasoil, alcool, plastiques qui fondent) |
| **C** | gaz (butane, propane, gaz de ville) |
| **D** | métaux (magnésium, aluminium en poudre, sodium) |
| **F** | huiles de cuisson (friteuse, poêle) |
> A comme Arbre, B comme Bidon, C comme Cuisinière à gaz, D comme Dur, F comme Friteuse.
- Le feu électrique n’est plus une classe (ancienne classe E) : réflexe **couper le courant**
## Les agents extincteurs
- **Eau** : agit par **refroidissement** ; jet diffusé (refroidit mieux, protège le binôme), jet droit (va plus loin), **eau dopée** (additif, éteint plus vite)
- **Mousse** : eau + émulseur = solution moussante ; + air = mousse. Elle **étouffe**, **isole** les vapeurs et **refroidit**. Surtout feux B
- **Foisonnement** : combien de fois la mousse est plus volumineuse que la solution (bas, moyen, haut)
- **Poudre** ABC (polyvalente), BC, D (spéciale métaux) : bloque la réaction chimique = **inhibition** ; refroidit peu, risque de reprise
- **CO2** : chasse l’oxygène, étouffe ; ne salit pas, idéal appareils électriques ; sort très froid (environ **-78 °C**)
- **Sable** : recouvre et étouffe ; petits feux de liquides, métaux (sable bien sec)
## Le bon agent
| Classe | Agents adaptés |
| A | eau, mousse, poudre ABC (pas CO2) |
| B | mousse, poudre, CO2, sable, eau avec additif |
| C | poudre ABC, mais d’abord couper le gaz |
| D | poudre D (ou sable sec) |
| F | extincteur classe F, couvercle, couverture anti-feu |
! JAMAIS d’eau sur l’huile en feu : l’eau se vaporise et projette l’huile enflammée (boule de feu).
! Feu de gaz : on coupe le gaz, on n’éteint pas la flamme si la fuite continue (risque d’explosion).` },

## Les épreuves du brevet (fin de JSP4)
| Épreuve | A (garçons / filles) |
| Natation 50 m + sortie seul | ≤ **1’50** / ≤ 1’50 |
| Course 12 min | ≥ **2 000 m** / ≥ 2 000 m (B : 1 600 à 2 000 m) |
| Tractions | ≥ **5** / ≥ **3** |
| ou Pompes | ≥ **11** / ≥ **7** |
| PSSP (parcours sportif) | ≤ **2’30** / ≤ **2’50** |
- Pour valider : au moins **3 A et 1 B** sur les 4 épreuves
## Les 3 règles d’or
- **Régularité** : un peu souvent, 2 à 3 fois par semaine, toute l’année
- **Intensité** : forcer un peu pour progresser, pas trop pour ne pas se blesser
- **Récupération** : c’est au repos que le corps progresse (sommeil 8 à 10 h, alimentation, hydratation)
## Une séance en 3 temps
- **Échauffement** 10 à 15 min, **corps de séance** 20 à 40 min, **retour au calme** 5 à 10 min
- Test de la parole : je parle facilement = léger ; phrases courtes = moyen (endurance) ; je ne peux plus parler = très dur
- À mon âge : poids du corps, variété, technique d’abord, progression petit à petit
## Progresser
- Les SP adultes passent les **ICP** (indicateurs de la condition physique) : rameur 2 000 m, Luc Léger, souplesse, pompes, tractions
- Carnet : 1er test, objectif réaliste, entraînement, re-test toutes les **6 à 8 semaines**
> Je me compare à moi-même, pas aux autres.
! Douleur, malaise, essoufflement anormal : je m’arrête et je le dis. Fièvre ou blessure = pas d’entraînement.` },
  { titre:'Les risques de la vie courante', tags:'prévention DAAF détecteur fumée chaleur CO gaz incendie domestique évacuation confinement plan familial point rassemblement chutes accidents 18 112 114 ambassadeur',
    contenu:`## Quelques chiffres
- **234 702** incendies traités par les SP en France en 2024 ; un incendie d’habitation toutes les **2 min**
- **70 %** des incendies mortels ont lieu **la nuit** ; **8 victimes sur 10** meurent à cause des fumées
## Les 5 causes d’incendie
- Électricité (multiprises en cascade, chargeurs), gaz, chauffage (linge sur radiateur, ramonage), flamme nue (bougies), cuisson (poêle oubliée)
## Ça sent le gaz
- J’ouvre les fenêtres, je ferme le robinet, je sors tout le monde, j’appelle le **18 ou 112 dehors**
! Pas d’interrupteur, pas de sonnette, pas de flamme, pas de téléphone dans la maison : une étincelle peut faire exploser le mélange.
## Les détecteurs
- **DAAF** (Détecteur Avertisseur Autonome de Fumée) : obligatoire dans tous les logements depuis **2015**, sonne fort (**85 dB**)
- Détecteur de chaleur (cuisine, garage), détecteur de **CO** (près d’une chaudière ou d’un poêle)
- DAAF : **au plafond**, dans le couloir des chambres, **au moins un par étage**, pas en cuisine ni salle de bain ; testé **chaque mois**
## En cas d’incendie
| Situation | Conduite |
| Feu chez moi | je sors, je ferme la porte, je ne reviens pas, j’appelle dehors |
| Fumée dans l’escalier | je reste, porte fermée, linges mouillés, je me montre à la fenêtre |
- Jamais l’ascenseur ; si fumée : se baisser, sortir à quatre pattes. Numéros : **18, 112, 114** (SMS sourds et malentendants)
- Feu de poêle : couper le feu, poser un couvercle ou un linge humide essoré, laisser refroidir. **Jamais d’eau**
- Plan familial : plan avec sorties, **point de rassemblement**, numéros affichés, exercice au moins 1 fois par an
## Accidents de la vie courante
- Plus de **20 000 décès** par an en France, **1 sur 2** dû à une **chute** ; 1re cause de décès des enfants de 1 à 4 ans
- Bricolage (lunettes, gants), jardinage, produits ménagers jamais dans une bouteille à boire, piscine (barrière, alarme, surveillance), casque à vélo
> Le JSP est ambassadeur de la prévention : DAAF vérifié et plan d’évacuation en famille.` },
  { titre:'Matériels électriques et d’éclairage', tags:'groupe électrogène 3 kW VSRTU touret 25 m projecteur portatif lumaphore trépied éclairage électricité électrisation CO monoxyde moteur thermique plein carburant',
    contenu:`## Le groupe électrogène
- Sert à **éclairer**, **pomper** (pompe électrique, aspirateur à eau) et **outiller** quand il n’y a pas de courant
- Principe : carburant (essence ou gasoil) → **moteur** → **alternateur** (transforme le mouvement en électricité) → prises (**230 V**)
- VSRTU : groupe de **3 kW** (3 000 W) avec bidon, lot éclairage et **touret de 25 m**
- La somme des puissances des appareils branchés ne doit **pas dépasser 3 kW** (lire l’étiquette de chaque appareil)
## Mise en œuvre
- 1. Le placer **dehors**, loin des portes et fenêtres, sol plat et stable
- 2. Vérifier carburant, huile, état, câbles
- 3. **Dérouler entièrement le touret** (un câble enroulé chauffe et peut prendre feu)
- 4. Démarrer puis brancher les appareils un par un ; 5. surveiller ; 6. débrancher puis couper le moteur
- Plein : **moteur arrêté et froid**, pas de flamme, le bon bidon
## L’éclairage
- Pour voir les dangers, travailler ensemble, éclairer les façades, être vu sur la route
| Matériel | Où |
| 7 projecteurs portatifs sur batterie (1 par SP) | FPTGP |
| 2 projecteurs 24 V (cabine et arrière) | FPTGP |
| Lot éclairage : 1 projecteur, 1 lumaphore, 2 trépieds, touret 25 m | VSRTU |
- Trépied : pieds écartés, sol stable, câble à plat au sol, branchements au sec, **ne pas éblouir**
## Les dangers
- Le courant **brûle**, **bloque les muscles** (main collée), peut **arrêter le cœur**
- Victime électrisée : **je ne la touche pas**, je fais couper le courant, j’alerte, puis je secours
- Câble au sol : on ne s’approche pas, on fait reculer tout le monde, on alerte
- Moteur : **monoxyde de carbone**, feu, brûlure (pot d’échappement), bruit
! Groupe électrogène toujours dehors : jamais dans un garage ou une cave, même porte ouverte (CO invisible et sans odeur).
> Eau + électricité = danger : branchements au sec, mains sèches, jamais débrancher en tirant sur le câble.` },
  { titre:'Matériels d’épuisement et d’assèchement', tags:'épuisement assèchement inondation pompe électrique 15 30 m3/h crépine refoulement aspirateur raclette bâche lot VSRTU cave m3 litres',
    contenu:`## Épuiser ou assécher ?
- **Épuiser** : retirer la plus grande partie de l’eau, avec une **pompe électrique**
- **Assécher** : retirer l’eau qui reste (derniers centimètres, flaques) avec **aspirateur à eau** et **raclettes**
- Origines de l’eau : orage (épisodes méditerranéens à l’automne), crue, fuite, remontée de nappe
## La marche générale
- 1. **Reconnaître** (où, d’où, quelle hauteur, personnes en danger ?)
- 2. **Sécuriser** : couper l’électricité (et le gaz), baliser, s’équiper
- 3. **Arrêter la cause** (robinet d’arrivée d’eau) ; 4. **Protéger les biens** (surélever, bâcher)
- 5. **Épuiser puis assécher** ; 6. **Rendre compte** au chef d’agrès et conseiller l’habitant
> D’abord les personnes, puis les biens.
## Le matériel du VSRTU
| Lot | Contenu |
| Épuisement électrique | pompe **15 ou 30 m³/h**, 2 tuyaux souples de **20 m** |
| Assèchement | aspirateur électrique (tuyau + balai), 2 raclettes |
| Bâchage | bâches de **3 m × 4 m** |
- **15 m³/h = 250 L/min** ; 30 m³/h = 500 L/min ; **1 m³ = 1 000 litres**
- **Crépine** : grille sous la pompe qui empêche les cailloux d’entrer
- Volume = longueur × largeur × hauteur d’eau ; temps = volume ÷ débit (10 m³ avec 15 m³/h = **40 min**)
## Mettre la pompe en œuvre
- Couper l’électricité du local, dérouler le tuyau jusqu’au caniveau, pompe au **point bas** portée par sa **poignée** (jamais par le câble)
- Brancher hors de l’eau, câble déroulé ; personne dans l’eau pendant le pompage
- Arrêter dès que la pompe aspire de l’air : elle ne doit **pas tourner à sec**
## Dangers
- Électricité, trappes ou marches invisibles, eau sale, plafond qui tombe, courant (30 cm d’eau qui coule peuvent faire tomber), froid
! Jamais seul, sonder devant soi, pas de cuissardes (elles se remplissent d’eau). Seul un adulte formé branche.` },
  { titre:'Les échelles à coulisse', tags:'échelle coulisse 2 plans 3 plans parachutes trait piétage 1/3 65 75 degrés appui dépassement 3 points contact dresser déployer reployer FPTGP',
    contenu:`## À quoi sert-elle ?
- **Sauver**, **reconnaître**, **établir** (monter un tuyau à un étage)

- FPTGP : coulisse 2 plans grand modèle, 3 plans, crochets ; VSRTU : 2 plans, crochets, télescopique
## Les éléments
- **Plan supérieur** (coulisse sur l’autre), **montants** (côtés), **échelons** (barreaux)
- **Parachutes** : bloquent l’échelle une fois dépliée ; **trait** : corde pour déplier et replier ; **pieds**
- Coulisse 2 plans grand modèle : environ **33 kg** ; aluminium qui fond vers **660 °C**
## La manœuvre en binôme
- **Descendre** de l’engin avec l’aide du conducteur (chef d’équipe côté sommet, équipier côté base)
- **Porter** : base devant, le plus bas possible
- **Dresser** : base calée par l’équipier, le chef lève le sommet main après main
- **Déployer** : tirer le trait main sur main, enclencher les parachutes, appuyer, régler le piétage
- **Reployer** : verticale, libérer les parachutes, redescendre en contrôlant le trait, coucher
## Les règles de sécurité
- **1 personne par plan** (sauf sauvetage), sol stable, **vérifier les 2 parachutes** avant de monter
- **Piétage** : pied à environ **1/3 de la hauteur d’appui** (angle **65 à 75°**) ; test des bras tendus
- Trop droite = bascule en arrière ; trop penchée = glissade
- En incendie : appui de préférence **sans dépassement**, sur une partie solide
- Celui qui tient l’échelle (devant, mains sur les montants) ne la lâche jamais
- **3 points de contact** : 2 mains + 1 pied ou 2 pieds + 1 main
- Câbles électriques : l’échelle n’isole pas, **1 m** (basse tension) à **5 m** (très haute tension)
! Mains sur les montants pour déplier ou replier, jamais entre les échelons (doigts écrasés).
> Tenue, casque jugulaire attachée, gants, pas de bijoux ; dos droit, jambes fléchies.` },
  { titre:'Le LSPCC', tags:'LSPCC lot sauvetage protection chutes corde harnais triangle descendeur 8 sangle connecteur ancrage amarrage nœud de 8 français facteur de chute tirant d’air ordres',
    contenu:`## Le lot

## Les connecteurs
- **À vis** : relie le matériel ; **automatique** : se verrouille seul, attache la personne
- Solide dans la longueur (**2 000 kg**), beaucoup moins en travers (**750 kg**), toujours fermé

- **Point d’ancrage** (arbre, pilier, rambarde, engin calé moteur arrêté, échelle : sangle autour des 4 montants) → **amarrage** → **frein** (descendeur) → corde et **charge**

- **Nœud de 8 double** à chaque bout, bout libre ≥ **10 cm**, enlève **30 %** de résistance ; **nœud Français** : 3 tours, glisse quand on pousse, bloque quand on tire

## Se protéger des chutes
- Facteur de chute **0,3** (accroché au-dessus) recherché ; **1** à éviter ; **supérieur à 1** (accroché sous ses pieds) **interdit**
- **Tirant d’air** : au moins **1 m** de marge sous la personne ; effet de **balancier** ; rester suspendu inerte = urgence vitale

  { titre:'L’appareil respiratoire isolant', tags:'ARI ARI-CO bouteille 300 bars 270 55 sifflet masque soupape SAD détendeur manomètre cagoule RAPACE contrôle croisé capeler coiffer encliqueter contrôleur binôme sécurité zones atmosphère viciée',
    contenu:`## Pourquoi un ARI ?
- **Atmosphère viciée** : air non respirable (fumées, gaz toxiques comme le **CO**, manque d’oxygène)
- L’ARI est **isolant** : on ne respire que l’air de sa bouteille ; ARI-CO = à circuit ouvert
## Les éléments
- **Masque** (à griffes ou à filet), **soupape à la demande** (SAD), **manomètre** avec sifflet, **cagoule d’évacuation** (pour une victime)
- **Bouteille** d’air comprimé à **300 bars**, **robinet** ouvert jusqu’à la butée, **détendeur** (300 → **7 bars**), **harnais**
| Bouteille | Volume d’air |
| Composite **7,2 L** à 300 bars | **2 160 L** |
| Métallique **6 L** à 300 bars | **1 800 L** |
- C’est de l’**air** (78 % azote, 21 % oxygène), pas de l’oxygène pur
- Engagement avec au moins **270 bars** ; sifflet à **55 bars** = réserve : **on sort tout de suite**
- Côté droit : engagement (SAD, liaison personnelle) ; côté gauche : sécurité (balise, raccord en Y, cagoule, manomètre)
- **Balise** activée dès l’arrivée : sonne si le porteur ne bouge plus ou en forte chaleur
## Les contraintes
- Poids jusqu’à **18 kg**, respiration plus difficile, cœur qui accélère, stress (on consomme plus d’air)
- On voit, entend et parle moins bien : gestes et radio
- Consommation : repos **10 L/min**, effort intense 50, effort continu **105**, sauvetage **135 L/min**
- Calcul : pression × volume ÷ consommation (250 × 7,2 ÷ 105 ≈ **17 min**)
## S’équiper en binôme
- **Capeler** = mettre l’ARI sur le dos ; **coiffer** = mettre le masque ; **encliqueter** = brancher la soupape
- Contrôle croisé **RAPACE** : **R**obinet, **A**rmement (balise), **P**ression (≥ 270 bars), **A**justement, **C**ode, **É**tanchéité
- **Contrôleur** à l’entrée : enregistre noms, pression, heure d’entrée et de sortie prévue ; **binôme de sécurité** prêt à secourir
- Zones : **exclusion** (danger), **contrôlée** (entrée), **soutien** (à l’abri)
! Une seule anomalie au contrôle croisé = on ne s’engage pas. En JSP2 on s’équipe seulement, l’évolution sous ARI c’est en JSP3.` },
  { titre:'Le prompt secours', tags:'secourisme bilan circonstanciel XABCDE perte de connaissance PLS arrêt cardiaque RCP 30/2 DAE AVC détresse neurologique AES hygiène gants protection',
    contenu:`## Attitude et protection
- Rester calme, se présenter, respecter la victime, **secret**, **jamais de photo** ni de réseaux sociaux
- Après une intervention choquante : **en parler** (débriefing, soutien psychologique du SDIS)
- **Se protéger et protéger** en premier : gants à usage unique, masque et lunettes si projection, gilet haute visibilité sur la route
- Dangers : circulation, électricité, gaz, feu, effondrement ; dégagement d’urgence seulement sur ordre si danger non maîtrisable
## Hygiène
- Lavage ou friction hydroalcoolique **avant et après** chaque victime
- Piqûre ou projection de sang : je lave à l’eau et au savon, je désinfecte, je **préviens mon chef** immédiatement
## Les bilans
- Ordre : **circonstanciel**, **urgence vitale**, **complémentaire**, **surveillance**
- Circonstanciel : que s’est-il passé, danger, combien de victimes, renforts, mécanisme, témoins
| Lettre | Signification |
| **X** | hémorragie grave |
| **A** | voies aériennes |
| **B** | respiration |
| **C** | circulation |
| **D** | neurologique (conscience) |
| **E** | environnement (froid, chaleur, autres lésions) |
## Les urgences vitales
- **Perte de connaissance** (ne répond pas, respire) : libérer les voies aériennes, vérifier la respiration (**10 s** max), **PLS**, alerter, couvrir, surveiller
- **Arrêt cardiaque** (ne répond pas, ne respire pas ou anormalement) : alerter + **DAE**, **30 compressions / 2 insufflations**, **100 à 120/min**, **5 à 6 cm** chez l’adulte, DAE dès son arrivée
- **Détresse neurologique** : confusion, convulsions, visage qui tombe, bras faible, parole difficile (AVC) : **noter l’heure** du début, alerter vite
! Convulsions : on ne retient pas la victime, on écarte les objets autour.
> Respire : PLS. Ne respire pas : RCP + DAE. AVC : noter l’heure.` },
  { titre:'Les établissements', tags:'établissement alimentation manœuvre attaque tuyau Ø110 Ø70 Ø45 Ø25 LDT LDV 40 65 150 division écheveau Z O dévidoir ETB 1 2 3 binôme ordres établissez',
    contenu:`## Le chemin de l’eau
- Point d’eau (poteau ou bouche) → **engin-pompe** (met en pression) → **division** → **lance**
| Établissement | Trajet | Tuyaux |
| **Alimentation** | point d’eau → engin | Ø110 ou Ø70 |
| **Manœuvre** | engin → division | Ø70 |
| **Attaque** | division → lance | Ø45 ou Ø25 |
## Tuyaux et lances
- **Ø25/20 m** semi-rigide sur dévidoir tournant (LDT) ; **Ø45/20 m** en écheveau **Z** ou **O** ; **Ø70/20 m** plié en écheveau **Z** ; Ø70/40 m sur dévidoir mobile ; **Ø110/20 m** en couronne double
- Ø45/20 m = diamètre intérieur **45 mm**, longueur **20 m**
- **LDT** (LDV 150) : lance de premiers secours, petits feux, limitée à **40 m**
- **LDV 40** : lance d’attaque des binômes (tuyau Ø45) ; **LDV 65** : gros débit (Ø70)
- Division d’alimentation 65/65-2×40, division d’attaque 65/2×40, raccords de réduction
## Les règles
- Le moins de tuyaux possible, pas de plis ni de torsions, une **réserve au point d’attaque**
- Le long des murs et trottoirs, pas d’enchevêtrement, protéger les traversées de route
- Face au feu : pas dans l’axe d’une porte ou fenêtre, avoir de l’eau avant d’entrer
- Sur la route : baliser, gilet haute visibilité
- Lance : **à disposition**, **en cours d’établissement**, **à sec** (pas en eau), **en attente** (en eau, prête), **en manœuvre** (fonctionne)
## Les ETB en JSP2
- **ETB 1.1** : LDT ; **ETB 2** : prise d’eau (2.1 caisse, 2.2 écheveaux Z, 2.3 dévidoir mobile) ; **ETB 3.2** : LDV 40 **de plain-pied** uniquement
- Ordres : « En reconnaissance ! », « Établissez ! », « Ouvrez ! / Fermez ! », « Raccordez-Ouvrez ! »
! Vérifier que les vannes de la division sont fermées avant d’ouvrir l’eau. Jamais de jet vers une personne.
> Le binôme reste toujours ensemble et rend compte au chef d’agrès.` },
  { titre:'Les procédés d’extinction', tags:'procédés extinction refroidissement étouffement coupure alimentation soufflage dispersion inhibition part du feu triangle déblai vapeur 1700',
    contenu:`## Éteindre = casser le triangle du feu
| Procédé | Agit sur |
| **Refroidissement** | l’énergie (chaleur) |
| **Étouffement** | le comburant (oxygène) |
| **Coupure d’alimentation** | le combustible |
| **Soufflage** | la flamme |
| **Dispersion** | aide l’agent à pénétrer |
| **Inhibition** | la réaction chimique |
- 7e procédé, qui est une stratégie : **faire la part du feu**
## Les procédés un par un
- **Refroidissement** : l’eau devient vapeur et absorbe énormément de chaleur ; le procédé **le plus utilisé** (1 L d’eau donne environ **1 700 L** de vapeur)
- **Étouffement** : couvercle, couverture anti-feu, mousse, CO2, sable, fermer la porte d’une pièce en feu
- **Coupure d’alimentation** : fermer le robinet de gaz, couper une vanne, débroussailler, éloigner ce qui peut brûler
- **Soufflage** : arrache la flamme (bougie, puits de pétrole) ; seulement sur les **petits feux**
- **Dispersion** : étaler les matériaux pour que l’eau atteigne le cœur ; c’est le **déblai**
- **Inhibition** : la poudre casse la réaction chimique, agit vite mais refroidit peu
- **Part du feu** : accepter de perdre ce qui brûle déjà pour protéger ce qui peut être sauvé (maisons voisines)
## On combine les procédés
- Mousse : étouffement + refroidissement
- Feu de pièce : refroidissement (lance) + étouffement (porte fermée) + dispersion (déblai)
- Feu de garrigue : refroidissement (CCF) + coupure (débroussaillage) + part du feu
! La vapeur brûle aussi : les binômes sont protégés et dosent l’eau. Sur un gros feu, le vent attise au lieu de souffler.
> On finit toujours par le déblai : fouiller, retourner, refroidir tout ce qui peut repartir.` },
  { titre:'Comportement et réaction au feu des matériaux', tags:'matériaux bois acier béton verre plastique plâtre réaction résistance Euroclasses A1 A2 B C D E F s1 d0 R E I REI EI 30 porte coupe-feu effondrement M0 M4',
    contenu:`## Comportement des matériaux
| Matériau | Au feu |
| **Bois** | brûle, mais une couche de charbon protège le cœur : une grosse poutre tient longtemps |
| **Acier** | ne brûle pas, mais se dilate et se ramollit : peut céder d’un coup |
| **Béton** | ne brûle pas, peut éclater en surface |
| **Verre** | éclate : l’air entre et relance le feu |
| **Plastiques** | fondent, coulent en feu, fumées très toxiques |
| **Plâtre** | ne brûle pas, protège et retarde le feu |
- L’acier perd la **moitié de sa solidité vers 550 °C** ; un feu de pièce atteint **800 à 1 000 °C**
## La réaction au feu (Euroclasses)
- Le matériau s’enflamme-t-il et nourrit-il le feu ? (revêtements, décoration, mobilier)
- **A1** ne brûle pas (pierre, béton, verre), **A2** presque pas (plaque de plâtre), B, C, **D** (bois), E, **F** non classé
- Fumées : **s1** (très peu) à **s3** (beaucoup) ; gouttes enflammées : **d0** (aucune) à **d2** (beaucoup)
- Exemple : **A2-s1, d0** = très bon matériau ; ancien classement **M0** (ne brûle pas) à **M4**
## La résistance au feu
- Temps pendant lequel un mur, une porte, un plancher ou une poutre joue son rôle
- **R** = résistance (tient debout), **E** = étanchéité (bloque flammes et fumées), **I** = isolation (ne chauffe pas de l’autre côté)
- Le chiffre = minutes : porte **EI 30** (30 min), mur **REI 60** (1 h), poutre **R 90** (1 h 30)
! Une porte coupe-feu ne se cale jamais ouverte : ouverte, elle ne protège plus rien.
## Signes d’effondrement
- Fissures qui s’agrandissent, craquements, poutres déformées, plancher qui s’enfonce
> Réflexe : je préviens tout de suite mon chef et je m’éloigne avec mon binôme.` },
  { titre:'Les modes de propagation du feu', tags:'propagation conduction convection rayonnement déplacement matières enflammées saute de feu brandons fumées portes garrigue',
    contenu:`## Le principe
- La chaleur d’un feu atteint un autre combustible et devient son **énergie d’activation** : le feu s’étend
## Les 4 modes
| Mode | Comment la chaleur voyage | Comment le bloquer |
| **Conduction** | à travers la matière (poutre en métal, mur, cuillère) | refroidir, vérifier les pièces voisines |
| **Convection** | gaz chauds et fumées qui montent (étages, cage d’escalier) | fermer les portes, désenfumer |
| **Rayonnement** | à distance, dans toutes les directions, comme le soleil | rideau d’eau, s’éloigner, écran |
| **Déplacement de matières enflammées** | braises, brandons, gouttes de plastique, liquide en feu | surveiller autour, débroussailler |
- Le **métal** conduit très bien la chaleur ; bois et pierre sont isolants
- La **convection** est le mode le plus dangereux dans les bâtiments : les fumées chaudes peuvent s’enflammer plus loin
- Rayonnement : plus on est près, plus il est fort ; la lance rideau du CCF fait un mur d’eau
- **Saute de feu** : braises emportées par le vent qui allument un feu plus loin
## Dans un feu de garrigue, tout se mélange
- Rayonnement du front de flammes qui dessèche les plantes, convection de la colonne de fumée, braises emportées par le vent, conduction dans le sol et les souches (le feu couve)
> Si la fumée est dans l’escalier, on reste dans l’appartement, porte fermée.
! Avec le vent et la sécheresse, le feu peut avancer très vite.` },
  { titre:'La combustion', tags:'combustion triangle du feu combustible comburant énergie activation oxygène 21 % exothermique pyrolyse gaz flamme lente vive très vive instantanée',
    contenu:`## Définition
- La **combustion** est une **réaction chimique** entre un **combustible** et un **comburant** (l’oxygène de l’air), déclenchée par une **énergie d’activation**
- Elle produit de la **chaleur** (réaction **exothermique**), de la **lumière** (flammes, braises) et des **fumées** (chaudes, toxiques, parfois inflammables)
## Le triangle du feu
| Élément | Exemples |
| **Combustible** (ce qui brûle) | solides (bois, papier, plastiques), liquides (essence, huile, alcool), gaz (butane, propane, méthane) |
| **Comburant** | l’oxygène de l’air |
| **Énergie d’activation** | flamme, étincelle, forte chaleur, soleil avec une loupe, réaction chimique, frottement |
- Air : **78 % azote**, **21 % oxygène**, 1 % autres gaz
- Plus d’air = plus de feu (ouvrir une porte) ; moins d’air = le feu s’étouffe (couvercle)
> Pas de triangle, pas de feu : il en manque un, le feu s’éteint.
## Éteindre = casser le triangle
- Enlever le **combustible** : couper le gaz, débroussailler
- Enlever le **comburant** : couvercle, couverture anti-feu, mousse
- Enlever l’**énergie** : refroidir avec de l’eau (action principale des pompiers)
! Jamais d’eau sur de l’huile en feu : on coupe la plaque et on couvre.
## Comment naît une flamme
- 1. **Échauffement** du combustible ; 2. il dégage des **gaz de pyrolyse** ; 3. ces gaz se mélangent à l’air et s’**enflamment** ; 4. la chaleur des flammes entretient le feu
- Ce n’est pas le bois qui brûle, ce sont **les gaz qu’il dégage** en chauffant
## Les formes de combustion
- **Lente** (sans flamme : foin, braises qui couvent), **vive** (flammes), **très vive** (liquide qui s’embrase), **instantanée** (explosion d’une fuite de gaz)` },
