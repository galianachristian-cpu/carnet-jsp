<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3c6e">
<meta name="description" content="Application de révision sapeurs-pompiers : fiches, quiz, flashcards, examen blanc et recherche rapide.">
<title>Révision Pompiers 34</title>
<style>
:root{
  --navy:#1a3c6e;--navy2:#244f8f;--red:#d32f2f;--red2:#b71c1c;
  --bg:#f3f5fa;--card:#ffffff;--card2:#f8f9fc;--text:#1b2230;--muted:#5d6b82;--line:#e2e7f0;
  --ok:#2e7d32;--ko:#c62828;--okbg:#e8f5e9;--kobg:#fdecea;--warn:#a15c00;--warnbg:#fff4e0;--mark:#ffe08a;--marktext:#1b2230;
  --shadow:0 2px 12px rgba(20,30,60,.08);--radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d121b;--card:#161d2a;--card2:#1b2433;--text:#e8edf5;--muted:#9eabc0;--line:#283347;
    --okbg:#14301a;--kobg:#3b1919;--warn:#ffb74d;--warnbg:#3a2a10;--mark:#8a6a00;--marktext:#fff;--shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d121b;--card:#161d2a;--card2:#1b2433;--text:#e8edf5;--muted:#9eabc0;--line:#283347;
  --okbg:#14301a;--kobg:#3b1919;--warn:#ffb74d;--warnbg:#3a2a10;--mark:#8a6a00;--marktext:#fff;--shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
mark{background:var(--mark);color:var(--marktext);border-radius:3px;padding:0 1px}

/* Header */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,25,.55);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;width:100%;max-width:460px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red),#ff7043,var(--red))}
.top-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:20px;flex:none}
.brand{flex:1;min-width:0;text-decoration:none}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand small{opacity:.8;font-size:12px}
.icon-btn{background:rgba(255,255,255,.12);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:#fff;font-size:18px}
.icon-btn:hover{background:rgba(255,255,255,.22)}

main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;text-decoration:none;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Hero search */
.hero{background:linear-gradient(135deg,var(--navy),#2b5ca8 60%,#3a6fc2);color:#fff;border-radius:20px;padding:20px 18px;position:relative;overflow:hidden}
.hero::after{content:"🔥";position:absolute;right:-8px;bottom:-22px;font-size:110px;opacity:.12}
.hero h1{margin:0 0 4px;font-size:22px}
.hero p{margin:0 0 14px;opacity:.9}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#1b2230;border-radius:14px;padding:4px 6px 4px 14px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:10px 0;background:transparent;color:inherit;min-width:0}
.search .kbd{font-size:12px;border:1px solid #ccd3e0;border-radius:6px;padding:1px 6px;color:#5d6b82}
.search-page .search{background:var(--card);color:var(--text);border:1px solid var(--line)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.hero .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* Quick actions */
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.action{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none}
.action .ic{font-size:24px}
.action b{font-size:15px}
.action span{font-size:13px;color:var(--muted)}
.action:hover{border-color:var(--red)}

/* Themes grid */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.theme{display:flex;gap:12px;align-items:flex-start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--c);transition:transform .12s}
.theme:hover{transform:translateY(-2px)}
.theme .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
.theme b{display:block;line-height:1.25}
.theme small{color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--ok));border-radius:9px;transition:width .3s}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item:hover{border-color:var(--muted)}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--c,#546e7a) 15%,transparent);color:var(--c,#546e7a);white-space:nowrap}
:root[data-theme="dark"] .tag{filter:brightness(1.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{filter:brightness(1.5)}}
.star{background:none;border:0;font-size:22px;line-height:1;padding:4px;color:#f2b400}

/* Theme header */
.thead{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));margin-bottom:14px}
.thead .ti{font-size:34px}
.thead h1{margin:6px 0 2px}
.thead .bar{background:rgba(255,255,255,.25)}
.thead .bar i{background:#fff}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:10px;background:none;border:0;padding:0}

/* Fiche */
.fiche h3{font-size:16px;margin:18px 0 6px;color:var(--navy)}
:root[data-theme="dark"] .fiche h3{color:#8fb4ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fiche h3{color:#8fb4ff}}
.fiche p{margin:6px 0}
.fiche ul{margin:6px 0;padding-left:20px}
.fiche li{margin:4px 0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);font-weight:700}
tr:last-child td{border-bottom:0}
.callout{border-left:4px solid var(--navy2);background:color-mix(in srgb,var(--navy2) 10%,transparent);padding:10px 12px;border-radius:10px;margin:10px 0}
.callout.warn{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.callout.warn::before{content:"⚠️ "}
.callout:not(.warn)::before{content:"💡 "}

/* Quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .bar{flex:1;margin:0;height:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.timer.low{color:#fff;background:var(--red);border-color:var(--red)}
.question{font-size:19px;font-weight:700;margin:6px 0 16px;line-height:1.35}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:54px;transition:border-color .12s,background .12s}
.choice:hover:not([disabled]){border-color:var(--navy2)}
.choice .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--card2);border:1px solid var(--line);flex:none}
.choice.sel{border-color:var(--navy2);background:color-mix(in srgb,var(--navy2) 10%,var(--card))}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.ko{border-color:var(--ko);background:var(--kobg)}
.choice.ko .k{background:var(--ko);color:#fff;border-color:var(--ko)}
.choice[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px}
.feedback.ok{background:var(--okbg);border:1px solid var(--ok)}
.feedback.ko{background:var(--kobg);border:1px solid var(--ko)}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700}
.dots button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.dots button.cur{outline:2px solid var(--red);outline-offset:1px}

/* Results */
.ring{--p:0;--c:var(--ok);width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:0 auto}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;line-height:1}
.ring small{color:var(--muted);font-size:12px}
.review{border-left:4px solid var(--ko);background:var(--card);border-radius:12px;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.review.good{border-left-color:var(--ok)}
.review p{margin:4px 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:13px;color:var(--muted)}

/* Flashcards */
.flash{perspective:1200px;margin:10px 0}
.flash-in{display:grid;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 20px;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg)}
.face .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.face .big{font-size:20px;font-weight:700;line-height:1.35}
.face .ans{font-size:19px;font-weight:700;color:var(--ok);margin-bottom:8px}

/* Search results */
.answer{border:2px solid var(--red);border-radius:18px;background:var(--card);padding:16px;box-shadow:var(--shadow)}
.answer .lbl{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.answer .rep{font-size:18px;font-weight:700;margin:6px 0}
.res{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.res:hover{border-color:var(--muted)}
.res .meta{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.res p{margin:2px 0;color:var(--muted);font-size:14px}
.res b{display:block}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:42px}

/* Segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600}
.seg button.on{background:var(--navy);color:#fff}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
/* Module manœuvres */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;padding-bottom:2px}
.tab{flex:none;text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.code{font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 7px;white-space:nowrap;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.pill.ko{background:var(--kobg);border-color:var(--ko);color:var(--ko)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form-grid.one{grid-template-columns:1fr}
.form-grid label,.form-grid fieldset{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.form-grid .wide{grid-column:1/-1}
.form-grid fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.form-grid legend{font-weight:700;color:var(--text);padding:0 4px}
.form-grid label.check,.crit{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--text)}
.form-grid input:not([type=checkbox]),.form-grid select,.form-grid textarea,.res-tbl select,.res-tbl input{font:inherit;font-size:15px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.res-tbl select,.res-tbl input{font-size:13px;padding:6px 8px;min-width:110px}
.res-sel.ok{border-color:var(--ok);background:var(--okbg)} .res-sel.warn{border-color:var(--warn);background:var(--warnbg)} .res-sel.ko{border-color:var(--ko);background:var(--kobg)}
.res-tbl td,.res-tbl th{white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:center}
.crit{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card)}
.steps{padding-left:22px;margin:6px 0} .steps li{margin:6px 0}
.alert{border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px;border:1px solid var(--line);background:var(--card2)}
.alert.ko{border-color:var(--ko);background:var(--kobg)} .alert.warn{border-color:var(--warn);background:var(--warnbg)} .alert.info{border-color:var(--navy2)}
.alert.ko::before{content:"⛔ "} .alert.warn::before{content:"⚠️ "} .alert.info::before{content:"ℹ️ "}
.qa{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0} .qa summary{cursor:pointer;font-weight:600} .qa p{margin:6px 0 0}
.ai-out{white-space:pre-wrap;margin-top:10px;border:1px solid var(--navy2);border-radius:12px;padding:12px;background:var(--card2)}
.date-box{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--navy);color:#fff;padding:5px 0;line-height:1.1}
.date-box b{display:block;font-size:18px} .date-box small{font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.sit{border-left:5px solid var(--red)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;font-size:11px;font-weight:600;color:var(--muted)}
.nav a span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
.nav a.on{color:var(--red)}
.nav a.on span{filter:none;opacity:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b2230;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.foot{margin:28px 0 8px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:520px){
  .question{font-size:17px}
  .themes{grid-template-columns:1fr 1fr}
  .theme{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo" aria-hidden="true">🚒</div>
    <a class="brand" href="#/"><b>Révision Pompiers 34</b><small>Fiches · Quiz · Examens · Recherche</small></a>
    <button class="icon-btn" id="btnSearch" title="Rechercher (/)" aria-label="Rechercher">🔍</button>
  </div>
</header>
<main id="app"></main>
<nav class="nav" aria-label="Navigation principale">
  <div class="nav-in">
    <a href="#/" data-r="home"><span>🏠</span>Accueil</a>
    <a href="#/search" data-r="search"><span>🔍</span>Recherche</a>
    <a href="#/man" data-r="man"><span>🧯</span>Manœuvres</a>
    <a href="#/exam" data-r="exam"><span>📝</span>Examen</a>
    <a href="#/progress" data-r="progress"><span>📈</span>Progrès</a>
    <a href="#/more" data-r="more"><span>⚙️</span>Réglages</a>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================================
   CONTENU — doctrine nationale, adaptée au contexte de l'Hérault.
   Format des fiches : mini-markdown (## titre, - liste, | tableau |,
   > astuce, ! attention, **gras**).
   ========================================================================= */
function Q(q, choix, r, ex){ return { q, choix, r, ex }; }

const BASE = [
/* ---------------- Référentiels départementaux SDIS 34 ---------------- */
{ id:'rdeb', nom:'RDEB · Engagement des binômes', icone:'🫁', couleur:'#c62828', source:'SDIS 34 · RDEB v2 (avril 2026)',
  fiches:[
  { titre:"L'ARI-CO : nomenclature", tags:'ari ari-co bouteille 6 l 7,2 l type ii iv 300 bar avertisseur 55 manomètre indicateur pression détendeur sad soupape demande bipasse masque griffe filet raccord y cagoule évacuation 18 kg',
    contenu:`L'appareil respiratoire isolant à circuit ouvert (**ARI-CO**) est un EPI de **catégorie III**, vérifié chaque année par le GTL.
## Bouteilles (air comprimé, ogive noire et blanche)
| Type | Volume | Pression de service | Air disponible |
| Type II (métallique renforcée) | 6 L | 300 bar | 1 800 L |
| Type IV (composite, liner plastique) | 7,2 L | 300 bar | 2 160 L |
## Organes
- **Détendeur** : abaisse la pression de 300 à **7 bar ou moins**
- **Indicateur de pression** : gradué de 0 à 350 bar ; zone blanche de travail **55 à 300 bar**, zone rouge de sécurité **0 à 55 bar**
- **Avertisseur** pneumatique : déclenché à **55 bar**, 90 dB, au moins 10 s, consomme **5 l/min**
- **SAD** (soupape à la demande) avec **bipasse** (plus de 60 l/min)
- **Raccord moyenne pression Y** (flexible ≈ 1 m) et **cagoule d'évacuation** (55 l/min)
- **Masque** à griffes (fixé au casque) ou à filet, double jupe avec demi-masque intérieur
## À retenir
- Poids de l'ARI-CO : **18 kg maximum**
- Côté droit : engagement et progression ; côté gauche : sécurité et sauvetage
- Sur la bouteille : un **outil de force et déblai** pour le chef d'équipe, une **commande** pour l'équipier
- L'ARI-CO du conducteur sert de protection au conducteur, de réserve en cas de panne et de lot d'assistance en air
> Lors d'un remplacement de bouteille, la nouvelle doit afficher **270 bar ou plus**.` },
  { titre:"Contraintes du port de l'ARI", tags:'contraintes physiques physiologiques psychologiques espace mort co2 fréquence cardiaque stress consommation',
    contenu:`## Physiques
- Centre de gravité modifié, effort musculaire accru, passages étroits plus difficiles
## Physiologiques
- **Espace mort** augmenté par le masque : une partie du CO2 expiré est réinspirée
- Résistances respiratoires accrues : l'expiration demande un effort
- **Fréquence cardiaque** en hausse (effort, stress, chaleur) : déshydratation, hypoglycémie, épuisement plus rapide
## Psychologiques
- Inconfort du masque ; un porteur qui perd son calme **respire plus vite et consomme plus d'air**
## Liées à l'équipement et à l'air
- Perception, audition et communication réduites
- Durée d'intervention limitée par la **consommation** du porteur et la **capacité** de la bouteille
> L'entraînement régulier sous ARI retarde les effets de l'effort.` },
  { titre:'Habillage et contrôle croisé (RAPACE)', tags:'rapace contrôle croisé capeler coiffer encliqueter habillage binôme porteur sous ari robinet armement pression ajustement code étanchéité',
    contenu:`## Vocabulaire
- **Capeler** : porter l'ARI-CO
- **Coiffer** : placer le masque sur le visage
- **Encliqueter** : connecter la SAD au masque
- **Binôme porteur** d'ARI : masque en attente ; **binôme sous ARI** : masque coiffé et encliqueté
## Règles
- Sur engin-pompe urbain, **les deux binômes capellent** pendant le transit (sauf ordre contraire du chef d'agrès)
- Bijoux, piercings et montres sont interdits
- En attente, la SAD reste **encliquetée** sur le masque
- Le masque se coiffe **à l'air frais**, avant d'entrer en atmosphère viciée
- Binôme = un **chef d'équipe** + un **équipier**, **indissociable** en zone d'exclusion
## Contrôle croisé : RAPACE
| Lettre | Contrôle |
| R · Robinet | Bouteille ouverte jusqu'à la butée |
| A · Armement | Balise (BSD) ou indicateur (ICS) activé |
| P · Pression | Engagement initial à **270 bar ou plus** |
| A · Ajustement | EPI correctement portés |
| C · Code | Code de communication adapté |
| E · Étanchéité | Aucune fuite au masque ni à la SAD |
! Une anomalie au contrôle croisé interdit l'engagement.` },
  { titre:"Autonomie d'engagement et débits", tags:'autonomie débit consommation calcul abaque 10 50 105 135 l/min réserve 50 bar temps aller mission retour 30 min 36 min 14 min 17 min',
    contenu:`Un engagement comprend trois temps : **aller**, **mission**, **retour**.
| Situation | Débit | Autonomie à 300 bar (6 L / 7,2 L) |
| Survie, attente des secours | ≈ 10 l/min | 3 h / 3 h 36 |
| Engagement à vue | ≈ 50 l/min | 30 min / 36 min |
| Engagement avec ligne de vie (15 min max) | ≈ 105 l/min | 14 min / 17 min |
| Sauvetage (moins de 5 min) | ≈ 135 l/min | 11 min / 13 min |
## Calcul
- Autonomie = (pression d'engagement − **50 bar** de réserve) × volume ÷ consommation
- Exemple : 250 bar × 7,2 L ÷ 105 l/min ≈ **17 min**
- Les abaques du référentiel donnent l'heure de sortie prévisible au contrôleur
! Dès que l'avertisseur se déclenche, la sortie du binôme est immédiate : on n'attend pas d'arriver dans la réserve.` },
  { titre:'Enregistrement, contrôleur et binôme de sécurité', tags:'enregistrement contrôleur tgp tableau gestion personnels binôme sécurité attente engagement point engagement',
    contenu:`## Enregistrement
- Avant chaque engagement, en **zone contrôlée**, auprès du contrôleur (à défaut par le binôme, après avoir prévenu le chef d'agrès)
- Contenu : identité des porteurs, **pression d'engagement**, **heure d'entrée**, **heure de sortie prévisible**, **mission**
- Support privilégié : le **TGP** (tableau de gestion des personnels)
## Le contrôleur
- Régule **un seul point d'engagement**
- Supervise au maximum **5 binômes** : 4 engagés + 1 binôme de sécurité
- Gilet haute visibilité, radio sur la tactique de niveau 5
- En cas d'urgence : il engage le binôme de sécurité et rend compte
## Le binôme de sécurité
- Mis en place par le COS **dès que possible**, en zone contrôlée, sous l'autorité du contrôleur
- Même niveau de protection que les binômes engagés, moyen hydraulique à disposition
- **En attente** : bouteille ouverte, balise activée, masque en attente, contact visuel ou radio, maintient l'itinéraire de repli, surveille les balises, contrôle l'ouvrant d'engagement
- **Engagé** : assiste le binôme en difficulté, aide au dégagement, rend compte
- Dès qu'il est engagé, un **nouveau binôme de sécurité** est désigné
- Matériel possible : ligne de vie, caméra thermique, système de traction, outil de force, pince coupante, éclairage, assistance en air, échelle télescopique
> Un sauvetage peut justifier l'envoi immédiat d'un binôme sans contrôleur ni binôme de sécurité.` },
  { titre:'Zonage, façades et lecture du feu', tags:'zone exclusion contrôlée soutien zonage façade a b c d aiguilles montre r+5 chef secteur observation fumées chaudes opaques mobiles inflammables toxiques',
    contenu:`| Zone | Rôle |
| Exclusion | Exposition directe aux risques ; accès réservé aux équipes équipées |

| Soutien | Commandement, soutien sanitaire, reconditionnement ; hors de tout danger |

  { titre:'Ligne de vie, ligne guide et liaison personnelle', tags:'ligne vie ligne guide liaison personnelle nodule établissement ldv 40 776 m² 388 m² 60 m exploration linéaire latérale circulaire amarrage retournement croisement cat collier',
    contenu:`La **ligne de vie** assure un lien physique continu avec le point d'engagement, **par l'établissement** ou **par ligne guide** (pas les deux en même temps).
## Par l'établissement
- Établissement d'attaque Ø 45 sous pression (**LDV 40**) + liaison personnelle ou maintien physique
- Foyer à moins de **60 m** ; reconnaissance jusqu'à **776 m²** (60 m + exploration bilatérale)
## Par ligne guide
- Reconnaissance jusqu'à **388 m²** (60 m + exploration unilatérale), ou sauvetage sans moyen hydraulique
- Un moyen hydraulique reste à disposition (à sec ou en attente)
- Chaque engin-pompe urbain a **2 lignes guides** ; prolongements et dérivations : équipes **IBNB-ELD**
## Caractéristiques
| Élément | Valeurs |
| Ligne guide | 60 m, aramide, Ø 6 mm, résiste à 600 kg et 500 °C |
| Nodules (tous les 2,5 m) | **3 nodules = vers le sinistre** (IN-CEN-DIE), **1 nodule = vers la sortie** (VIE) |
| Liaison personnelle | 6 m : partie courte 1,25 m, partie longue 4,75 m |
## Rôles et techniques
- **Chef d'équipe** : garant de la sécurité collective (lance ou ligne guide, choix des amarrages)
- **Équipier** : caméra thermique
- Amarrages : initial, intermédiaires, final ; technique : **un tour mort et deux demi-nœuds**
- Retournement : le chef d'équipe finit derrière son équipier (serre-file)
- Explorations : **linéaire**, **latérale**, **circulaire** (jusqu'à 56 m² avec les 6 m de liaison)` },
  { titre:'Recherche de victimes, AIDES et marquage', tags:'aides accéder isoler désenfumer explorer sauver recherche primaire secondaire marquage r reconnu main gauche main droite eas espace attente sécurisé',
    contenu:`## Technique AIDES
Recherche pièce par pièce **depuis l'extérieur** (chambres par exemple), en ressortant entre chaque pièce :
- **A**ccéder : échelle, MEA, échelle télescopique ou plain-pied
- **I**soler : fermer la porte vers les circulations intérieures
- **D**ésenfumer : laisser ouvert l'ouvrant d'accès
- **E**xplorer : caméra thermique
- **S**auver : technique adaptée, puis sortir
## Recherche primaire (superstructure)
- 1er temps : **étage du foyer** et **ascenseurs** (ramener la cabine au RDC, porte calée ouverte)
- 2e temps : **étage au-dessus** et **dernier étage**
- 3e temps : étages intermédiaires et inférieurs
- La **recherche secondaire** se fait après la maîtrise, de façon approfondie
## Règles de déplacement
- Debout, accroupi ou à quatre pattes selon la chaleur
- Escalier dangereux : descente en **marche arrière**
- Longer les murs, sens défini : « main gauche » ou « main droite »
- Deux binômes peuvent s'engager sur la même ligne de vie (extinction + recherche)
## Marquage
- Bombe à craie : **R = Reconnu** ; absence de marquage = pièce non reconnue
- Portes refermées après reconnaissance
## EAS (espaces d'attente sécurisés, ERP)
- À l'abri des fumées, des flammes et du rayonnement ; au moins 2 par niveau` },
  { titre:'Communications radio et compte rendu', tags:'radio tth 900 dir 603 624 643 664 niveau 5 niveau 3/4 codis station directrice compte rendu je suis je vois je fais à disposition balise bsd ics',

  { titre:"Après l'engagement : réengagement et décontamination", tags:'réengagement récupération bilan suie malaise 140 25 hydratation 1,5 l décontamination souillure je sais je sens je vois p3 douche decopi exposition',

  { titre:'Gaz toxiques (CO, H2S) et bouteilles de gaz', tags:'monoxyde carbone co sulfure hydrogène h2s ppm alarme basse haute 20 100 5 10 œuf pourri bouteille gaz ogive couleur acétylène',
    contenu:`| | Monoxyde de carbone (CO) | Sulfure d'hydrogène (H2S) |

  { titre:'Réseaux électriques et gaz : distances et zonage', tags:'électricité tension tbt bt hta htb dlv distance limite voisinage enedis rte linky gaz grdf grtgaz pression zonage réflexe 50 m 100 m 200 m',

  { titre:'Parkings couverts, caves et ascenseurs prioritaires', tags:'parking stationnement couvert cave sous-sol ssiap etare véhicule électrique vea ascenseur prioritaire igh 60 secondes',
    contenu:`## Parking couvert ou cave

{ id:'smes', nom:'RDSMES · Sauvetages & mises en sécurité', icone:'🪜', couleur:'#ef6c00', source:'SDIS 34 · RDSMES v2 (avril 2026)',
  fiches:[
  { titre:'Sauvetage, mise en sécurité, sauvegarde', tags:'sauvetage mise sécurité confinement évacuation sauvegarde opérationnelle auto-sauvetage règle minimums source flux cible ibnb eld',
    contenu:`## Sauvetage
- Extraire une personne soumise à un **danger vital et imminent** qui ne peut pas s'y soustraire seule
- Il peut justifier une plus grande exposition des sauveteurs : le COS décide selon la **balance bénéfice/risque**
- **À vue** : victime visible de l'extérieur (échelles, MEA, lots de sauvetage)
- **En exploration** : accès par l'intérieur, avec moyen hydraulique et ligne de vie
## Mise en sécurité
- Éloigner du danger des personnes **non menacées immédiatement**
- **Confinement** : laisser les personnes à l'abri, là où elles sont
- **Évacuation** : les déplacer en les accompagnant
## Sauvegarde opérationnelle
- Auto-sauvetage + sauvetage de sauveteur
## Actions du COS
- Sur la **source** (coupure gaz, attaque), sur le **flux** (désenfumage, ventilation), sur la **cible** (sauvetage, évacuation, confinement)
## Règle des minimums
- Minimum de **personnels** exposés, minimum de **temps** (air disponible), minimum de **risque** (identifié avant l'engagement)
> La spécialité **IBNB-ELD** appuie les primo-intervenants : ligne guide jusqu'à 420 m, cheminements complexes, parkings, tunnels.` },
  { titre:'Échelles et moyens élévateurs aériens (MEA)', tags:'mea eps epc échelle coulisse crochets panier polygone sustentation stabilisateur sol stable instable interdit détecteur tension passage vide',
    contenu:`## Évacuation par MEA
- **Isolée** : victime dans le panier, déposée sur la voie publique
- **Multiple** : personnes valides par la structure extensible
- **Par transfert** : panier vers un niveau inférieur ou un endroit sûr proche
## MEA du SDIS 34
- **EPS** (mouvements séquentiels) et **EPC** (mouvements combinés), de 18, 24 ou 30 m
- **Polygone de sustentation** : formé par les appuis des 4 stabilisateurs ; la résultante des forces doit rester à l'intérieur
- Sol **stable** (supporte les poids lourds), **instable** (cales de stabilisation), **interdit** (bordure de trottoir, plaque d'égout, dalle de moins de 15 t)
- Dangers : heurt du panier, électrisation ; vérifier balcons, câbles, vent, foudre, brouillard
- Détecteur de tension depuis la cabine : 20 m (MEA 18), 30 m (MEA 24), 40 m (MEA 30) ; depuis le panier, alarme rouge à **10 m**
- Croisement sur la structure : celui qui **monte** s'arrête et se décale
## Passage au vide d'une victime inconsciente
- À l'échelle à coulisse : montants au ras de la structure, un sauveteur attend sur l'échelle, un binôme passe la victime ; jambes de la victime sur les épaules du sauveteur, aisselles calées par ses bras
- Au MEA : garde-corps du panier au ras de la structure, jambes de la victime dans le panier
> Anticiper les réactions de la victime au passage au vide, l'accompagner.` },
  { titre:'Itinéraires de repli, de secours et évacuation générale', tags:'itinéraire repli secours évacuation générale étage échelle coulisse 2 plans 3 plans mea 18 24 30 point regroupement',
    contenu:`- **Itinéraire de repli** : chemin inverse de la progression, reconnu et dégagé ; à utiliser **en priorité**

| Moyen | Jusqu'au |
| Échelle à coulisse 2 plans | 2e étage |
| Échelle à coulisse 3 plans | 4e étage |
| MEA 18 m | 6e étage |
| MEA 24 m | 8e étage |
| MEA 30 m | 10e étage |
- Préparer au sol les échelles à coulisse 2 plans et les échelles à crochets
- Une échelle d'itinéraire de secours n'est pas amarrée et n'est réemployée qu'en extrême urgence
## Évacuation générale
- Message : « **ÉVACUATION, ÉVACUATION, ÉVACUATION** », émis par n'importe quel intervenant, en priorité à la radio
- Sortie de la zone d'exclusion, ralliement au point de regroupement (ou à l'engin)
- Les contrôleurs font le point des binômes et rendent compte au COS` },
  { titre:'Auto-sauvetage et gestion de l\'air', tags:'auto-sauvetage imprévu attente secours saut inspiration économie air 10 l/min cagoule évacuation raccord y i assistance respiratoire passage étroit fils câbles',
    contenu:`## Analyse de l'imprévu

- Ensuite : attendre les secours ou tenter une évacuation
## Attente des secours
- Chercher le tuyau ou un ouvrant, passer un **message de détresse**
- Se signaler : lampe, balise ; se placer près du sol contre une paroi ; taper au sol ou sur un mur
- Respirer avec la technique du **saut d'inspiration** : inspirer, retenir, expirer
- En économie d'air (≈ **10 l/min**) : 300 bar ≈ 3 h (6 L) ou 3 h 36 (7,2 L)
- L'avertisseur consomme 5 l/min : on peut l'obturer avec le doigt
- Bouteille vide : retirer la SAD et remonter le bas de la cagoule sur le groin du masque

| Problème | Solution |

| Bouteille vide | Raccord moyenne pression **type Y** entre sauveteur et intervenant |

- L'air est pris sur la bouteille du sauveteur : il recalcule son autonomie
## Obstacles

- Passages étroits (seulement en évacuation imprévue) : en avant, de dos, profil réduit ; retrait de l'ARI-CO en dernier recours, robinet côté porteur` },
  { titre:'Message et appel de détresse (NELAR)', tags:'détresse urgent nelar nom engin localisation air renfort appel détresse mode direct sos dir 3 secondes 20 secondes tph 900 ber dir 1 bail-out évacuation urgence tuyau',
    contenu:`## Message de détresse
- Dès environ **30 secondes** de difficulté
- Il commence par « **URGENT, URGENT, URGENT** »
- Moyen mnémotechnique **NELAR** :
| Trame | NELAR | Contenu |
| Je suis | **N**om, **E**ngin, **L**ocalisation | S'identifier, position précise |
| Je vois | **A**ir | La détresse + la pression la plus faible du binôme |
| Je fais | | La procédure en cours |
| Je demande | **R**enfort | Les moyens nécessaires |
- Exemple : « URGENT ×3. Je suis binôme Y du FPT Z, entrée de l'appartement du RDC. Je vois plafond effondré, équipier coincé, 80 bar. Je fais position d'attente et survie. Je demande assistance respiratoire. »
- Celui qui reçoit le message **confirme** la demande pour faire baisser le stress
## Appel de détresse (mode direct)
- Si le message reste **3 fois sans réponse**

- Si personne n'acquitte en 20 s : recommencer
- On ne raccroche qu'une fois l'assistance apportée
## Évacuation d'urgence

- Par l'extérieur avec le tuyau : amarré sur une partie résistante (nœud simple en amont s'il est à sec), descente en croisant mains et pieds` },
  { titre:'Sauvetage de sauveteur', tags:'sauvetage sauveteur intervenant difficulté renfort secours abordage packaging poignée sauvetage sim traction escalier déshabillage 270 bar exclusive',
    contenu:`## Principes
- Anticiper : itinéraires de repli et de secours, binôme de sécurité, parc matériel
- Le sapeur-pompier blessé est une **victime particulière** (équipement, localisation)
- Gérer l'émotion : risque de sidération ou d'auto-engagement ; relève possible
- Demander un **renfort secours** au CODIS
## Le binôme de sauvetage
- En pleine possession de ses moyens physiques et mentaux
- Outils : **SIM**, caméra thermique, pince coupante
- Pression d'engagement **270 bar ou plus**
! Sa mission est exclusive : jamais associée à une reconnaissance ou une attaque.
## Abordage de l'intervenant
- Identifier le problème et le risque de suraccident
- Évaluer conscience et respiration
- Vérifier l'**ouverture de la bouteille** et faire un appui bref sur le **bipasse**
- Rendre compte, assister en air, préparer l'extraction ; le détacher de la ligne de vie s'il est inconscient
- « **Packaging** » : serrer fermement les bretelles de son ARI-CO

- Retirer l'ARI-CO pour remonter au tuyau, franchir un passage étroit ou extraire par une fenêtre
- **Déshabillage** d'un intervenant inconscient en ≈ **30 s** : demi-assis, casque et masque retirés ensemble, ouvrir la veste (tirette antipanique)` },

    contenu:`- Comportement (calme, stressée, paniquée) et état (valide, invalide, consciente ou non) varient : créer un **lien de confiance**
- Porters : par accompagnement, à dos, dans les bras, porter pompier, en chaise
## Assistance respiratoire d'une victime

{ id:'lspcc', nom:'RDLSPCC · Lot de sauvetage (LSPCC)', icone:'🪢', couleur:'#5e35b1', source:'SDIS 34 · RDLSPCC v1 (novembre 2025)',
  fiches:[
  { titre:'Composition du LSPCC', tags:'lspcc composition sac corde harnais triangle sangle connecteur descendeur poulie antichute cordelette protection lot engin échelle bleu jaune 30 m 60 m',
    contenu:`Le LSPCC est un EPI de **catégorie III**, vérifié **chaque année** par le GTL.
| Élément | Caractéristiques |
| Sac | Lot engin **bleu ciel** (Ø 30 cm max), lot échelle **jaune citron** (Ø 40 cm max), hauteur 60 cm max |
| Corde | **30 m** (lot engin) ou **60 m** (lot échelle), statique (allongement 5 % max), Ø 12 à 13 mm, 3 000 kg, ≈ 200 °C |
| Harnais | Charge max **140 kg**, 1 500 kg, demi-lune, attaches sternale et dorsale |
| Triangle d'évacuation | Charge max **150 kg**, 1 500 kg, 3 attaches sternales, 1 dorsale |
| Anneaux de sangle | **Bleue 80 cm**, **rouge 1,5 m**, 2 000 kg |
| Connecteurs | À vis (liaisons) ou automatique (charge) ; grand axe 2 000 kg, petit axe 750 kg |
| Descendeur | En **8**, 2 000 kg |
| Poulie | Mouflage ou déviation, 2 000 kg |
| Antichute mobile | Progression verticale sur échelle, charge max 140 kg |
| Cordelette | 40 cm, Ø 7 mm, pour le nœud Français |
| Protection | Cuir, 45 cm, contre les frottements |
- Un connecteur travaille sur son **grand axe**, verrouillage fermé
- Lot EPI MEA : longe de maintien (1 m), longe antichute (1,75 m), harnais
## Rangement du sac
- **Bas** : corde lovée + protection
- **Milieu** : sangles, connecteurs, poulie, descendeur, cordelettes
- **Haut** : triangle + connecteur automatique (+ 2 harnais dans le lot engin)` },
  { titre:'Principes : système, ancrage et amarrage', tags:'ancrage amarrage point fixe humain naturel structurel artificiel véhicule échelle commande connecteur automatique tête alouette 90° principal intermédiaire smpm garant',
    contenu:`Un système = **point d'ancrage** → **amarrage** → **frein de charge** (descendeur) → **tirant** → **charge**.
- La **commande** est emportée systématiquement (détection, tester une hauteur, écarter une victime)
- Sac placé du côté du **garant** ; surveiller le système en permanence
! Le connecteur **automatique** est toujours placé entre la corde et la charge.
## Les ancrages
- **Naturel** (arbre, rocher), **structurel** (colonne sèche, rambarde, balcon, poutre), **artificiel** (véhicule, échelle)
- En cas de doute, en choisir un autre ; à défaut, demander une équipe **SMPM**
- **Point fixe humain** : sauveteur allongé, jambes à 90° contre le mur ; au moins **20 cm** entre l'axe du descendeur et l'appui de la corde
- **Véhicule** : moteur arrêté, frein serré, calé sur les roues arrière ; amarrage sur manille, jante froide ou essieu arrière (**jamais l'enjoliveur**)
- **Échelle** à coulisse 2 plans, ou à crochets 2 plans reployée (sauvetage uniquement) : sangles autour des 4 montants
## Les amarrages
- Minimum : **une sangle + un connecteur à vis**
- **Têtes d'alouette interdites**
- Sangle en double ≈ 4 000 kg
- Angle entre deux sangles : **90° maximum**
- **Principal** : sangle(s) + connecteur(s) + descendeur
- **Intermédiaire** : sangle(s) + connecteur ou poulie (déviation, prolongement, mouflage)
- Plusieurs amarrages intermédiaires en descente ou remontée : équipe spécialisée` },
  { titre:'Chute : facteur de chute, tirant d\'air, syndrome du harnais', tags:'facteur chute 0,3 1 2 tirant air marge 1 m effet pendulaire syndrome harnais suspension 600 kg epi tsi casque gants',
    contenu:`## Facteur de chute
Facteur = **hauteur de chute ÷ longueur de corde** qui amortit la chute.
| Facteur | Position | Règle |
| 0,3 | Sous l'amarrage | Recherché en permanence |
| 1 | Au niveau de l'amarrage | À éviter |
| 2 | Au-dessus de l'amarrage | Interdit (tout facteur supérieur à 1) |
- Seuil de lésions (normes européennes) : **600 kg**
## Tirant d'air
- Hauteur minimale pour ne rien heurter à l'arrêt de la chute
- Marge de sécurité : **1 m minimum**, à augmenter (réaction du régulateur, allongement de la corde)
## Effet pendulaire
- Si l'on n'est pas à l'aplomb de l'ancrage : ballant et collisions possibles
## Syndrome du harnais
- Suspension **inerte et prolongée** : le sang revient mal au cœur, perte de connaissance, puis arrêt cardio-respiratoire
- En formation, la victime est **toujours un mannequin**
## EPI
- Minimum : **TSI** ; casque type A (F2) ou B (F1) pour tous
- Gants obligatoires pour le sauveteur et en ambiance thermique ; ARI-CO au besoin` },
  { titre:'Ordres de mise en œuvre', tags:'ordres laissez filer du mou sec protégez sécurisez dispositif à bras ferme contact victime en sécurité',
    contenu:`| Ordre | Action |

  { titre:'Techniques générales du LSPCC', tags:'abordage victime péril sauvetage extérieur excavation reconnaissance appartement évolution risque chute toiture triangle passage vide régulateur garant',
    contenu:`| Technique | Dispositif |
| Abordage d'une victime en péril | Descente |
| Sauvetage ou mise en sécurité par l'extérieur | Descente |
| Sauvetage en excavation | Descente et remontée |
| Reconnaissance d'appartement | Descente ou horizontal |
| Évolution avec risque de chute | Protection contre les chutes |
- Limites : résistance des ancrages, matériel, **longueur utile** de corde, état de la victime
- Le chef d'agrès contrôle ; un intervenant **régule** en tenant le garant
## Reconnaissance d'appartement
- Seulement si la façade est inaccessible aux échelles et aux MEA
- Avec point fixe humain : **2 harnais** (régulateur et sauveteur)
- Annoncer plusieurs fois « **nous sommes les sapeurs-pompiers** »
- Se détacher sur sol stable, avec radio, outil de force, détecteur et gilet pare-lame
- Prévoir une échelle à crochets près du point à atteindre comme itinéraire de secours
## Excavation et atmosphère viciée
- Contrôle préalable au **détecteur multigaz** et à la commande, engagement sous ARI-CO
## Évolution sur toiture
- Contrôler la charpente (de l'intérieur ou en retirant les tuiles sur 1 m²)
- Lancer une commande par-dessus le toit pour un dispositif en opposition
- Jusqu'à 5 sangles et 5 connecteurs d'amarrages intermédiaires, qu'on ne récupère pas
## Le triangle
- Victime inconsciente : sur le côté, triangle sur le dos, bras opposé dans la bretelle ; à plat dos, l'autre bras, base sous les aisselles ; attaches sternales + connecteur automatique
- Passage au vide d'une victime inconsciente : **sur le ventre, pieds face à l'ouvrant**, un sauveteur de chaque côté, on la lève ensemble sans lâcher le garant` },
  { titre:'Nœuds, clé d\'arrêt et entretien', tags:'nœud noeud 8 double français clé arrêt répartiteur sangle rouge harnais entretien lavage réforme durée vie 10 ans cahier suivi kimoce',
    contenu:`## Nœuds et dispositifs
- **Nœud de 8 double** aux extrémités de corde (avec gaine thermorétractable) ; un nœud réduit la résistance d'environ 30 %
- **Nœud Français** : **3 tours** de cordelette, bien serré
- **Clé d'arrêt** dès qu'on ne peut plus tenir le garant
! Pas de clé d'arrêt pendant le passage au vide d'un sauvetage : le régulateur tient le garant en permanence.
- **Répartiteur** de plein poing avec une sangle rouge (environ −15 % de résistance)
- Sécurisation de la charge (nœud Français sur le tirant) : pas sur une descente de sauvetage ni sur une remontée
- Sangle rouge transformée en harnais : extrême urgence, sauveteur sous ARI-CO
## Entretien
- Textiles : lavage **à la main**, eau à 30 °C maximum, séchage à plat à l'abri des UV
- Métal : eau à 40 °C maximum, contrôler la fermeture
- **Jamais de nettoyeur haute pression**
## Réforme
- Marquage illisible, contact avec un produit chimique ou un carburant, partie brûlée ou fondue, corde déformée, fils coupés, choc ou fissure
- Durée de vie des textiles : **10 ans maximum**
- Remplir le **cahier de suivi** après chaque utilisation (formation comprise) ; signaler toute chute ou doute (KIMOCE)` }

  { titre:'DECI : poteaux, bouches et besoins en eau', tags:'deci pei poteau bouche incendie couleur rouge bleu jaune vert noir aspiration surpressé borne puisage pi 80 100 150 débit tours risque courant faible ordinaire important particulier 450 m3 signalisation plaque réseau maillé étoilé',
    contenu:`## Couleurs
| Appareil | Couleur |

| Poteau ou bouche d'aspiration | Bleu |

| Borne de puisage (hors DECI, **interdite** aux SP) | Vert |
| Bouche sous pression | Rouge ou noire |
## Poteaux et bouches sous pression
| Conduite | Prises | Débit | Ouverture |
| PI Ø80 | 1 × 65 (+ 2 × 40) | 30 m³/h · 500 l/min | 13 tours |
| PI Ø100 | 1 × 100 + 2 × 65 | 60 m³/h · 1 000 l/min | 13 tours |
| PI Ø150 | 1 × 65 + 2 × 100 | 120 m³/h · 2 000 l/min | 17 tours |
| BI Ø100 | Douille de 100 | 60 m³/h · 1 000 l/min | 17 tours |
- Pression dynamique : **1 bar minimum**, 16 bar maximum ; ouverture dans le sens **inverse** des aiguilles d'une montre

- PEI **surpressé** : précautions pour ne pas abîmer les garnitures de la pompe
## Besoins en eau
| Risque | Quantité minimale |

| Courant ordinaire (lotissement, collectif) | 60 m³ (60 m³/h 1 h ou 30 m³/h 2 h) |

- Limite opérationnelle du SDIS 34 : **450 m³/h** simultanés, soit 900 m³ en 2 h

## Signalisation

- Cartographie : PI, PR (relais), BI, PA (aspiration), BA (borne agricole), CI-RI (citerne, réserve)` },
  { titre:'Hydraulique : pressions et pertes de charge', tags:'hydraulique pression statique dynamique perte charge tuyau 25 45 70 110 débit bar dénivelé pièce jonction ldv lance canon injecteur 6 bar 10 bar 500 l/min taux extinction',
    contenu:`## Pressions
- **Statique** : lances fermées ; **dynamique** : eau en mouvement
- Le **conducteur** est le conseiller technique hydraulique du chef d'agrès : il doit connaître le débit aux lances, la longueur, le dénivelé ou la colonne sèche, et le nombre de pièces de jonction
## Pertes de charge
- Proportionnelles à la **longueur** et au **carré du débit**
- Plus le **diamètre** est grand, plus elles sont faibles
- Indépendantes de la pression : seul le débit compte
- **± 1 bar par 10 m** de dénivelé ; **+ 1 bar par pièce** de jonction
| Tuyau de 20 m | Débit | Perte |
| Ø25 | 150 l/min | 2,2 bar |
| Ø45 | 250 l/min / 500 l/min | 0,3 bar / 1,2 bar |
| Ø70 | 500 / 1 000 / 2 000 l/min | 0,1 / 0,4 / 1,8 bar |
| Ø110 | 1 000 / 2 000 l/min | 0,1 / 0,2 bar |
## Pressions de fonctionnement
- **6 bar** : LDV, lance rideau mobile, lance canon
- **10 bar** : injecteur proportionneur
## Règles du SDIS 34
- Débit de référence pour un binôme sur feu de structure : **500 l/min**
- Au maximum **3 tuyaux Ø45/20 m** après la prise d'eau
- Plusieurs lances : calculer pour la **plus défavorisée** ; lance sur MEA : ne pas dépasser sa pression de référence
> Exemple : LDV 40 à 500 l/min, 3 tuyaux Ø45 et une division, à plat : 6 + 3 × 1,2 + 1 ≈ 10,6 bar à la pompe.
## Taux d'extinction réflexe
| Surface | Risque classique | Risque important |
| Moins de 300 m² | 1 L/min/m² | 2 L/min/m² |
| 300 m² et plus | 2,4 L/min/m² | 3 L/min/m² |
- Défense linéaire : 500 L/min pour 15 m` },
  { titre:"Familles d'habitation et parkings", tags:'famille habitation 1re 2e 3e a b 4e immeuble moyenne hauteur colonne sèche escalier encloisonné 28 m 50 m r+9 r+17 parc stationnement',
    contenu:`| Famille | Caractéristiques |

| 2e | Maisons de plus de R+1 ; collectifs **R+3 max** (porte palière à 10 m max de l'escalier) |

- Escaliers **encloisonnés** dès que le plancher bas du logement le plus haut est à plus de 8 m
- 3e B et 4e : 15 m max jusqu'à l'escalier s'il est à l'abri des fumées, 25 m s'il est à l'air libre ; accès aux escaliers à moins de 50 m d'une voie engins
- Colonne sèche : PEI à 60 m maximum ; à chaque niveau, **1 prise Ø65 + 2 prises Ø40**
## Parcs de stationnement

- En ERP : colonne sèche et extinction automatique dès **R+3 / R-3** (sauf parc largement ventilé)` },
  { titre:'Binômes, conducteur et additifs', tags:'binôme organique circonstance 1er 2e conducteur missions additif eau dopée moussante mousse m51 pictogramme concentration 0,1 1 % autonomie',
    contenu:`## Le binôme
- Un **chef d'équipe** + un **équipier** ; **organique** (armement de l'engin) ou **de circonstance** (personnels d'autres engins)
- **1er binôme** : en général l'attaque ; **2e binôme** : la prise d'eau et/ou l'alimentation
- Il exécute les ordres, rend compte, contrôle les EPI de l'autre, reste dans l'engin sans mission, entre **toujours en binôme** en zone d'exclusion
## Le conducteur
- Cale l'engin en pente, sécurise la zone, met en place un parc matériel
- Alimente une prise d'eau à moins de **60 m**, alimente l'engin seul ou aidé
- Reste attentif à la radio (demande d'ouverture de l'eau), assure le reconditionnement
## Les additifs
- **Eau dopée** : 0,1 à 0,4 % (mouillant, pénètre mieux)
- **Moussante** : 0,5 à 1 % (isole aussi les vapeurs)
- **À mousse** : 1 % avec adaptateur (petits feux d'hydrocarbures)
| Pictogramme | Taux | Utilisation |
| 1 | 0,1 % | Cartons |
| 2 | 0,2 % | Bois |
| 3 | 0,3 % | Pneus, solides liquéfiables |
| 4 | 0,4 % | Habitation, industrie |
| 5 | 0,5 % | Véhicules |
| 6 | 1 % | Petites flaques d'hydrocarbure |
- Le M51+ monte à 3 %, mais la référence départementale est **1 % maximum**
- À 1 % et 500 l/min : environ 16 min (lot INC CCFU, 80 L), 32 min (FPTL, 160 L), 40 min (FPT/FPTGP, 200 L)` },
  { titre:'Conduite des opérations : départ, transit, reconnaissance', tags:'avant départ transit statut ber 01 02 opensis radio n5 n3/4 gte gto 613 634 653 674 reconnaissance réactions immédiates message ambiance crid vrob chef agrès',
    contenu:`## Avant le départ
- Exploiter la feuille de départ : nature, moyens engagés, victimes, risques, requérant, adresse précise
- Cartographie : plan, itinéraire, **PEI** (papier ou opensis)
- Matériel complémentaire : caméra thermique, détecteur multigaz, plan ETARE…
- EPI pour tous, **gilet haute visibilité** pour le conducteur
- Radios : tactique **N5** (603, 624, 643, 664) pour CA, conducteur et chefs d'équipe ; tactique **N3/4** (GTE 613-634, GTO 653-674) ; chef d'agrès : N5 à gauche, N3/4 à droite
- Statut **01** (départ) sur le BER
## Pendant le transit
- Informer le conducteur (itinéraire) et le personnel (ordre de mission)
- **1er et 2e binômes capellent** l'ARI-CO
- Le binôme d'alimentation repère **deux PEI** proches du sinistre
- Statut **02** à l'arrivée sur les lieux
## La reconnaissance
- Sauvetages et mises en sécurité ; plan d'intervention s'il existe
- Configuration du bâtiment, emplacement, surface et nature du feu, risques de propagation
- **Couper les énergies, barrer les fluides**, ramener l'ascenseur au RDC
- Choisir le moyen d'extinction ; appui possible de la CRID ou du VROB
## Réactions immédiates
- Du domaine de l'**action** (sauvetages), du **renseignement** et de l'**information** (message d'ambiance)
- Face à un péril imminent, chacun fait les actions conservatoires nécessaires et rend compte` },
  { titre:'Raisonnement tactique et ordres (SMES)', tags:'smes situation mission exécution sécurité raisonnement tactique ordre initial conduite préparatoire exécution établissez à vos rangs analyse systémique source flux cible balance bénéfice risque',
    contenu:`## SMES : ordre initial et ordre de conduite
| Lettre | Question | Contenu |
| S · Situation | Quoi ? Où, par où ? | Description de la situation |
| M · Mission | Quoi faire ? | Objectifs à atteindre |
| E · Exécution | Comment, avec qui ? | Les ordres |
| S · Sécurité | Quelles règles ? | Protections individuelles et collectives |
- Compléments : **analyse systémique** (source, flux, cible) et **balance bénéfice/risque** (la prise de risque en vaut-elle la peine ?)
## Ordre préparatoire
- Sans matériel : « **1er binôme, en reconnaissance !** » (EPI seuls)
- Avec matériel : « 1er binôme, pour l'établissement d'une LDV 40, en reconnaissance ! »
- « **À vos rangs !** » : binômes et conducteur se placent **à l'arrière de l'engin**
## Ordre d'exécution
- C'est le **E** du SMES ; il indique au minimum le **point d'attaque** et la **prise d'eau**
- Il se termine par « **Établissez !** » ; les restrictions (à sec, engagement sur ordre) sont données avant
> Exemple : « Feu d'appartement au R+5. 1er binôme : extinction, ligne d'attaque, point d'attaque ici. 2e binôme : prise d'eau. Contrôle croisé avant l'engagement. Établissez ! »` },
  { titre:'Groupe incendie et placement des engins', tags:'groupe incendie 19 fptl fptgp mea vsav vlcg rang appel engin attaque appui renforcement placement 4 ldv 40 2 ldv 65',
    contenu:`## Le groupe incendie
- Capacité : **4 LDV 40** ou **2 LDV 65**, et prise en charge des premières victimes
- **19 sapeurs-pompiers** : 4 binômes organiques + 1 binôme de circonstance
| Rang d'appel | Engin |
| 1er | FPT(L) |
| 2e | MEA |
| 3e | FPT(L) |
| 4e | VSAV |
| 5e | VLCG |
- Même CIS : en général **FPTL** (engin d'attaque, ≈ 2 000 L d'eau, moins volumineux) puis **MEA** puis **FPTGP** (engin d'appui)
## L'engin d'attaque (1er engin-pompe)
- **Dépasse l'adresse** pour laisser l'accès aux autres moyens
- Se place à l'abri : chutes de matériaux, rayonnement, explosion, fumées
- Reconnaissance, réactions immédiates, attaque ; s'alimente sur un PEI si possible
## Le MEA
- Contacte le premier COS ; se place sur la façade des sauvetages, de préférence **aux angles**
- Peut servir d'itinéraire de secours ; laisse la place à un 2e MEA
## L'engin d'appui (2e engin-pompe)
- Complète l'engin d'attaque (personnel, matériel, eau)
- Alimente l'engin d'attaque **avec le matériel de celui-ci** pour ne pas se désarmer

  { titre:'Tuyaux et établissements : généralités', tags:'tuyau alimentation manœuvre attaque conditionnement écheveau z o dévidoir mobile couronne caisse appellation lance à disposition en cours à sec en attente en manœuvre vertical rampant étages commande',
    contenu:`## Trois types d'établissement
- **Alimentation** : alimente la pompe (Ø110, Ø70)
- **Manœuvre** : alimente une prise d'eau (Ø110/40, Ø70)
- **Attaque** : alimente une lance (Ø70, Ø45, Ø25)
## Conditionnement
| Tuyau | Conditionnement |
| Ø25/20 m | Dévidoir tournant |
| Ø45/20 m | Dévidoir de 45, écheveau Z ou O |
| Ø70/20 m | Écheveau Z |
| Ø70/40 m | Dévidoir mobile |
| Ø110/20 m | Couronne double |
| Ø110/40 m | Écheveau Z |
- Dispositifs de maintien : **rouges** pour le Ø45, **noirs** pour le Ø70
- **Écheveau O** : Ø45/20 m avec LDV 40 pré-raccordée ; réserve de 20 m au point d'attaque, effet ressort
- **Caisse** : 2 tuyaux Ø70/20 m, **40 kg max**, permet au conducteur d'établir jusqu'à **40 m**
## Estimer le nombre de tuyaux
- Établissement **vertical** : 1 tuyau ≈ **4 étages**
- Établissement **rampant** (dans l'escalier) : 1 tuyau ≈ **2 étages**
## Appellation d'une lance
| Appellation | État |
| À disposition | Tuyaux près de la prise d'eau et des intervenants |
| En cours d'établissement | Ordonné mais pas terminé |
| À sec | Établie et raccordée, mais pas en eau |
| En attente | En eau, prête à fonctionner |
| En manœuvre | En fonctionnement |
## Sécurité
- Ne pas établir dans l'**axe de l'ouvrant**, attention aux aplombs
- Avoir un moyen hydraulique **avant** d'entrer en zone d'exclusion
- Sur la voie publique : baliser, établir au bord des voies, protéger les traversées de chaussée` },
  { titre:"Tableau d'aide aux établissements", tags:'tableau aide établissements colonne sèche en charge ligne attaque ldt ldv 40 ldv 65 commande échelle coulisse r+1 r+2 r+4 r+6 r+8 r+12 r+17 dévidoir 110 alimentation 20 m 60 m 200 m',
    contenu:`| Établissement | Jusqu'au |
| LDV 40 sur colonne en charge | Selon le bâtiment |
| LDV 40 sur colonne sèche | R+17 |
| Ligne d'attaque rampante avec 1 LDV 40 | R+12 |
| Ligne d'attaque rampante avec 2 LDV 40, ou vertical de haut en bas | R+8 |
| LDT, LDV 40 ou ligne d'attaque avec la commande | R+6 |
| LDV 40 rampante, ou avec échelle à coulisse 3 plans | R+4 |
| LDV 40 avec échelle à coulisse 2 plans grand modèle | R+2 |
| LDT ou LDV 40 rampante avec le dévidoir auxiliaire | R+1 |
- Une **colonne sèche** présente est **à privilégier**
- Valeurs théoriques : elles varient selon l'engin, le bâtiment et le PEI
## Repères par établissement
- **LDT** : lance de premiers secours, feu de **faible intensité**, longueur limitée à **40 m**
- **LDV 40 rampante** : au-delà du R+4, la **ligne d'attaque est obligatoire**
- À partir du **R+5** (commande, vertical) : **2 tuyaux Ø45/20 m**
- Tuyau amarré sur une partie résistante (jamais sur l'échelle à coulisse) ; sans amarrage, le poids du tuyau en O suffit jusqu'au R+2
## Alimentation de l'engin-pompe
- PEI à moins de 20 m : un **tuyau Ø110/20 m** ; division **Ø100/2×65** pour profiter de toute la capacité du poteau
- Établissement de manœuvre par le conducteur : jusqu'à **60 m**
- Tuyaux Ø70 de l'engin : jusqu'à **200 m** ; au-delà, 2 dévidoirs mobiles
## Sur MEA
- Une lance sur structure extensible a **3 amarrages** ; chaque MEA a **6 ligatures** (2 LDV 40)` },
  { titre:"La ligne d'attaque (ETB 3.7 à 3.9)", tags:'ligne attaque division attaque division alimentation 65 2x40 ldv 40 r+4 r+8 r+12 trois binômes quatre tuyaux 70 commande vertical haut bas raccordez ouvrez',
    contenu:`## Vocabulaire
- **Ligne d'attaque** = une **division d'attaque** + une **LDV 40**
- **LDV 40** : 1 à 3 tuyaux Ø45/20 m, établie en général par le **1er binôme**
- **Division d'attaque** (Ø65/2×40) : établie en général par le **2e binôme**, placée **à l'intérieur** du bâtiment
- **Division d'alimentation** (Ø65/65-2×40) : établie par le conducteur ou un binôme, placée **à l'extérieur**
## À quoi elle sert
- Remplacer une colonne sèche absente ou indisponible
- **Doubler** les moyens hydrauliques (risque de phénomène thermique, propagation, lance pour le binôme de sécurité)
- **Obligatoire au-delà du R+4** en rampant (laissée au choix du chef d'agrès en dessous)
- Placer la division au plus près du sinistre ou au niveau N-1
- Couper l'eau à la division pour prolonger ou remplacer un tuyau, réduire les pertes de charge et les coups de bélier
## Matériel et rôles
- 1er binôme : 1 tuyau Ø45 en O + LDV 40 (chef d'équipe), 2 tuyaux Ø45 en Z (équipier)
- 2e binôme : tuyaux Ø70/20 m en Z dont un avec la division d'attaque ; **4 tuyaux Ø70** si le chef d'agrès ne précise rien
- Le **chef d'agrès** emporte 1 tuyau Ø45 en O + 1 LDV 40 pour que le 2e binôme ait aussi un moyen hydraulique
## Limites
| Variante | Limite |
| Rampante (dans l'escalier) | R+12 ; au-delà du R+8, à **trois binômes** |
| Avec la commande | R+6 (2 tuyaux Ø70 dès le R+5) |
| Verticale de haut en bas | R+8 (2 tuyaux Ø70 dès le R+5) |
- Jusqu'au R+8 en partant du point d'attaque, on peut déposer un tuyau Ø70 au R+2 et au R+4 pour s'alléger
- Du point d'eau vers le point d'attaque : l'ordre cite d'abord la prise d'eau ; l'eau est ouverte à l'ordre « **Raccordez - Ouvrez !** »` },
  { titre:'LDV 65, lance canon et lance rideau', tags:'ldv 65 lance canon 65 2000 l/min 100 m sim amarrage 5 m recul trinôme lrm lance rideau mobile 26 m 7 m queue paon',
    contenu:`## LDV 65 (ETB 3.10)
- 1er binôme : 3 tuyaux Ø70/20 m en Z + LDV 65
- L'engin-pompe doit **toujours être alimenté**
- Forte force de recul : le porte-lance travaille **en binôme ou en trinôme**
## Lance canon 65 (ETB 5.1)
- 1er binôme : 3 tuyaux Ø70/20 m en Z + lance canon + **SIM**
- Débit maximal **2 000 l/min** : établissement de **100 m maximum**
- Engin-pompe **toujours alimenté**
- Recul : lance **amarrée avec la SIM** (tête d'alouette autour du tuyau), tuyau placé **dans l'axe sur 5 m**, amarrage avant la mise en eau
## Lance rideau mobile 40 (ETB 5.2)
- 1er binôme : 3 tuyaux Ø45/20 m en Z + lance rideau mobile (raccordée par la **queue de paon**)
- Rideau d'eau de **26 m de large** et **7 m de haut** contre un flux thermique ou gazeux
- Peut aussi s'établir avec le dévidoir de Ø45` },
  { titre:'Lances sur MEA (ETB 3.11 à 3.14)', tags:'mea vanne pied échelle division alimentation 70/1 m structure extensible panier secours lance canon ldv 40 angle dressage 60 70 degrés angle latéral 15 degrés échelier tourelle amarrage 10 échelons',
    contenu:`## La prise d'eau du MEA
- Dispositif pré-raccordé : **vanne pied d'échelle Ø65** + **tuyau Ø70/1 m** + **division d'alimentation**
- Possibilités : **panier** (1 lance canon ou 1 LDV 40), **structure extensible** (1 à 2 LDV 40 sur des plans différents, ou une lance canon selon le modèle), ou établissement dans le bâtiment depuis le panier
! Un établissement de manœuvre est **réservé au MEA** : aucune autre lance ne se branche sur sa division d'alimentation.
## Règles communes
- Équipage : conducteur (échelier) et **équipier** ; ordre préparatoire « Conducteur et Équipier… »
- Angle de dressage : **60° ou 70° maximum** selon le modèle ; angle latéral de la lance : **15° maximum**
- **Aucun mouvement** de l'échelle avec du personnel sur la structure
- Lance laissée **ouverte** autant que possible ; ouverture et fermeture à la **vanne pied d'échelle** par l'équipier
- Changer de point d'attaque : seulement après le retrait du personnel et la purge de l'établissement
- Urgence (explosion, nacelle soudain dans les fumées) : l'échelier resté en tourelle peut **abaisser, dresser, pivoter**
## Amarrages
| Configuration | Amarrage |
| LDV 40 sur structure extensible | Lance à hauteur de poitrine (chef d'agrès) ; tuyau à **10 échelons** dessous puis un 2e entre ce point et le sol |
| Lance canon sur structure | Pas d'amarrage : la **pièce intermédiaire** tient l'établissement et absorbe le recul |
| LDV 40 en panier | Seule la lance est amarrée au garde-corps ; tuyau Ø45/4 m par-dessus le garde-corps |
| Lance canon en panier | Raccordée sur la pièce intermédiaire ou la prise Ø65 du panier |` },
  { titre:"Alimentation de l'engin-pompe et aspiration (ETB 4)", tags:'alimentation engin pompe 110/20 m collecteur 100/2x65 division retenue clé fédérale clé barrage dévidoir mobile 100 m 200 m aspiration aspiraux crépine flotteur pena 8 m 6 m 50 cm 30 cm 70/10 m',
    contenu:`## Principes
- L'engin-pompe est alimenté **dès qu'une LDV 40** est mise en œuvre (peut être différé selon l'eau en citerne)
- Établissement d'alimentation de préférence **de l'engin vers le PEI**
- Un engin-pompe par conduite **Ø80 ou Ø100**, **deux** par conduite **Ø150**
- Division **Ø100/2×65** posée systématiquement sur le poteau : 1 à 2 alimentations sans fermer ni purger le PEI
- Le tuyau **Ø70/10 m** sert uniquement à **remplir la cuve** au reconditionnement
- Si le PEI est douteux, le chef d'équipe va le tester avant d'établir
## Les établissements
| ETB | Moyen | Repère |
| 4.1 | 1 tuyau **Ø110/20 m** (conducteur) | PEI à moins de 20 m |
| 4.2 | Tuyaux Ø70/20 m en Z (2e binôme) | 100 m avec 2 lignes ou 200 m avec 1 ligne |
| 4.3 | Dévidoir mobile (2e binôme) | Pose du collecteur Ø100/2×65 sur l'engin |
| 4.4 | Dévidoir + division d'alimentation | Manœuvre et alimentation en même temps, un seul binôme |
| 4.5 | Aspiration (aspiraux Ø110/2 m) | Sur un point d'eau naturel ou artificiel (PENA) |
- Matériel PI : clé fédérale, division Ø100/2×65, bouchons ; matériel BI : clé de barrage, coude ou retenue
- Sans binôme disponible, le conducteur peut s'alimenter avec des tuyaux Ø70/20 m jusqu'à **60 m**
## Aspiration (ETB 4.5)
- **4 aspiraux** Ø110/2 m par orifice de Ø100 (8 pour deux orifices) ; crépine, flotteur, commande
- Crépine immergée à **50 cm du fond** et **30 cm sous la surface** ; arrimée à contre-courant s'il y a du courant
- PENA de l'Hérault : **8 m maximum** entre l'engin et la crépine, **6 m** de hauteur d'aspiration
- Hors aire réglementaire : engin **parallèle** au point d'eau
- Prévoir dès le début 1 ou 2 établissements (sinon il faut refaire l'amorçage)` },
  { titre:'Mousse, prolongement et remplacement de tuyau', tags:'mousse injecteur proportionneur 1 % adaptateur bidons additif plongez 40 m prolongement remplacement tuyau fermez ouvrez trois tuyaux 45 nœud',
    contenu:`## LDV 40 à mousse avec injecteur proportionneur (ETB 5.3)
- 1er binôme : LDV 40 + tuyau Ø45 en O, 2 tuyaux Ø45 en Z, **adaptateur mousse** et **injecteur proportionneur** Ø40
- 2e binôme : bidons d'additif ; à l'ordre « **Plongez !** », il plonge la canne d'aspiration dans le bidon et surveille le niveau
- **40 m maximum** entre l'injecteur et la lance
- Engin sans injection fixe : injecteur réglé et bloqué à **1 %** + **4 bidons** d'additif
- Ouvrir la lance au débit indiqué sur l'injecteur et ne pas la fermer
## Prolongement d'un établissement (ETB 6.1)
- Ordres : « **Fermez !** », raccorder, puis « **Ouvrez !** »
- Pas plus de **3 tuyaux Ø45/20 m** après la prise d'eau (pertes de charge)
- En milieu restreint : transformer un tuyau Ø45 de Z en O
## Remplacement d'un tuyau (ETB 6.2)
- Fait par le **binôme qui a établi**
- « Fermez ! », raccorder côté attaque puis côté point d'eau, « Ouvrez ! »
- Écarter le tuyau abîmé et le **marquer d'un nœud** près du demi-raccord` }

{ id:'suap-bilan', nom:'SUAP · Bilans et règles SDIS 34', icone:'🩺', couleur:'#00897b', source:'SDIS 34 · RT SUAP 2025 (note SSSM 2025-01)',
  fiches:[
  { titre:'Ce que le SDIS 34 change par rapport au national', tags:'spécificités sdis 34 note sssm guedel yankauer gaze hémostatique section membre attelle dépression pouls carotidien pédieux tibial âges bassin ceinture pelvienne femme enceinte ecg juste-né bétadine bavu',
    contenu:`Le SDIS 34 applique les recommandations nationales de premiers secours, précisées par son SSSM :
- **Fiches non enseignées** : gaze hémostatique, syndrome de suspension, avalanche, foudre, attelle modulable, attelle à traction, réalignement de membre
- **Bilan** : on garde les mots *bilan circonstanciel, évaluation primaire, bilan complémentaire, bilan de surveillance*
- **Douleur** : uniquement l’**échelle verbale simple (EVS) de 0 à 4**
- **Conscience** : score **EVDA** ; pour le « D », dire si la réaction à la douleur (pression sur l’ongle avec un stylo) est **adaptée ou inadaptée**
- **Gaze imbibée d’hémostatique** : **ne pas l’utiliser**
- **Canule de Guedel** : posée **systématiquement sur tout ACR**, quel que soit l’âge
- **Section de membre** : **garrot** à privilégier ; si le saignement reprend, **2e garrot** entre le 1er et la racine du membre
- **Aspiration** : sonde **rigide de Yankauer** (longueur = commissure des lèvres → angle de la mâchoire) ; nouveau-né : 1 cm max dans la bouche puis devant les narines
- **Points de compression**, **pansement compressif d’urgence (PCU)** et **pansement à 3 côtés** : maintenus
- **Immobilisation de membre** : **attelles à dépression** uniquement
- **ACR** : pas de pouls fémoral (sauf juste-né et nouveau-né), le **pouls carotidien** est la référence
- **Traumatisme des membres inférieurs** : vérifier les **pouls pédieux et tibial postérieur** (10 s max)
- **Bassin** : palpation douce **sans pression** ; **ceinture pelvienne sur avis médical** (médecin ou infirmier SP, ou médecin régulateur), peut être préinstallée
- **Femme enceinte** : position où elle est bien ou **sur le côté gauche** ; PLS sur le **côté gauche**
- **Brûlures** : compresses de **gel d’eau** sur les zones fonctionnelles et esthétiques
- **ECG** : seulement **sur prescription du médecin régulateur**, jamais à l’initiative du chef d’agrès ; identité du patient obligatoire dans le DGT7
- **Juste-né** : transport ceinture ventrale pour la maman, bébé **peau à peau**, code de la route sauf urgence
- **Antiseptique** : la Dosiseptine est remplacée par la **Bétadine jaune 10 %** (pas d’allergie croisée avec les crustacés ; flacon daté, 6 mois après ouverture)
- **BAVU** : le modèle 250 ml est retiré ; nouveau-né = BAVU pédiatrique, à 2 doigts, jusqu’au soulèvement de la poitrine` },
  { titre:'Évaluation primaire (fiche SDIS 34)', tags:'évaluation primaire bilan urgence vitale buv abcde airway breathing circulation disability exposition evda pouls radial 80 mmhg pouls carotidien 50 mmhg renfort médical ope codis',
    contenu:`## Trois objectifs
- **Impression générale** rapide : dangers, mécanisme (cinétique), position, apparence ; suspicion du rachis → maintien de la tête
- **Traiter en premier ce qui tue en premier**
- **Demander un renfort médical sans délai au CODIS** dès qu’une détresse vitale est trouvée
## 1. Détresse immédiatement vitale
- **Hémorragie externe** : l’arrêter sans délai
- **Obstruction complète des voies aériennes** : désobstruer
- **ACR** : RCP + DAE
## 2. Détresse moins évidente : ABCDE
| Lettre | Ce qu’on vérifie |
| **A** · Airway | Voies aériennes libres (la victime parle ?), langue, corps étranger ; stabilisation du rachis cervical |
| **B** · Breathing | Inconscient et < 6 mouvements/min (< 1 en 10 s) ou gasps → ACR ; sinon apprécier sur ~15 s fréquence, amplitude, régularité, symétrie |
| **C** · Circulation | Pouls radial (présent → PAS > 80 mmHg), sinon carotidien (présent → PAS > 50 mmHg), peau, TRC, « boîtes à sang », hémorragies |
| **D** · Disability | Conscience **EVDA**, pupilles, sensibilité et motricité des 4 membres |
| **E** · Exposition | Examen de la tête aux pieds (dos compris), lutte contre l’hypothermie |
- Signes de gravité respiratoire : cyanose, sueurs, **pas plus de 4 mots d’affilée**, bruits, tirage, balancement thoraco-abdominal, plaie thoracique, emphysème sous-cutané
## EVDA
| Lettre | État |
| **E**veillé | Conscience normale |
| **V**erbal | Répond aux ordres verbaux (troubles légers) |
| **D**ouleur | Ne répond qu’à la douleur (troubles graves) |
| **A**réactif | Aucune réponse (inconscience vraie) |
## Renfort médical
- Le chef d’agrès VSAV le demande **en réaction immédiate, sur l’OPE, dès l’arrivée**, en précisant la détresse
- Le CODIS engage un moyen du SSSM ou relaie au CRRA 15, qui est toujours informé
> À chaque détresse : geste de secours immédiat, puis on réévalue la fonction avant de passer à la suivante.` },
  { titre:'Les 4 regards et le bilan complémentaire', tags:'premier deuxième troisième quatrième regard bilan complémentaire pqrst provoqué qualité région sévérité temps sampler antécédents allergies médicaments dernier repas',
    contenu:`| Regard | Objectif |
| **1er** | Vision globale : que s’est-il passé ? infos de départ justes ? dangers ? combien de victimes ? moyens suffisants ? |
| **2e** | Approcher la victime : menaces vitales (hémorragie, voies aériennes, absence de respiration), plainte, position |
| **3e** | Évaluer les 3 fonctions vitales (respiration, circulation, conscience) et traiter |
| **4e** | Interrogatoire, examen, paramètres, scores |
## Bilan complémentaire (SDIS 34)
- Reprendre l’ABCDE en mesurant : **sur 1 minute** fréquence respiratoire et pouls, **SpO2**, **pression artérielle** (aux **deux bras** si douleur thoracique), **glycémie**, perte de connaissance passagère
- Analyser la plainte : **P**rovoqué par · **Q**ualité · **R**égion · **S**évérité (EVS) · **T**emps
- Antécédents : **S**ignes · **A**llergies · **M**édicaments (et toxiques) · **P**assé médico-chirurgical · **L**ast meal (dernier repas) · **É**vénements avant les signes · **R**isques
- Traumatisme : mécanisme, cinétique, suspicion du rachis ; signes de la tête aux pieds (contusions, gonflements, déformations, plaies, brûlures)
## Transmission du bilan
- Concise, complète, structurée, chronologique ; **sans interpréter**
- Détresse vitale : demande de moyen médical immédiate (nature, motif, sexe et âge), bilan complet ensuite
- Sans détresse : motif réel, sexe et âge, plainte principale, résultats et gestes réalisés` },
  { titre:'Paramètres, valeurs normales et âges', tags:'fréquence respiratoire cardiaque valeurs normales adulte enfant nourrisson nouveau-né trc saturation spo2 glycémie douleur evs évs âges juste-né température pression',
    contenu:`## Âges retenus au SDIS 34
| Catégorie | Âge |
| Juste-né | 24 premières heures |
| Nouveau-né | Du 1er au 28e jour |
| Nourrisson | 28 jours à 1 an |
| Enfant | 1 an à la puberté (≈ 15 ans) |
| Adulte | Après la puberté |
## Fréquences normales
| | Adulte | Enfant | Nourrisson | Nouveau-né |
| Respiration (/min) | 12 à 20 | 20 à 30 | 30 à 40 | 40 à 60 |
| Pouls (/min) | 60 à 100 | 70 à 140 | 100 à 160 | 120 à 160 |
## Autres repères
- **TRC** (temps de recoloration cutanée) : normal **< 2 secondes** (pression 3 s sur l’ongle)
- **SpO2** normale : **94 à 100 %** (faussée par les fumées et le CO !)
- **Glycémie** : donner du sucre si **< 0,6 g/l** (< 3,3 mmol/l, < 60 mg/dl)
- **Douleur (EVS)** : 0 nulle · 1 faible · 2 modérée · 3 intense · 4 insupportable ; prise en charge si **EVS ≥ 2**
- Pouls : carotidien (adulte, enfant), fémoral (nourrisson, nouveau-né) ; 10 s maximum
- Glycémie : à mesurer devant un AVC, un malaise (diabétique, effort, à jeun), des troubles du comportement, une perte de connaissance ; piquer le côté du majeur, de l’annulaire ou de l’auriculaire` },
  { titre:'Oxygène : indications et débits', tags:'oxygène inhalation mhc masque haute concentration lunettes débit 15 l/min 9 l/min objectif saturation 94 98 89 insuffisant respiratoire chronique fumées co plongée',
    contenu:`## Indications
- Détresse respiratoire ou circulatoire
- Intoxication aux **fumées** ou au **CO**, accident de **plongée**
- SpO2 **< 94 %** (ou **< 89 %** chez l’insuffisant respiratoire chronique)
- Crise douloureuse de drépanocytose
- Détresse vitale sans SpO2 mesurable : O2 systématique en attendant l’avis médical
## Débits (SDIS 34)
| Dispositif | Plage | Débit initial |
| MHC (enfant et adulte) | 9 à 15 l/min | **15 l/min** |
| MHC sans ballon réserve ni ailettes | 6 à 9 l/min | 9 l/min |
| Lunettes à O2 | 1 à 6 l/min | 2 l/min (ou 1 à 2 l/min de plus que son débit habituel) |
## Objectifs de saturation
- **94 à 98 %** : adulte, enfant, nourrisson
- **89 à 94 %** : insuffisant respiratoire chronique
## Cas particuliers
- Fumées, CO, accident de décompression : **MHC à 15 l/min** quelle que soit la SpO2
- Détresse vitale : toujours **MHC d’emblée** ; remplir le ballon avant de poser le masque
- Ne jamais utiliser un insufflateur manuel (BAVU) pour faire inhaler de l’O2
- Insufflation (ACR) : O2 à **15 l/min**
> Lutter contre l’hypoxie sans provoquer d’hyperoxie (AVC, maladie cardiaque).` },
  { titre:'Sécurité, hygiène et accident d’exposition', tags:'aes accident exposition sang risque viral plaie piqûre dakin javel projection muqueuse précautions standard gants friction hydroalcoolique',
    contenu:`## Accident d’exposition à un risque viral (AES)
- Interrompre l’action si possible, se faire relayer
- **Plaie ou piqûre** : ne pas faire saigner, laver à l’eau et au savon, rincer, antiseptique (Dakin, eau de Javel diluée au 1/5e, ou iodé) **au moins 5 minutes** ; pas de solution hydroalcoolique
- **Projection dans l’œil ou sur une muqueuse** : rincer **au moins 5 minutes** au sérum physiologique (à défaut à l’eau)
- **Rendre compte sans délai** à l’autorité d’emploi (soins et déclaration)
## Précautions de base
- Gants à usage unique, friction hydroalcoolique avant et après chaque victime
- Masque et lunettes en cas de risque de projection
- Objets piquants dans le collecteur OPCT, déchets de soins dans le sac DASRI
- Sécurité : baliser, se protéger, évaluer les dangers avant d’approcher (1er regard)` }
