{ id:'jsp3', nom:'JSP 3 · Engagement et techniques', icone:'🚒', couleur:'#e65100', source:'Cours JSP SDIS 34 · JSP 3', groupe:'jsp',
  fiches:[
  { titre:'L’hygiène de vie', tags:'hygiène santé fumées toxiques suies douche tenue alimentation assiette hydratation sommeil écrans addictions tabac alcool cannabis dopage RDEB DECOPI je sais je sens je vois',
    contenu:`## Les fumées et le corps
- Les toxiques des fumées entrent par **4 voies** : la **respiration**, la **peau** (cou, visage, mains, poignets), la **bouche** (mains sales), les **yeux**
- Les **suies** restent sur la tenue et le matériel et continuent à libérer des toxiques
| Niveau | Nettoyage |
| **Je sais** (fumée courte à l’air libre) | On aère la tenue, on rince le matériel à l’eau |
| **Je sens** (odeur de fumée : déblai, reconnaissance, attaque) | Tenue brossée à sec et aérée, matériel brossé à l’eau |
| **Je vois** (traces de suie) | Tenue isolée dans un sac et changée, matériel lavé |
- Les bons gestes : **lingettes** (mains, visage, cou), **mains propres avant de manger ou boire**, tenue sale dans un **sac fermé**, **douche** au centre, tenue propre
- Au retour au centre : on remet l’engin en état, **puis tout le monde prend une douche**
- Au quotidien : douche après le sport, chaussettes changées chaque jour, pieds bien secs, dents brossées matin et soir, protection solaire
## Manger, boire, dormir
- Assiette : **moitié légumes**, un quart féculents (énergie), un quart protéines (muscles) + un laitage et un fruit
- **3 repas et un goûter**, sans sauter le petit-déjeuner ; repas avant une épreuve **2 à 3 h avant**
- Boire de l’eau avant, pendant et après, même sans soif ; urines claires = bien hydraté
- Boissons énergisantes déconseillées : **trop de caféine et de sucre**
- Sommeil : **8 à 10 h par nuit** ; écrans coupés **1 h avant** de dormir
## Les addictions
- Addiction = **ne plus pouvoir s’en passer**, même si on sait que ça fait du mal
- Avec produit (tabac, vapoteuse, alcool, cannabis, dopage) ou sans produit (écrans, jeux d’argent, sport à l’excès, réseaux sociaux)
- Tabac, vapoteuse et alcool : **interdits à la vente avant 18 ans**
- Aide : parents, animateur, médecin, **Fil Santé Jeunes 0 800 235 236**, **Tabac Info Service 39 89**
! Zéro alcool, zéro drogue en activité JSP comme chez les sapeurs-pompiers
> Je sais, je sens, je vois : plus c’est sale, plus on nettoie` },
  { titre:'La préparation physique', tags:'préparation physique brevet épreuves natation 50 m course 12 minutes tractions pompes PSSP parcours sportif endurance fractionné 30/30 gainage ICP blessures échauffement',
    contenu:`## Les 4 épreuves du brevet
- **Natation 50 m** puis sortir seul du bassin
- **Course de 12 min** : la plus grande distance possible
- **Force des bras** : tractions (paumes vers soi) ou pompes
- **PSSP** (parcours sportif du sapeur-pompier) chronométré : sauter, ramper, tirer, porter, passer une commande dans un cadre, en courant
- Pour valider : **au moins 3 A et 1 B** ; barèmes différents filles et garçons
- Mon bilan : tableau de progression : résultat aujourd’hui, objectif fin JSP3, objectif brevet
- Objectif **réaliste, mesurable, daté** ; on se compare à soi-même ; retest toutes les **6 à 8 semaines**
## Progresser
| Qualité | Épreuves |
| Endurance (durer) | Course 12 min, natation |
| Force (pousser, tirer, porter) | Tractions, pompes, PSSP |
| Vitesse | PSSP |
| Souplesse | Toutes, et éviter les blessures |
| Agilité | PSSP, natation |
- **Endurance tranquille** : on peut parler, **20 à 40 min**, le plus souvent
- **Fractionné** : ex. **30 s vite / 30 s trottinées**, 8 à 10 fois, 2 séries, **1 fois par semaine maximum**
- Course de 12 min : pour **2 000 m**, 400 m en **2 min 24 s**, 200 m en 1 min 12 s, 100 m en 36 s
- Pompes : mur, puis genoux, puis complètes ; tractions : suspension, descente lente, élastique ; le **gainage** aide tout
- Semaine type : progressive, variée, avec **1 à 2 jours de repos**
## Durer
- Échauffement **10 à 15 min** et retour au calme ; pas de charges lourdes (les os grandissent)
! Le piège n°1 de la course de 12 min : partir trop vite
! Une douleur qui dure (genou, talon, dos) : on arrête et on en parle
> Les sapeurs-pompiers passent chaque année les ICP (indicateurs de la condition physique)` },
  { titre:'L’organisation et les missions du SDIS', tags:'SDIS service départemental incendie secours organisation missions préfet conseil administration CASDIS DDSIS CTA CODIS Vailhauquès groupements compagnies CIS L1424-2 collectif',

  { titre:'Les risques majeurs et l’alerte', tags:'risques majeurs aléa enjeux inondation feu de forêt séisme TMD épisode méditerranéen vigilance météo SNA sirène FR-Alert radio PFMS plan familial DICRIM DDRM PCS',
    contenu:`## Le risque majeur
- **Aléa** (le phénomène) + **enjeux** (personnes, maisons, routes) = **risque**
- Risque majeur : **rare** mais **très grave** (beaucoup de victimes, dégâts, secours débordés)
- Familles : météorologique, sismique, feu de forêt, industriel et transport de matières dangereuses
- Chez nous (Cruzy, Quarante) : **inondation**, **feu de forêt**, TMD, mouvements de terrain, séisme (**zone 2, faible**), sécheresse
- **Épisode méditerranéen** (automne) : mer chaude, orages bloqués par les reliefs, crues éclair
! **30 cm d’eau** suffisent à emporter une voiture : on ne traverse jamais une route inondée
## L’alerte
| Vigilance | Signification |
| Vert | Pas de vigilance particulière |
| Jaune | Soyez attentifs |
| Orange | Soyez très vigilants, phénomènes dangereux |
| Rouge | Vigilance absolue, phénomènes exceptionnels |
- Moyens d’alerte : **sirène (SNA)**, **FR-Alert** (message sur tous les téléphones de la zone, même en silencieux), radio, panneaux (PMV), porte-à-porte, comptes officiels des réseaux sociaux
- SNA : **3 cycles de 1 min 41 s** d’un son montant et descendant, séparés de **5 s**
- Fin d’alerte : son **continu de 30 s** ; essai le **1er mercredi du mois à midi** (un seul cycle)
## Les réflexes
- Je me mets **à l’abri**, j’écoute **la radio**, je **ne téléphone pas** (lignes libres pour les secours), je ne vais pas chercher les enfants à l’école
- Inondation : monter à l’étage ; feu de forêt : rester dans la maison volets fermés ; nuage toxique : s’enfermer et calfeutrer, pas de flamme ; séisme : sous une table solide, loin des vitres
- **Plan familial de mise en sûreté** + kit d’urgence (radio et lampe à piles, eau et nourriture pour **3 jours**, médicaments, papiers)
- Documents : **DICRIM** (maire), **DDRM** (préfet), PCS (plan communal de sauvegarde), SDACR (SDIS)
> Sirène : 1 min 41 s, trois fois. Fin : 30 s continu` },
  { titre:'L’épuisement thermique et hydraulique', tags:'épuisement assèchement inondation cave motopompe flottante thermique hydraulique hydro-éjecteur vide-cave turbopompe Venturi monoxyde de carbone CO 1000 l/min',
    contenu:`## Trois familles de pompes
| Type | Énergie | Exemple |
| Électrique | Câble, groupe électrogène ou prise | Électropompe (vue en JSP2) |
| Thermique | Petit moteur à essence | Motopompe |
| Hydraulique | Eau sous pression de l’engin | Hydro-éjecteur, vide-cave, turbopompe |
- Choix du chef d’agrès selon : la quantité d’eau, l’accès, l’électricité, l’air du local
## Marche générale
- **Reconnaître** (origine, hauteur, dangers), **mettre en sécurité** (couper électricité et gaz), **protéger** (surélever, bâcher), **épuiser puis assécher**, **rendre compte**
! Courant pas coupé : on ne met pas un pied dans l’eau
## La motopompe flottante (thermique)
- Moteur à essence sur un flotteur, aspire par-dessous : environ **1 000 litres par minute**
- Sur les CCF, CCFU et CCGC ; pas besoin d’électricité ni d’engin
- Mise en œuvre : préparer (essence, huile, tuyau), mettre à l’eau **attachée avec la commande**, démarrer, surveiller (essence, grille, tuyau), arrêter et rincer
! **Jamais dans un local fermé** : les gaz d’échappement contiennent du **monoxyde de carbone**, invisible, sans odeur, mortel
! Plein d’essence **moteur arrêté et froid** ; pot d’échappement brûlant ; jamais seul au bord de l’eau
## Les matériels hydrauliques
- L’eau de l’engin arrive sous pression, entraîne l’eau de la cave, et tout repart dehors
- Pas d’électricité ni de gaz : **utilisables dans une cave**, mais l’engin doit être alimenté
- **Hydro-éjecteur / vide-cave** : **effet Venturi**, l’eau rapide dans un passage étroit crée une aspiration ; pas de pièce qui tourne, supporte la boue
- **Turbopompe** : l’eau de l’engin fait tourner une turbine qui entraîne la pompe ; plus efficace ; posée au point le plus bas, eau ouverte doucement sur ordre
> Expérience de la paille : souffler au-dessus d’une paille plantée dans l’eau fait monter l’eau` },
  { titre:'Les moyens facilitant l’action des secours', tags:'cartographie plans établissements répertoriés ETARE façades A B C D voie engins voie échelles familles habitation escalier encloisonné coupe-feu EAS colonne sèche RIA sprinklage désenfumage caméra thermique clés',
    contenu:`## Les plans
- **Cartographie** de l’engin : rues, points d’eau, accès, bâtiments à risque ; lue pendant le trajet
- **Plan d’établissement répertorié** : collèges, hôpitaux, maisons de retraite, magasins, usines, caves coopératives… avec accès, façades, points d’eau, coupures, locaux dangereux, nombre de personnes
- **Façades** : **A** = entrée principale (ou choisie par le premier chef), puis **B, C, D dans le sens des aiguilles d’une montre**
## Le bâtiment
- **Voie engins** : route assez large, solide, pas trop pentue pour les camions
- **Voie échelles** : zone plate et solide au pied de la façade pour la grande échelle, **toujours libre**
| Famille d’habitation | Bâtiment |
| 1re | Maison jusqu’à R+1 |
| 2e | Maison plus haute ou petit immeuble (R+3) |
| 3e | Immeuble jusqu’à **28 m** (R+9) |
| 4e | Immeuble jusqu’à **50 m** (R+17) |
- Escaliers **encloisonnés** (la fumée n’y entre pas), **recoupements** coupe-feu, murs et planchers résistant au feu (30 min, 1 h, 2 h), matériaux peu combustibles
- **Espace d’attente sécurisé** (EAS) : abri pour une personne qui ne peut pas descendre ; en général **2 par étage** dans les ERP ; toujours vérifié lors des recherches
! Une porte coupe-feu ne se cale jamais ouverte
## Les équipements
- **Colonne sèche** : tuyau fixe, l’engin l’alimente en bas, une prise à chaque étage ; en charge = déjà pleine d’eau
- **RIA** (robinet d’incendie armé) : tuyau toujours sous pression pour le personnel ; **sprinklage** : têtes qui arrosent seules à la chaleur ; extincteurs, désenfumage, alarme, portes automatiques
- **Caméra thermique** : **2 dans le FPT**, portée par l’équipier ; trouve foyer, victimes, points chauds
! La caméra ne voit pas à travers une vitre, un mur ou de l’eau, et ne remplace pas ligne de vie ni binôme
- Moyens locaux : trousseau du secteur, clés gaz « croix » et « étoile », **clé triangulaire d’ascenseur**, personnes connaissant les lieux
> Façades : A comme Accueil, puis on tourne comme une montre` },
  { titre:'Les notions élémentaires d’hydraulique', tags:'hydraulique débit pression bar l/min pertes de charge statique dynamique atmosphérique LDV 6 bars injecteur 10 bars dénivelé tableau Ø45 Ø70 Ø110 calcul pompe 3 tuyaux citerne',
    contenu:`## Débit et pression
- **Débit** : quantité d’eau qui passe en une minute, en **l/min** (LDV : 250 ou 500 l/min ; 60 m³/h = 1 000 l/min)
- **Pression** : force qui pousse l’eau, en **bar**
- Pression **atmosphérique** (poids de l’air), **statique** (lance fermée, l’eau ne bouge pas), **dynamique** (lance ouverte, l’eau circule)
- Pression de fonctionnement : **LDV, lance canon, lance rideau : 6 bars** ; **injecteur mousse : 10 bars**
! Un binôme dans un feu doit pouvoir disposer de **500 l/min** pour sa sécurité
## Les pertes de charge
- Pression perdue entre la pompe et la lance à cause des **frottements** de l’eau contre les parois et les raccords
- Proportionnelles à la **longueur** ; plus le **diamètre** est gros, moins il y a de pertes ; varient avec l’état du tuyau
- **Débit × 2 = pertes × 4** (carré du débit) ; elles ne dépendent **pas de la pression**
- Dénivelé : **+1 bar par 10 m de montée**, −1 bar par 10 m de descente (un étage ≈ 3 m)
- Environ **+1 bar par pièce** (division, réduction, colonne sèche)
| Tuyau 20 m | Débit | Perte |
| Ø45 | 250 l/min | 0,3 bar |
| Ø45 | 500 l/min | 1,2 bar |
| Ø70 | 500 l/min | 0,1 bar |
| Ø70 | 1 000 l/min | 0,4 bar |
| Ø110 | 1 000 l/min | 0,1 bar |
## Le calcul
- **Pression pompe = pression lance + pertes tuyaux + dénivelé + pièces**
- Ex. : LDV 500 l/min, 3 Ø45, 3e étage (≈ 10 m) : 6 + 3,6 + 1 = **10,6 bars**
- Règle : **pas plus de 3 tuyaux de Ø45** après la prise d’eau ; pour aller loin, du Ø70 jusqu’à une division
- Citerne de 3 000 L avec une lance à 500 l/min : vide en **6 minutes** ; il faut vite alimenter l’engin
> Pompe = 6 + tuyaux + 1 par 10 m + 1 par pièce` },
  { titre:'Les points d’eau incendie', tags:'PEI DECI poteau bouche incendie couleurs rouge bleu jaune vert aspiration plaque signalisation clé fédérale clé de barrage division Ø100 Ø110 Ø70 aspiraux crépine flotteur noyade coup de bélier',
    contenu:`- **DECI** (défense extérieure contre l’incendie) : poteaux et bouches sous pression, points d’eau naturels ou artificiels, autres dispositifs, autodéfense
| Couleur du poteau | Signification |
| Rouge | Eau sous pression |
| Rouge cerclé de vert | Sous pression, eau non potable |
| Bleu | Pas de pression : il faut aspirer |
| Jaune | Très forte pression (plus de 8 bars) |
| Vert | Borne de puisage, **interdite aux pompiers** |
- Bouche : rouge ou noire (pression), bleue (aspiration), jaune (forte pression) ; repérée grâce à sa plaque, **17 tours**
| Poteau | Débit | Ouverture |
| Ø80 | 500 l/min | 13 tours |
| Ø100 (le plus courant) | **1 000 l/min** | 13 tours |
| Ø150 | 2 000 l/min | 17 tours |
- Pression : **1 bar** minimum eau qui coule, **16 bars** maximum ; plaque : en haut le type, dans le rond le diamètre ou le débit, en bas la distance ; pendant le trajet, le binôme d’alimentation repère **2 points d’eau**
## Poteaux et bouches
- Matériel : **clé fédérale** (poteau), **clé de barrage** (bouche), tuyau **Ø110 de 20 m**, **division Ø100** (2 sorties de 65), coude et retenue (bouche), tuyaux Ø70
- Étapes : établir, **purger**, installer, raccorder et ouvrir, ramener la clé et vérifier
- Moins de 20 m : un Ø110, le conducteur seul ; plus loin : Ø70 en Z (1 ligne sur 200 m ou 2 sur 100 m)
- On ouvre **doucement et en entier**, sens inverse des aiguilles d’une montre (coup de bélier ; poteau à moitié ouvert qui fuit)
! On établit toujours **de l’engin vers le point d’eau**
## L’aspiration
- La pompe vide l’air : l’eau monte ; **6 m de haut** maximum, **8 m** maximum entre engin et crépine
- **Aspiraux** rigides Ø110 de 2 m (4 ou 8), **crépine** (bloque les débris), **flotteur** (crépine **30 cm sous la surface**, **50 cm au-dessus du fond**), **commande** amarrée à l’engin
! Pas d’entrée d’air : un joint mal serré et la pompe ne peut pas aspirer
! Risque de **noyade** : jamais seul au bord de l’eau, on ne va pas dans l’eau
> Rouge : pression. Bleu : aspiration. Jaune : forte pression. Vert : interdit` },
  { titre:'Les établissements (alimentation, lances particulières)', tags:'établissements ordres En reconnaissance Établissez Fermez Ouvrez Raccordez Plongez SMES alimentation dévidoir mobile lance canon 2000 l/min SIM lance rideau queue de paon LRM 26 m mousse injecteur 1 % prolongement remplacement tuyau',
    contenu:`## Les ordres du chef d’agrès
- « **En reconnaissance !** » : le binôme s’équipe, prend son matériel et suit le chef
- « **Établissez !** » : le binôme réalise la manœuvre **en entier**
- « **Fermez !** » / « **Ouvrez !** » : on ferme ou ouvre l’eau ; « **Raccordez – Ouvrez !** » : on raccorde et on ouvre tout de suite
- « **Plongez !** » : la canne de l’injecteur va dans le bidon d’émulseur
- Les ordres suivent le **SMES** : Situation, Mission, Exécution, Sécurité
## Alimenter l’engin
- Dès qu’une LDV est en service ; moins de 20 m : conducteur seul avec un **Ø110** ; plus loin : 2e binôme avec des Ø70 en Z ou le **dévidoir mobile**
- Toujours **de l’engin vers le point d’eau**
## Les lances particulières
| Lance | À retenir |
| Lance canon | Jusqu’à **2 000 l/min**, établissement de **100 m** maximum, engin toujours alimenté |
| Lance rideau (queue de paon) | Mur d’eau de **26 m × 7 m** contre la chaleur ou les gaz, tuyaux Ø45 |
| LDV à mousse | Injecteur à **1 %**, au plus à **40 m** de la lance, adaptateur mousse sur la lance |
- Lance canon : tuyau **droit sur 5 m**, boucle devant la lance, **sangle (SIM)** accrochée à la lance
! La lance canon s’**amarre avant d’ouvrir l’eau** ; personne dans l’axe du jet
- Mousse : le porte-lance se place à l’intérieur de la boucle du tuyau en O, l’équipier vient le doubler
## Prolonger ou remplacer
- L’**équipier** pose et établit le ou les tuyaux pendant que le chef continue l’attaque
- Le chef ordonne « Fermez ! », raccorde côté lance, puis « Ouvrez ! » ; le binôme vérifie et reprend
- Tuyau percé : écarté et marqué d’un **nœud près de son raccord**
! Pas plus de **3 tuyaux de Ø45** après la prise d’eau
> Le chef garde la lance, l’équipier fait le travail, l’eau est coupée le moins longtemps possible` },
  { titre:'L’échelle à crochets', tags:'échelle à crochets 2 plans crochets pointes montants 4,20 m 15 kg 14 échelons 300 kg test de suspension 3 points de contact enroulement enjambement 1er étage assuré harnais garant aluminium 660',
    contenu:`## Connaître l’échelle
- Éléments : **crochets** (sur l’appui de fenêtre ou le balcon), **pointes** (contre la façade), montants, échelons, entretoise, dispositif d’écartement ; version **2 plans** repliée pour le transport
| Caractéristique | Valeur |

| Poids | **15 kg maximum** : une seule personne la manœuvre |

    contenu:`## Les bases
- **Ancrage solide** (un doute : on en change) ; **connecteur automatique** toujours entre la corde et la victime
- Le **régulateur** tient le **garant** et freine la descente : il ne le lâche jamais
- Ordres : « Laissez filer ! », « Du mou ! », « Sec ! », « Contact ! », « À bras – Ferme ! », « Victime en sécurité ! »
- Rôles : le **chef d’équipe** vérifie la faisabilité, choisit l’ancrage, installe l’amarrage ; le **chef d’agrès** contrôle la descente ; le binôme **vérifie et teste** tout le dispositif avant chaque descente
- 4 techniques : sauvetage **par l’extérieur** (descente), **abordage** d’une victime au harnais (descente), **excavation** (descente et remontée), **reconnaissance d’appartement**
- Ancrage douteux, corde trop courte, victime trop blessée : on appelle une **équipe spécialisée**
## La victime
- La rassurer : **se présenter**, demander son prénom, **expliquer**, rester avec elle, être bienveillant
- **Triangle d’évacuation**, victime consciente : bras dans les bretelles, bas du triangle sous les aisselles, attaches de la poitrine fermées avec le connecteur, bretelles serrées
- Victime inconsciente : d’abord **sur le côté**, triangle sur le dos, puis à plat
- Passage au vide (inconsciente) : sur le ventre, pieds vers la fenêtre, un sauveteur de chaque côté, sans lâcher le garant
! **Syndrome du harnais** : rester suspendu sans bouger peut entraîner perte de connaissance puis arrêt cardiaque : faire vite
## Les sauvetages
- Par l’extérieur : la **commande** tenue d’en bas écarte la victime du mur
- Au harnais : le sauveteur ne se détache que si le **sol est stable**
- Excavation (puits, fosse) : binôme 1 descend, binôme 2 remonte ; **mesurer l’air**, ARI si besoin ; protéger la corde sur le bord
- Appartement porte fermée : s’annoncer « **Sapeurs-pompiers !** », puis ouvrir la porte aux secours
## À l’entraînement
! **Toujours un mannequin**, **3 m maximum**, **double assurance** par les formateurs, EPI complets
> Triangle pour la victime, harnais pour le sauveteur, connecteur entre corde et charge` },
  { titre:'L’engagement sous ARI', tags:'ARI appareil respiratoire isolant binôme RAPACE contrôle croisé 270 bars enregistrement contrôleur binôme de sécurité autonomie 55 bars sifflet ligne de vie ligne guide liaison personnelle main gauche AIDES R reconnu je suis je vois je fais récupération réengagement',
    contenu:`## Avant d’entrer
- Binôme : le **chef d’équipe** (sécurité, lance ou ligne guide, chemin) et l’**équipier** (suit, **caméra thermique**, observe) ; toujours un contact main, vue ou voix
- Contrôle croisé **RAPACE** : **R**obinet ouvert à fond, **A**rmement de la balise, **P**ression **au moins 270 bars**, **A**justement des EPI, **C**ode de communication, **É**tanchéité du masque
- Conditions : binôme contrôlé, **ordre** du chef d’agrès, **enregistré**, autonomie connue, radio et balise en marche, lien avec la sortie
- Enregistrement : noms, pression, heure d’entrée, heure de sortie prévue, mission ; le **contrôleur** surveille, le **binôme de sécurité** est prêt
- Autonomie = pression × taille bouteille ÷ air respiré : ex. **250 × 7,2 ÷ 105 = 17 min** (réserve de 50 bars non comptée)
| Activité | Air respiré |
| Repos | 10 L/min |
| Engagement à vue | 50 L/min |
| Ligne de vie | 105 L/min |
| Sauvetage | 135 L/min |
! Le **sifflet sonne (55 bars)** : le binôme ressort **immédiatement**
## S’engager
- **À vue** : environ 30 à 36 min d’air ; **sur ligne de vie** (tuyau ou ligne guide) : environ **14 à 17 min**
- **Liaison personnelle** de **6 m** entre le porteur et la ligne ; radio portative
- Sans visibilité : **main gauche ou main droite**, se tenir bas, escalier descendu à reculons
- Exploration **linéaire**, **latérale** ou **circulaire** ; nœud de la ligne guide : **un tour mort et deux demi-nœuds**
- **AIDES** : **A**ccéder, **I**soler (fermer la porte), **D**ésenfumer, **E**xplorer, **S**auver ; pièce fouillée marquée **R** (reconnue)
- Difficulté : message de détresse ; **après 3 essais** sans réponse, appel de détresse radio puis balise
! Ne jamais retirer son masque dans la fumée
## Après la mission
- Compte rendu : **Je suis, je vois, je fais** ; se désenregistrer
- Récupérer : se découvrir, se rafraîchir, boire (**cracher la 1re gorgée**), lingettes
- On ne repart pas si : suie au mouchage, malaise, cœur **plus de 140**, respiration **plus de 25**, peau très rouge ou pâle, comportement inhabituel
> RAPACE avant d’entrer, sifflet = on sort` },
  { titre:'Les systèmes d’information et de communication', tags:'SIC radio 18 15 17 112 114 CTA CODIS ANTARES mode relayé direct BER statuts TPH 900 TTH 900 alternat alphabet phonétique décomposer chiffres parlez reçu terminé collationnez indicatifs urgent silence radio',
    contenu:`## L’alerte
| Numéro | Service |
| **18** | Sapeurs-pompiers |
| **15** | SAMU |
| **17** | Police, gendarmerie |
| **112** | Numéro européen |
| **114** | Par SMS (personnes sourdes ou qui ne peuvent pas parler) |
- Chemin : appel au 18 ou 112, le **CTA** choisit les secours, le centre est déclenché, l’engin part ; le **CODIS** suit toutes les interventions et envoie des renforts
- **ANTARES** : réseau radio national partagé (pompiers, SAMU, police, gendarmerie) ; **mode relayé** (antennes, loin, avec le CODIS) et **mode direct** (poste à poste, sur l’intervention)
## Les postes
- Dans l’engin : le **boîtier émetteur-récepteur** envoie les **statuts** : **1 = parti**, **2 = sur les lieux**
- Portatifs : **TPH 900** (chef d’agrès, vers le CODIS et le chef de groupe), **TTH 900** (chef d’agrès, chefs d’équipe, conducteur ; avec **bouton de détresse**) ; **6 portatifs** dans le FPT
- Utilisation : allumer et vérifier, **écouter avant de parler**, appuyer sur l’**alternat**, attendre **1 seconde**, parler à 5 cm, relâcher pour écouter
! Bouton de détresse : seulement en cas de vrai danger, jamais en exercice sans accord
## Parler à la radio
- Je prépare, je fais **court**, je parle clairement, je fais répéter, je reste discret (pas de nom de victime), pas de bavardage
- **Alphabet phonétique** : Alpha, Bravo, Charlie… ex. JSP = **Juliett, Sierra, Papa**
- **Décomposer** : ex. 6 = « six comme deux fois trois », 35 = « trois comme deux et un, cinq comme trois et deux »
- Mots : **Parlez** (à toi), **Reçu**, **Terminé**, Attendez, Répétez, **Collationnez** (répète mon message), Fort et clair ; on ne dit pas « ok »
- Appel : **celui qu’on appelle, puis qui on est** : « CODIS 34 de FPT Cruzy-Quarante, parlez »
- Compte rendu : **Je suis, je vois, je fais, je demande**
- Urgence : « **Urgent, urgent, urgent** », puis **silence radio** ; fin : « silence radio suspendu »
> On dit « reçu », jamais « ok »` },
  { titre:'L’explosimétrie et la coupure des fluides', tags:'gaz naturel méthane butane propane GPL fuite LIE LSE explosivité détecteur multigaz CO H2S O2 PGC PGR procédure gaz périmètre 50 m 100 m bouteilles ogive coupure gaz électricité disjoncteur Linky GRDF ENEDIS',
    contenu:`## Le gaz
- **Gaz naturel** (méthane, gaz de ville) : **plus léger** que l’air, il monte
- **Butane et propane** (GPL, bouteilles, citernes) : **plus lourds**, ils s’accumulent en bas (caves, sous-sols)
- Le gaz n’a pas d’odeur : on lui **en ajoute une** (œuf pourri) pour détecter les fuites
- Fuites : après le compteur, sur le réseau (coffret, colonne montante), sous la terre (travaux), bouteilles
- Explosif entre la **LIE** (limite inférieure d’explosivité) et la **LSE** (limite supérieure)
| Gaz | Zone explosive |
| Méthane | **5 % à 15 %** |
| Propane | 2 % à 10 % environ |
| Butane | 1,5 % à 8,5 % environ |
- Dangers : explosion (souffle), incendie, asphyxie, intoxication au CO (chaudière mal réglée)
! Une étincelle (interrupteur, sonnette, téléphone, moteur) suffit dans la zone explosive
## Mesurer et agir
- **Détecteur multigaz** : mis en route **à l’air libre** ; mesure explosivité (% LIE), **O2** (normal environ 21 %), **CO** (alarme **20 ppm** / **100 ppm** : ARI obligatoire), **H2S** (5 / 10 ppm)
- **PGC** (procédure gaz classique) : la plupart des cas, reconnaissance et appel de GRDF
- **PGR** (procédure gaz renforcée) : fuite sous la rue sans sortie à l’air libre, fuite enflammée sur coffret en façade, ou sur demande ; coupure du réseau dès l’alerte
- Périmètre : **zone d’exclusion 50 m** (évacuation), **zone contrôlée 100 m** ; pas de téléphone en zone d’exclusion
- Bouteilles, couleur de l’ogive : **rouge** inflammable, **jaune** toxique ou corrosif, **bleu clair** oxydant, **vert** inerte ; chauffée, elle peut éclater
## Couper les fluides
- Gaz, électricité, eau : **toujours sur ordre du chef**, on rend compte, **on ne remet jamais en service** soi-même
- Gaz : **quart de tour**, poignée **en travers du tuyau = fermé** ; les pompiers ne touchent pas au réseau sous la rue (GRDF)
- Électricité : **disjoncteur général** ; Linky affiche « circuit ouvert » ; coffret d’immeuble : technicien ENEDIS
! Fuite : je fais sortir, j’aère, je ferme le gaz, je balise ; pas d’interrupteur, de flamme ni de téléphone
> En travers = fermé, dans le sens du tuyau = ouvert` },
  { titre:'Les bilans et les détresses vitales', tags:'bilans circonstanciel urgence vitale complémentaire surveillance transmission fréquence respiratoire pouls SpO2 détresse respiratoire circulatoire étouffement obstruction claques compressions hémorragie garrot nez section malaise AVC brûlures plaies',
    contenu:`## Les bilans dans l’ordre
- **Circonstanciel**, **urgence vitale**, **complémentaire**, **surveillance**, **transmission**
- Circonstanciel : que s’est-il passé ? danger ? combien de victimes ? secours suffisants ? infos de départ justes ?
- Urgence vitale : d’abord ce qui se voit (**étouffement**, **hémorragie**), puis répond / respire (PLS ou RCP + DAE), puis respiration, circulation, conscience
- Complémentaire : j’interroge (douleur de 0 à 10, maladies, traitements, allergies) et j’examine
- Transmission : qui, ce qui s’est passé, ce que j’ai trouvé, ce que j’ai fait, l’évolution
| Normes | Respiration / min | Pouls / min |
| Adulte | **12 à 20** | **60 à 100** |
| Enfant | 20 à 30 | 70 à 140 |
| Nourrisson | 30 à 40 | 100 à 160 |
- SpO2 normale **94 % ou plus** ; bout du doigt recoloré en **moins de 2 s**
## Les urgences vitales
- Détresse respiratoire : lèvres bleues, parle mal, bruits ; position où elle respire le mieux (souvent assise), alerter
- Obstruction **partielle** (tousse, parle) : on encourage à tousser, **aucune claque**
- Obstruction **totale** : **1 à 5 claques dans le dos**, puis **1 à 5 compressions abdominales** (nourrisson : compressions sur la poitrine) ; perte de connaissance : RCP
- Détresse circulatoire : pâleur, sueurs, pouls rapide et faible ; allonger, couvrir, alerter
- Hémorragie : gants, **compression directe**, sinon **garrot** au-dessus de la plaie, jamais sur une articulation
! Garrot posé : on **note l’heure** et on ne le desserre jamais
- Nez : assis, **tête penchée en avant**, narines pincées **10 minutes** ; oreille après un choc : grave ; membre sectionné : dans un sac propre, sur du froid sans contact direct
## Les autres atteintes
- Malaise : repos, interroger, alerter, surveiller ; AVC (bouche de travers, bras faible, parole) : **noter l’heure**
- Brûlure : **eau tempérée** jusqu’à disparition de la douleur ; grave si cloque plus grande que la moitié de la paume, visage, mains, électrique, chimique, enfant
! Jamais de glace, de beurre ni de crème sur une brûlure
- Plaie grave : **objet planté jamais retiré** ; poitrine : demi-assise ; ventre : allongée jambes pliées ; œil : allongée yeux fermés
> Une détresse trouvée : je fais le geste tout de suite, puis je reprends le bilan` },

{ id:'jsp4', nom:'JSP 4 · Techniques opérationnelles', icone:'🔥', couleur:'#bf360c', source:'Cours JSP SDIS 34 · JSP 4', groupe:'jsp',
  fiches:[
  { titre:'Le binôme de reconnaissance', tags:'reconnaissance binôme équipier chef d’équipe caméra thermique COMIT fumées AIDES marquage R main droite main gauche repli secours ligne guide liaison personnelle 6 m recherche primaire secondaire INC A1',
    contenu:`## À quoi sert la reconnaissance ?
- **Sauver** (sauvetages et mises en sécurité), comprendre le **bâtiment** (forme, accès, dispositifs de sécurité)
- **Trouver le feu** : où, quelle taille, ce qui brûle, où il peut aller
- **Couper** les énergies (électricité) et les fluides (gaz), ramener l’**ascenseur au RDC**, porte calée ouverte
- Choisir le **moyen d’extinction** : la reconnaissance donne au chef les infos pour décider
## Le binôme : 2 sapeurs-pompiers, une équipe
| Rôle | Ce qu’il fait |
| Chef d’équipe | Garant de la sécurité, porte la **lance ou la ligne guide**, fait les amarrages |
| Équipier | Porte la **caméra thermique**, observe, explore, signale |
- Contrôle croisé **RAPACE** avant d’entrer, contact **physique, visuel ou verbal** permanent
- Toujours **à deux** en zone dangereuse ; sans ordre, on reste dans l’engin
- Ordre : « 1er binôme, (pour l’établissement d’une LDV 40,) **en reconnaissance** ! » ; « **À vos rangs** ! » = derrière l’engin
## Fumées : 5 dangers (C-O-M-I-T)
- **C**haudes, **O**paques, **M**obiles, **I**nflammables, **T**oxiques : on n’y entre que sous ARI, en binôme, sur une **ligne de vie**
## Progresser et chercher
- Relié à la sortie par le **tuyau en eau** ou une **ligne guide** ; liaison personnelle de **6 m**
- Exploration **linéaire, latérale, circulaire** ; debout, accroupi ou à 4 pattes (plus c’est chaud, plus on se baisse)
- Escalier dangereux : descente en **marche arrière** ; on longe un mur choisi : **main gauche ou main droite**
- Immeuble : 1) **étage du feu + ascenseurs** 2) étage au-dessus et **dernier étage** 3) les autres. Feu maîtrisé : recherche complète (secondaire)
- **AIDES** (petite pièce, depuis l’extérieur) : Accéder, Isoler (fermer la porte), Désenfumer (fenêtre laissée ouverte), Explorer, Sauver
- Marquage à la craie **R = Reconnu**, porte refermée ; pas de marque = pièce pas vue
## Ressortir
- **Chemin de repli** (celui de l’entrée, prioritaire) > **chemin de secours** (échelle par une fenêtre) > **se mettre à l’abri**
- Compte rendu en sortant : accès, couloirs, étages touchés, actions, propositions, évolution du feu
> Victime trouvée : sauvetage, évacuation ou confinement ; on se présente, on parle fort, on ne la lâche plus
! « ÉVACUATION, ÉVACUATION, ÉVACUATION » : on sort tout de suite vers le point de regroupement` },
  { titre:'La mise en œuvre de l’ARI', tags:'ARI appareil respiratoire isolant RAPACE 270 bars capeler coiffer règle des minimums cagoule d’évacuation SPA signalement positionnement air saut d’inspiration message de détresse URGENT NELAR sauvetage évacuation confinement INC A5',
    contenu:`## Les réflexes du porteur (automatiques)
- **Capeler**, **coiffer** le masque sans fuite, contrôle croisé **RAPACE** : Robinet, Armement, Pression **≥ 270 bars**, Ajustement, Code, Étanchéité
- Connaître les **codes** (ça va, retour, j’ai plus d’air…), lire et annoncer son **manomètre**, binôme **indissociable**
- Autonomie en activité : environ **14 min** (bouteille 6 L) ou **17 min** (7,2 L)
## La règle des minimums
- Minimum de **personnes** (+ binôme de sécurité dehors), de **temps** (selon l’air et la respiration), de **risque** (identifié avant d’entrer)
## Progresser sans voir
- Relié à la ligne de vie, main au mur, en tâtant ; bas quand il fait chaud
- Fils et câbles : passer **dessous**, au ras du sol, bouteille dans l’angle mur/sol
## Sauver ou mettre en sécurité
| Action | Quand |
| Sauvetage | Danger de mort **immédiat**, la personne ne peut pas s’en sortir seule |
| Évacuation | Pas encore menacée : on la fait sortir **accompagnée** |
| Confinement | Sortir serait plus dangereux : elle reste **à l’abri, porte fermée** |
- Rassurer : « **Pompiers !** », la toucher, expliquer, ne plus la lâcher
- Cagoule d’évacuation : pour un **long chemin enfumé** (pas si la sortie est à vue) ; l’air vient de la **bouteille du sauveteur** ; quelques secondes sans air à la pose
## En difficulté : S-P-A
- **S**ignalement (chercher le tuyau, message radio, lampe, balise), **P**ositionnement (au sol, contre un mur, taper), **A**ir (respiration calme)
- **Saut d’inspiration** : inspirer, retenir, expirer. En économie, bouteille 6 L : **300 bars = 3 h**, 200 = 2 h, 100 = 1 h, 50 = 30 min
- Le sifflet d’alarme consomme de l’air : on peut le boucher avec le doigt
## Message de détresse
- « **URGENT, URGENT, URGENT** » puis **Je suis** (qui, où), **Je vois** (problème + pression), **Je fais**, **Je demande**
> Équipier sans air : cagoule d’évacuation, raccord sur sa bouteille, on partage l’air et on ressort, on prévient
! Paniquer fait respirer plus vite et vide la bouteille : rester calme` },
  { titre:'Sauvetages et mises en sécurité', tags:'sauvetage à vue exploration mise en sécurité confinement évacuation source flux cible échelle à coulisse 2 plans 3 plans MEA grande échelle 18 24 30 dégagement d’urgence porter pompier LSPCC connecteur 3 m double assurance INC B1',
    contenu:`## Deux sortes de sauvetages
- **À vue** : victime visible de l’extérieur (fenêtre, balcon) → échelles, grande échelle, LSPCC
- **En exploration** : il faut entrer (fumées, chaleur, effondrement) → lance et ligne de vie
- On peut agir sur la **source** (couper le gaz, éteindre), le **flux** (désenfumer, ventiler, lance) ou la **cible** (sauver, évacuer, confiner)
## Jusqu’à quel étage ?
| Moyen | Jusqu’au |
| Escaliers, couloirs | En priorité |
| Échelle à coulisse 2 plans | 2e étage |
| Échelle à coulisse 3 plans | 4e étage |
| Grande échelle (MEA) 18 m | 6e étage |
| MEA 24 m | 8e étage |
| MEA 30 m | 10e étage |
- Et aussi l’échelle à crochets et le **LSPCC** quand les échelles ne passent pas
## Le confinement
- Escalier enfumé, logement non touché : « Fermez la porte, linge mouillé dessous, faites-vous voir à la fenêtre, ni escalier enfumé ni ascenseur »
## Sans matériel
- **Dégagement d’urgence** seulement si danger **réel, immédiat, impossible à supprimer**, victime visible et accessible : tirer par les **chevilles, poignets ou vêtements**, dans l’axe du corps
- 5 portés : accompagnement, à dos, dans les bras, **porter pompier**, en chaise à deux
## Échelles et MEA
- Victime consciente : sauveteur **juste en dessous**, attention au **passage au vide**
- Inconsciente : échelle au ras du mur, jambes sur les **épaules**, aisselles sur les **bras** du sauveteur
- MEA : sauvetage **isolé** (panier), **multiples** (par l’échelle), **par transfert** ; sol solide, pas de câbles ni balcons gênants
## LSPCC : règles d’or
- **Casque et gants**, **connecteur** entre la corde et la charge **toujours verrouillé**, ancrage solide et vérifié, contrôle croisé
- Ordres : « **Sec** ! », « **Du mou** ! », « **Contact** ! » ; à l’entraînement la victime est **un mannequin**
- Dangers : chute (rester sous l’amarrage), **balancier**, **frottement** sur une arête, rester **suspendu** (perte de connaissance)
! JSP : **3 m maximum**, **double assurance**, contrôle par un formateur
> Empathie : se présenter, expliquer chaque étape, garder le contact, ne jamais se moquer de la peur du vide` },
  { titre:'La sauvegarde opérationnelle', tags:'sauvegarde opérationnelle auto-sauvetage sauvetage de sauveteur façades A B C D évacuation toxicité fumées je sais je sens je vois récupération non-réengagement appel de détresse SOS abordage SIM déshabillage INC B2',
    contenu:`## De quoi parle-t-on ?
- Savoir et savoir-faire pour **ne pas se mettre en danger**, **s’en sortir**, et **être retrouvé vite**
- Deux volets : l’**auto-sauvetage** et le **sauvetage de sauveteur**
## Anticiper avant d’entrer
- Chemin de **repli** libre, chemin de **secours** (échelle prête), **binôme de sécurité**, parc matériel, **contrôleur** (qui, depuis quand, combien d’air), règle des **minimums**
- Façades : **A** = entrée principale (ou choisie par le 1er chef), puis **B, C, D** dans le sens des aiguilles d’une montre
- « **ÉVACUATION ×3** » : donné par **n’importe quel intervenant**, d’abord à la radio ; on sort et on rejoint le point de regroupement
## Toxicité des fumées
- Entrée par la **respiration**, la **bouche**, la **peau** (cou, mains, visage), les **yeux** ; la suie continue de contaminer après le feu
| Souillure | Exposition | Nettoyage |
| Aucune | Pas exposé | Rien |
| JE SAIS | Fumée courte à l’air libre | Aérer la tenue, rincer le matériel |
| JE SENS | Fumée courte (attaque, déblai) | Brossage, lavage matériel, cabine |
| JE VOIS | Longue, traces visibles | Tenue en sac, tenue propre, engin lavé |
- Lingettes sur place (mains, visage, cou) et **douche** au retour
## Récupérer et écouter son corps
- Enlever casque, masque, cagoule, poser l’ARI, ouvrir la veste, s’asseoir, **boire (cracher la 1re gorgée)**
- Signes d’alerte : **suie dans le nez au mouchage**, malaise, cœur ou respiration très rapides, comportement inhabituel → **pas de réengagement**
## Se sauver
- Point rapide → « URGENT ×3 » → S-P-A → attendre ou sortir
- **3 messages sans réponse** → appel de détresse : bouton **3 secondes**, « SOS » sur toutes les radios pendant **20 s**
- Évacuation d’urgence : par une fenêtre (attendre l’échelle) ou par un tuyau amarré ; **pas de saut dans le vide**
## Sauver un équipier
- Binôme **dédié**, en forme, **≥ 270 bars**, mission **exclusive** (pas d’attaque en même temps)
- Abordage : danger ? conscience et respiration ? bouteille ouverte ? compte rendu, air, serrer les bretelles
- Traction par la **poignée de l’ARI** ou la **SIM** ; dehors, déshabillage en **30 s environ** pour soigner
! Ne jamais foncer seul : on deviendrait une deuxième victime. Jamais de vraie détresse radio à l’entraînement` },
  { titre:'Les phénomènes thermiques', tags:'phénomènes thermiques EGE embrasement généralisé éclair flashover explosion de fumées backdraft FGI Fire Gas Ignition stratification plan neutre ouvrants lecture des fumées ouverture de porte refroidissement attaque offensive défensive INC C1',
    contenu:`## Le feu en volume
- **Assez d’air** : le feu grandit et peut tout embraser d’un coup
- **Pas assez d’air** : il couve et remplit la pièce de gaz chauds ; une entrée d’air peut tout faire exploser
- **Stratification** : fumées chaudes en haut, air frais en bas ; la limite = **plan neutre**. S’il descend : alerte !
- Trop d’eau mal placée : la vapeur **casse les couches**, tout redescend sur nous
- Une porte ouverte = **de l’air pour le feu** ; fermée, elle le ralentit. Ouvrir : lance prête + accord du chef
- Lire les fumées : **quantité, vitesse, épaisseur, couleur**
## La fumée, c’est du combustible
| Phénomène | Le feu… | Déclencheur | Où | On fait |
| Embrasement généralisé éclair | a assez d’air | chaleur des fumées | pièce du feu | refroidir, se replier |
| Explosion de fumées | manque d’air | une entrée d’air | pièce du feu | ne pas ouvrir |
| FGI | est ailleurs | flamme, étincelle | à côté, au-dessus | chercher, refroidir, fermer |
- Signes de l’**EGE** : chaleur qui oblige à se baisser, fumées qui descendent, **petites flammes dans les fumées**, objets qui fument à distance
- Signes de l’**explosion de fumées** : vitres noires et grasses, fumées jaunâtres par **saccades**, sifflement, poignée chaude, fumées aspirées sous la porte
- **FGI** : fumées accumulées dans une pièce voisine, un faux plafond, une gaine, souvent **loin du foyer**
## Les techniques
- Ouvrir une porte : **sur le côté**, accroupi, tester la chaleur (caméra, eau en haut de porte), lance en eau, ouvrir un peu, **impulsions**, refermer, observer, entrer bas
- Refroidir les fumées : **jet diffusé**, vers le plafond, **très courtes impulsions**
- Attaque **directe** (base des flammes), **offensive** (on entre), **défensive** (de l’extérieur) ; ventilation sur ordre du chef
> La porte protège : tant qu’elle est fermée, elle retient le feu et les fumées
! Interdit de reproduire les expériences (boîte à feu, gaz…) : réservées aux formateurs` },
  { titre:'L’utilisation des lances', tags:'lances LDT LDV 40 LDV 65 lance canon lance rideau lance à mousse 500 l/min 2000 ligne d’attaque à disposition à sec en attente en manœuvre eau dopée jet droit diffusé d’attaque protection coup de bélier crayonnage FPTL INC C2',
    contenu:`## Une lance pour chaque mission
| Lance | À retenir |
| LDT | Petits feux, **40 m** max, jusqu’au **1er étage** ; ne protège pas en volume |
| LDV 40 | Lance d’attaque, **500 l/min**, 1 à 3 tuyaux de 45, jusqu’au **4e étage** par l’escalier |
| LDV 65 | Plus de débit, gros recul : à **2 ou 3** |
| Lance canon | Jusqu’à **2 000 l/min**, posée et attachée |
| Lance rideau | Mur d’eau de **26 m** de large et **7 m** de haut |
| Lance à mousse | Petites flaques d’hydrocarbure |
- **Ligne d’attaque** : obligatoire au-delà du **4e étage** par l’escalier ; 2 lances possibles, on coupe l’eau à la division
## Où en est la lance ?
- **À disposition** (tuyaux prêts) → **en cours d’établissement** → **à sec** (raccordée, pas d’eau) → **en attente** (en eau, fermée, prête) → **en manœuvre** (elle fonctionne)
## L’eau améliorée
- **Eau dopée** 0,1 à 0,4 % (pénètre mieux) ; **moussante** 0,5 à 1 % (étouffe aussi les vapeurs) ; **mousse** 1 % + embout
## Régler et tenir
- 3 réglages : **débit** (bague, l/min), **jet** (tête de lance), **ouverture** (poignée)
- **Jet droit** : loin, pénètre. **Diffusé d’attaque** : refroidir les fumées, éteindre. **Diffusé de protection** : écran contre la chaleur
- Pieds écartés, tuyau sous le bras, réserve de tuyau ; l’équipier **double** le porte-lance
- Sécurité : pas dans l’**axe** d’une ouverture en feu, loin des **aplombs**, jamais entrer sans lance, gilet et balisage sur la route
## Éteindre
- Refroidir les fumées, **attaque directe** à la base des flammes, **crayonnage** des murs et plafonds, protection en diffusé large, **attaque indirecte** (local fermé, vapeur), mousse sur les liquides
- FPTL ≈ **2 000 L** : à 500 l/min, citerne vide en **4 minutes** → débit adapté, fermer quand plus de flammes
- Ordre d’ouverture de l’eau : « **Raccordez – Ouvrez !** »
! Ouvrir ou fermer d’un coup = **coup de bélier** : tuyau qui éclate, blessure
> Dès que le feu est dans une pièce : LDV 40, pas la LDT` },
  { titre:'Les établissements spécifiques', tags:'établissements spécifiques ETB 3.3 3.4 3.5 3.6 3.7 échelle à coulisse commande hissez colonne sèche ligne d’attaque vertical haut en bas amarrage tours morts demi-nœuds déblai surveillance INC C3',
    contenu:`## Les ordres
- Préparatoire : « 1er binôme, établissement d’une LDV 40 avec la commande, **en reconnaissance** ! »
- Exécution : « 1er binôme, point d’attaque ici…, **Établissez** ! » ; eau : « **Raccordez – Ouvrez** ! »
## Quel établissement, jusqu’où ?
| Établissement | Limite |
| LDV 40 par l’escalier | **4e étage** (au-delà : ligne d’attaque) |
| Échelle à coulisse | **2e** (2 plans) / **4e** (3 plans) |
| Avec la commande (on hisse) | **6e étage** |
| Vertical de haut en bas | **8e étage** |
| Colonne sèche | **Toujours en priorité** si elle existe |
| Ligne d’attaque | Au-delà du **8e** : à **3 binômes** |
## Les techniques
- **Échelle à coulisse** (ETB 3.3) : le 2e binôme dresse l’échelle, chef d’équipe monte tuyau sur l’épaule ; tuyau amarré **pas sur l’échelle** (elle reste libre pour sortir)
- **Commande** (ETB 3.4) : « Pour envoyer la commande ! », le 2e binôme attache le tuyau en bas, « **Hissez** ! », amarrer puis ouvrir
- **De haut en bas** (ETB 3.5) : on descend les tuyaux depuis l’étage, attention au **vent**
- **Colonne sèche** (ETB 3.6) : le conducteur l’alimente en bas, on se branche sur la prise de **40** à l’étage du dessous ; peu de débit = vérifier les vannes des autres étages
- **Ligne d’attaque** (ETB 3.7) : le 2e binôme monte la division d’attaque et **4 tuyaux de 70** ; le chef d’agrès emporte une lance de plus
## Amarrer
- **Deux tours morts** de commande, serrer, **deux demi-nœuds** ; à la mise en eau on vérifie que le tuyau **ne descend pas**
- Un tuyau de 45 plein d’eau pèse plus de **30 kg** ; caler les portes ; retenir la division à la mise en eau
## Après le feu
- **Déblai** : chercher le feu caché (murs, plafonds, déchets) à la caméra thermique, sortir ce qui brûle ; fumée toxique = ARI ou masque
- **Surveillance** : lance **en attente**, rondes régulières (combles, faux plafonds, gaines) ; c’est le **COS** qui lève la surveillance
> L’équipier double le porte-lance une fois l’eau ouverte` },

    contenu:`## Mes EPI, de la tête aux pieds
- **Casque** avec visière, **cagoule** (cou, oreilles, visage), **veste et surpantalon**, **gants d’attaque**, **bottes**
- **Pas de bijoux, piercings, montre** : ils chauffent et accrochent
- Aucune peau à l’air : cagoule sous le casque et dans le col, veste fermée, col relevé, gants sur les poignets ; **contrôle croisé** par le binôme
## Les limites de la tenue
- Elle **retarde** la brûlure, elle ne l’empêche pas
- **Mouillée**, elle peut transmettre la chaleur et la vapeur sur la peau
- Oreilles ou mains qui brûlent = **trop chaud, on recule**
- Ne protège ni de l’**électricité** ni des **produits chimiques**
## Entretenir
- Avant : rien de déchiré ou brûlé, casque sans fissure. Après le feu : nettoyage « **je sais, je sens, je vois** »
- EPI abîmé = signalé et changé ; **jamais de tenue sale à la maison**
## Se préparer et rester vigilant
- Corps (entraînement, sommeil), hygiène de vie (manger, boire, aisance ARI), tête (stress, retours d’accidents), métier
- Regarder autour de soi, **garder le contact**, **rendre compte**, connaître **ses limites**
- Chaleur : rester bas ; bruit : parler fort et court, gestes ; sans vision : ligne de vie, main au mur, caméra thermique
## Face à un phénomène thermique
- Signes : chaleur qui monte vite, fumées qui descendent, **flammes dans la fumée**, sifflements
- 1) **Alerter** (« ça chauffe ! ») 2) **Se baisser** 3) **Refroidir** les fumées 4) **Se protéger** (diffusé large) 5) **Se replier** ensemble par le chemin d’entrée
- Repli : **lance face au feu**, collés, le **tuyau montre la sortie**, refermer la porte si possible
- Bloqué : se mettre à l’abri, « URGENT », la fenêtre, économiser l’air
! La lance, c’est la vie : on ne la lâche jamais` },
  { titre:'Le matériel de protection des biens', tags:'protection des biens bâche bâchage 3 m × 4 m VSRTU lot bâchage clous 100 mm marteau fil de fer tenaille faîtage sauvegarde mobilier assèchement épuisement avis de passage intempéries PPBE A1',
    contenu:`## Quand protège-t-on les biens ?
- **Tempête, orage** (toiture, vitres), **inondation, fuite**, **pendant et après un incendie**, **chute d’arbre**, **porte forcée** (on laisse les lieux fermés)
## La sauvegarde pendant un feu
- 1) **Regrouper** les meubles au centre 2) **Surélever** sur des cales 3) **Couvrir** d’une bâche bien bordée 4) **Mettre à l’abri** papiers, photos, objets précieux avec le propriétaire 5) **Évacuer l’eau**
- Limiter l’eau des lances, c’est déjà protéger les biens
## On protège, on ne répare pas
| Les pompiers | Ensuite |
| Mettent les personnes en sécurité | L’**artisan** répare |
| Mettent **hors d’eau** en urgence | L’**assurance** indemnise |
| Écartent un danger immédiat | La **mairie** peut aider à reloger |
| Laissent un **avis de passage** si personne n’est là | Le propriétaire reste responsable |
- Sinistrés choqués : rassurer, expliquer, les faire participer, **respecter** leurs affaires (on ne fouille pas)
## Le lot bâchage et protection (VSRTU)
- **4 bâches 3 m × 4 m**, boîte de **clous de 100 mm**, **marteau** de charpentier, rouleau de **fil de fer**, **tenaille**
- Une bâche 3 × 4 m aussi dans le FPTGP, le FPT grande puissance et le CCGC
- Autres lots : **assèchement** (aspirateur, 2 raclettes), **épuisement électrique** (pompe 15 ou 30 m³/h), éclairage, tronçonnage, jeu de cales, balisage
## Le bâchage
- La bâche passe **par-dessus le faîtage** : l’eau glisse dessus
- Plusieurs bâches : on pose **d’abord celle du bas**, celle du haut **recouvre** celle du bas (comme des tuiles)
- **Bien tendue**, bords enroulés sur une latte, sans trouer le milieu
- Étapes : reconnaître (charpente, électricité, vent) → sécuriser (échelle, LSPCC, MEA) → préparer au sol → poser du faîtage vers le bas → fixer et vérifier
- Fenêtre cassée : retirer le verre, bâche tendue côté extérieur. Éviter poches d’eau et bords qui claquent
! Dangers : **chute** (toujours attaché), **vent** (une bâche de 12 m² peut emporter quelqu’un), **électricité**, chute d’objets (baliser en dessous)
! JSP : travail **au sol uniquement**, jamais sur un vrai toit` },

    contenu:`## Deux familles
- **À traction électrique** : moteur + poulie + **câbles**, cabine et **contrepoids** (le plus répandu)
- **Hydraulique** : un **piston** pousse la cabine grâce à de l’huile sous pression, petites hauteurs (**moins de 18 m**)
- Sécurités : **serrures** des portes palières, **limiteur de vitesse**, **parachute**, éclairage de secours, alarme, trappe dans le plafond des grandes cabines
- En incendie : le public **ne prend jamais l’ascenseur** ; les pompiers le ramènent au **RDC, porte calée ouverte**
## Quand les pompiers interviennent (FOD n°14)
- Personne bloquée **en détresse** (malaise, panique, femme enceinte) ou **mineure**
- **Porte palière ouverte** sans cabine : risque de chute dans la gaine
- Personne bloquée sans urgence : d’abord l’**ascensoriste** (délai accepté **1 heure**) ; sinon les pompiers viennent et c’est **payant**
- Risques : malaise/panique, **chute**, **électricité** (220 à 380 V en machinerie) → tenue complète, casque, radios
## S.E.C.U.R.I.T.E.
| Lettre | Action |
| S – Situation | Où est la cabine ? quel ascenseur ? machinerie ? (clé d’ascenseur) |
| E – Électricité | **Couper le courant**, garder la lumière |
| C – Contact | Parler aux personnes, les rassurer |
| U – Utilisation radio | Liaison permanente ; le 1er équipier reste près des victimes |
| R – Ramener la cabine | Au niveau d’un étage (hydraulique : **vanne de purge**, on descend) |
| I – Inviter à sortir | Porte palière puis cabine ; sortie **vers le haut** de préférence |
| T – Technicien | Le faire venir, noter **marque et numéro** |
| E – Empêcher l’accès | **Toutes** les portes palières fermées, machinerie fermée à clé |
## Règles d’or
- On ne **remet jamais** l’ascenseur en marche (c’est l’ascensoriste)
- On ne sort personne d’une cabine **pas au niveau** de l’étage
- Cabine bloquée par le **parachute** : on attend le dépanneur (urgence vitale : sortie par l’étage du dessus sans bouger la cabine)
> Rassurer : « Les pompiers sont là », combien êtes-vous ? quelqu’un a mal ? « Reculez au fond de la cabine »
! Intervention simple mais des **accidents mortels** sont arrivés par excès de confiance ; les JSP ne touchent jamais une machinerie` },

    contenu:`## Forcer, c’est le dernier recours

- Après : refermer ou protéger le local, laisser un **avis de passage**
## Trois façons d’ouvrir
| Façon | Outils |
| Faire **levier** | Grande pince, Halligan tool, outil de force |
| **Frapper** | Masse, hache à plat de frappe |
| **Couper** | Coupe-boulons, scie, découpeuse |
## Nos outils
- FPTGP : **Halligan tool** (lame, pointe et fourche), **grande pince**, **masse**, **coupe-boulons** (cadenas, chaîne, grillage), **3 outils de force** sur la bouteille d’ARI des chefs d’équipe, **découpeuse thermique** (disque diamant)
- VSRTU : sacoche secours techniques (**brise-vitre**, **coupe-ceinture**, pince coupante), coupe pare-brise, scie sabre, **étais à sangle**, tronçonneuse, trousseau de clés
- Le Halligan tool sert aussi à sortir un pompier en difficulté (avec une sangle)
## Sécurité
- **Visière baissée**, **gants**, personne dans l’axe ni derrière la porte
- **Pas de découpeuse** s’il y a du gaz ou de l’essence (étincelles)
- Tronçonneuse, découpeuse : **pompiers formés seulement** ; outil rangé propre
## Le dégagement d’urgence
- Déplacer la victime de **quelques mètres**, en **quelques secondes**, vers un lieu sûr
- Sans matériel : traction par les **poignets**, par les **chevilles**, sortie de véhicule, équipier-relais, porter pompier
- Avec matériel : **plan dur**, grande sangle du LSPCC, Halligan + sangle (pour un pompier)
- Voiture : sécuriser (balisage, moteur coupé, étais), rassurer, gérer le verre, créer de l’espace
! Dégagement d’urgence **seulement si le danger est réel et immédiat**
! JSP : aucun outil motorisé ni hydraulique, outils à main à vide sous contrôle` },

    contenu:`## Les bilans, dans l’ordre
- **Circonstanciel** → **urgence vitale** → **complémentaire** (seulement quand les détresses sont prises en charge) → **surveillance** → **transmission**
- Après un malaise : où ? depuis quand ? déclencheur ? douleur **de 0 à 10** ? évolution ? maladies, médicaments, allergies
- Examiner : **visage** symétrique ? **bras** levés ? **parole** normale ? Si anormal : **AVC**, on le dit tout de suite
- Après un traumatisme : **mécanisme** (hauteur, choc, casque, ceinture), plaintes (fourmillements = nerfs ou moelle), palpation **de la tête aux pieds** ; choc violent : **maintenir la tête**
- Surveiller respiration, cœur, conscience, plaintes (surtout après relevage ou transport)
- Transmettre : motif réel, sexe et âge, plainte principale, résultats des bilans, gestes faits
## Traumatisme d’un membre
- Signes : **douleur**, **gonflement**, **déformation**, impossibilité de bouger ; os qui sort = fracture ouverte (on recouvre)
- **Ne pas bouger** le membre (position trouvée), couvrir la plaie, **retirer bagues**, **immobiliser** (articulations au-dessus et au-dessous), vérifier couleur, chaleur, sensibilité **avant et après**
- Entorse : **froid** dans un linge, jamais direct sur la peau
- VSAV : attelles à dépression (3 tailles), collier cervical, matelas immobilisateur, plan dur, brancard cuillère, chaise portoir
## La noyade
| Stade | Signes |
| Aquastress | Épuisée, angoissée, pas avalé d’eau |
| Petit hypoxique | Un peu d’eau : tousse, froid, peur |
| Grand hypoxique | Beaucoup d’eau : respire mal, conscience altérée |
| Anoxique | Ne respire plus : arrêt cardiaque |
- Ne respire pas : alerter, **5 insufflations**, puis RCP et DAE (**thorax séché**). Respire : protéger du **froid**, PLS si inconsciente
- Toujours un **avis médical** (aggravation possible plus tard)
## Relever, brancarder, nombreuses victimes
- Relevage à **3 ou 4**, **un seul chef** (à la tête) : « Attention pour lever… Levez ! » ; **dos droit**, axe **tête-cou-tronc**
- Brancard : **4 porteurs**, **pieds devant** en marchant, **tête en haut** dans l’escalier
- Nombreuses victimes : renforts **tout de suite** ; **noir** (décédée / ne respire pas), **rouge** (inconsciente qui respire, détresse, hémorragie), **jaune** (ne peut pas marcher), **vert** (se déplace)
! Noyade : on ne plonge pas seul (perche, bouée) : un sauveteur qui se noie = deux victimes` },

{ id:'jsp4b', nom:'JSP 4 · Risques, prévention et vie au CIS', icone:'🎖️', couleur:'#8d6e63', source:'Cours JSP SDIS 34 · JSP 4', groupe:'jsp',
  fiches:[
  { titre:'La prise de garde', tags:'garde prise relève garde postée astreinte disponible webdag appel FAT fiche armement inventaire ARI EPI masque reconditionnement chef de garde montante descendante',
    contenu:`## La garde : être disponible
- **Garde postée** : je suis au centre pendant un créneau, en tenue, prêt à partir
- **Astreinte** : je suis chez moi ou au travail, je pars au centre dès que le bip sonne
- **Disponible** : je signale que je peux partir si besoin, sans obligation (saisie dans **Webdag**)
- La **prise de garde** (relève) : la garde **montante** prend le relais de la garde **descendante**
## Se préparer la veille
- Une bonne **nuit de sommeil**, repas équilibrés, **hydratation**
- Tenue complète et propre, EPI en bon état ; arriver **avant l’heure** de l’appel
## Les 5 étapes de la prise de garde
| Étape | Ce qu’on fait |
| 1. Rassemblement | Tous en tenue, à l’heure : le chef de garde fait l’appel |
| 2. Répartition | Chacun connaît son engin et son poste (chef, conducteur, équipier) |
| 3. Consignes | La garde qui part transmet : engins indisponibles, matériel manquant, infos |
| 4. Vérifications | EPI, ARI et matériel de son poste |
| 5. Compte rendu | Tout va bien ou un problème : on le dit au chef de garde |
## Mes vérifications
- **EPI** : casque, visière, jugulaire, cagoule, veste, surpantalon, gants, bottes
- **ARI** : pression de la bouteille, **étanchéité du masque**, serrages du masque **desserrés au maximum**, masque à filet déposé dans l’engin si besoin
- **Engin** : inventaire selon la **fiche d’armement (FAT)**, niveaux (carburant, eau, émulseur), radios, gyrophares et deux-tons, sac de secours, défibrillateur, oxygène
## Pendant et après
- Après chaque intervention : **reconditionner tout de suite** (pleins, matériel, bouteilles d’ARI)
- Fin de garde : tout reconditionné, je transmets ce qui manque, je range, je pars **seulement quand on me libère**
> Un problème signalé à la prise de garde, c’est un problème réglé avant le départ.
! Un matériel manquant ou cassé ? On le signale toujours au chef de garde.` },
  { titre:'La prévention des risques routiers', tags:'route sécurité routière accident vitesse alcool téléphone fatigue ceinture prioritaire deux-tons gilet balisage casque vélo scooter permis AM B probatoire ONISR',
    contenu:`## La route tue (France métropolitaine, 2024)
- **3 193** personnes tuées ; environ **16 000** blessés graves
- **1 tué sur 6** a entre **18 et 24 ans** ; **23 %** des tués étaient en deux-roues motorisé
- Grandes causes : **vitesse**, **alcool et drogues**, **téléphone**, **fatigue**, pas de ceinture ou de casque, météo (pluie, brouillard, boue des vendanges)
## Sur l’alerte : rejoindre le centre
- Ma voiture personnelle **n’est pas prioritaire** : je respecte le Code de la route
- Pas de précipitation, je lis l’alerte **à l’arrêt**, je me gare sans gêner la sortie des engins
## Dans l’engin
- Feux bleus + deux-tons = **véhicule d’intérêt général prioritaire**
- Il peut passer au rouge ou dépasser la vitesse **seulement sans mettre les autres en danger** : la priorité se demande, elle ne se prend pas
- Équipage **assis et ceinturé** tant que l’engin roule ; on s’équipe avant le départ ou à l’arrêt
## Sur la chaussée
- **Gilet haute visibilité** dès qu’on descend ; balisage (engin en protection, cônes, triangle, feux)
- Ne jamais tourner le dos à la circulation ; descendre côté bas-côté ; éloigner les curieux
## Le JSP usager de la route
- Casque **obligatoire en scooter** (et à vélo avant **12 ans**) ; **gants** obligatoires en deux-roues motorisé
- Lumières et gilet la nuit ; **écouteurs interdits** en conduisant, même à vélo
| Âge | Étape |
| 14 ans | Permis AM (scooter 50) |
| 15 ans | Conduite accompagnée |
| 17 ans | Permis B |
- Jeune conducteur : permis probatoire de **6 points**
! Rouler trop vite pour gagner 30 secondes, c’est risquer sa vie et celle des autres.` },
  { titre:'Les principaux risques locaux', tags:'risques locaux secteur Cruzy Quarante feu de forêt garrigue crue éclair inondation épisode méditerranéen CO2 cave vendanges cuve risque courant particulier RDMI SDACR débroussaillement',
    contenu:`## Pourquoi connaître son secteur ?
- Gagner du temps (routes, accès, points d’eau), anticiper selon la saison, avoir le bon matériel, se protéger
- Le **SDACR** (schéma départemental d’analyse et de couverture des risques) place les centres et les engins
## Risque courant ou particulier (RDMI SDIS 34)
| Risque courant | Risque particulier |
| Fréquent : feu de maison, accident, secours à personne | Rare mais très grave |
| Faible (maison isolée), ordinaire (lotissement), important (centre ancien) | Gros enjeux humains, économiques, patrimoniaux : étude spécifique |
## Les risques de Cruzy et Quarante
- **Feux de forêt et de garrigue** (été) : sécheresse, chaleur, vent, surtout l’imprudence humaine ; prévention = **débroussailler**
- **Crues éclair** (automne) : épisodes méditerranéens, le ruisseau devient torrent
- **Vignes et caves** : CO2 des vendanges, engins agricoles, produits stockés
- **Routes** : virages, engins lents, boue, animaux ; aussi mouvements de terrain, canicule
## Le piège des caves : le CO2
- La fermentation du raisin fabrique du **dioxyde de carbone**, invisible et sans odeur
- **Plus lourd que l’air** : il remplit le fond des cuves, caves et fosses ; la victime s’effondre en quelques respirations
- Réflexe : **on ne descend jamais**, on alerte le **18** ; les pompiers interviennent **sous ARI**
## Le pompier, ambassadeur de prévention
- Détecteur de fumée, plan familial, débroussaillement, jamais seul dans une cave en fermentation, ne pas traverser une route inondée
! **30 cm d’eau** suffisent à emporter une voiture : on ne traverse jamais.
! Celui qui descend aider sans protection devient la 2e victime.` },
  { titre:'Préparation physique aux épreuves du brevet', tags:'brevet JSP épreuves sportives natation 50 m course 12 minutes tractions pompes parcours sportif PSSP barème A B C 3 A 1 B préparation entraînement PRAP',
    contenu:`## Les 4 épreuves du brevet
- **Natation 50 m** : sans s’arrêter, puis sortir seul de l’eau
- **Course de 12 min** : parcourir la plus grande distance sans s’arrêter
- **Force des bras** : tractions **ou** pompes, le plus possible
- **Parcours sportif du sapeur-pompier (PSSP)** : le plus vite possible
- Chaque épreuve est notée A, B ou C ; pour valider : **au moins 3 A et 1 B**
## Barème garçons (A / B)
| Épreuve | A | B |
| Natation 50 m | ≤ 1’50 | > 1’50 |
| Course 12 min | ≥ 2 000 m | ≥ 1 600 m |
| Tractions | ≥ 5 | 2 à 4 |
| Pompes | ≥ 11 | 8 à 10 |
| Parcours SP | ≤ 2’30 | ≤ 2’50 |
## Barème filles (A / B)
| Épreuve | A | B |
| Natation 50 m | ≤ 1’50 | > 1’50 |
| Course 12 min | ≥ 2 000 m | ≥ 1 600 m |
| Tractions | ≥ 3 | 1 à 2 |
| Pompes | ≥ 7 | 5 à 6 |
| Parcours SP | ≤ 2’50 | ≤ 3’10 |
- C en natation : ne nage pas les 50 m et/ou ne sort pas seul du bassin
## Les règles
- Natation : départ plongé ou sauté, toutes les nages, **interdit de s’arrêter**, toucher le mur, sortir **sans échelle ni marche**
- Tractions : paumes vers soi (supination), bras tendus en bas, **menton au-dessus de la barre**
- Pompes : mains et pieds écartés largeur d’épaules ; parcours : **6 lancers de commande** au maximum
## S’entraîner sans se blesser
- **2 à 3 séances par semaine**, progressivité, récupération, se tester
- Repère : 2 000 m en 12 min = un tour de 400 m toutes les **2 min 24**
