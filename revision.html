<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3c6e">
<meta name="description" content="Application de révision sapeurs-pompiers : fiches, quiz, flashcards, examen blanc et recherche rapide.">
<title>Révision Pompiers 34</title>
<style>
:root{
  --navy:#1a3c6e;--navy2:#244f8f;--red:#d32f2f;--red2:#b71c1c;
  --bg:#f3f5fa;--card:#ffffff;--card2:#f8f9fc;--text:#1b2230;--muted:#5d6b82;--line:#e2e7f0;
  --ok:#2e7d32;--ko:#c62828;--okbg:#e8f5e9;--kobg:#fdecea;--mark:#ffe08a;--marktext:#1b2230;
  --shadow:0 2px 12px rgba(20,30,60,.08);--radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d121b;--card:#161d2a;--card2:#1b2433;--text:#e8edf5;--muted:#9eabc0;--line:#283347;
    --okbg:#14301a;--kobg:#3b1919;--mark:#8a6a00;--marktext:#fff;--shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d121b;--card:#161d2a;--card2:#1b2433;--text:#e8edf5;--muted:#9eabc0;--line:#283347;
  --okbg:#14301a;--kobg:#3b1919;--mark:#8a6a00;--marktext:#fff;--shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
mark{background:var(--mark);color:var(--marktext);border-radius:3px;padding:0 1px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red),#ff7043,var(--red))}
.top-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:20px;flex:none}
.brand{flex:1;min-width:0;text-decoration:none}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand small{opacity:.8;font-size:12px}
.icon-btn{background:rgba(255,255,255,.12);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:#fff;font-size:18px}
.icon-btn:hover{background:rgba(255,255,255,.22)}

main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;text-decoration:none;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Hero search */
.hero{background:linear-gradient(135deg,var(--navy),#2b5ca8 60%,#3a6fc2);color:#fff;border-radius:20px;padding:20px 18px;position:relative;overflow:hidden}
.hero::after{content:"🔥";position:absolute;right:-8px;bottom:-22px;font-size:110px;opacity:.12}
.hero h1{margin:0 0 4px;font-size:22px}
.hero p{margin:0 0 14px;opacity:.9}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#1b2230;border-radius:14px;padding:4px 6px 4px 14px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:10px 0;background:transparent;color:inherit;min-width:0}
.search .kbd{font-size:12px;border:1px solid #ccd3e0;border-radius:6px;padding:1px 6px;color:#5d6b82}
.search-page .search{background:var(--card);color:var(--text);border:1px solid var(--line)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.hero .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* Quick actions */
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.action{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none}
.action .ic{font-size:24px}
.action b{font-size:15px}
.action span{font-size:13px;color:var(--muted)}
.action:hover{border-color:var(--red)}

/* Themes grid */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.theme{display:flex;gap:12px;align-items:flex-start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--c);transition:transform .12s}
.theme:hover{transform:translateY(-2px)}
.theme .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
.theme b{display:block;line-height:1.25}
.theme small{color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--ok));border-radius:9px;transition:width .3s}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item:hover{border-color:var(--muted)}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--c,#546e7a) 15%,transparent);color:var(--c,#546e7a);white-space:nowrap}
:root[data-theme="dark"] .tag{filter:brightness(1.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{filter:brightness(1.5)}}
.star{background:none;border:0;font-size:22px;line-height:1;padding:4px;color:#f2b400}

/* Theme header */
.thead{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));margin-bottom:14px}
.thead .ti{font-size:34px}
.thead h1{margin:6px 0 2px}
.thead .bar{background:rgba(255,255,255,.25)}
.thead .bar i{background:#fff}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:10px;background:none;border:0;padding:0}

/* Fiche */
.fiche h3{font-size:16px;margin:18px 0 6px;color:var(--navy)}
:root[data-theme="dark"] .fiche h3{color:#8fb4ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fiche h3{color:#8fb4ff}}
.fiche p{margin:6px 0}
.fiche ul{margin:6px 0;padding-left:20px}
.fiche li{margin:4px 0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);font-weight:700}
tr:last-child td{border-bottom:0}
.callout{border-left:4px solid var(--navy2);background:color-mix(in srgb,var(--navy2) 10%,transparent);padding:10px 12px;border-radius:10px;margin:10px 0}
.callout.warn{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.callout.warn::before{content:"⚠️ "}
.callout:not(.warn)::before{content:"💡 "}

/* Quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .bar{flex:1;margin:0;height:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.timer.low{color:#fff;background:var(--red);border-color:var(--red)}
.question{font-size:19px;font-weight:700;margin:6px 0 16px;line-height:1.35}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:54px;transition:border-color .12s,background .12s}
.choice:hover:not([disabled]){border-color:var(--navy2)}
.choice .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--card2);border:1px solid var(--line);flex:none}
.choice.sel{border-color:var(--navy2);background:color-mix(in srgb,var(--navy2) 10%,var(--card))}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.ko{border-color:var(--ko);background:var(--kobg)}
.choice.ko .k{background:var(--ko);color:#fff;border-color:var(--ko)}
.choice[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px}
.feedback.ok{background:var(--okbg);border:1px solid var(--ok)}
.feedback.ko{background:var(--kobg);border:1px solid var(--ko)}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700}
.dots button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.dots button.cur{outline:2px solid var(--red);outline-offset:1px}

/* Results */
.ring{--p:0;--c:var(--ok);width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:0 auto}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;line-height:1}
.ring small{color:var(--muted);font-size:12px}
.review{border-left:4px solid var(--ko);background:var(--card);border-radius:12px;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.review.good{border-left-color:var(--ok)}
.review p{margin:4px 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:13px;color:var(--muted)}

/* Flashcards */
.flash{perspective:1200px;margin:10px 0}
.flash-in{display:grid;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 20px;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg)}
.face .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.face .big{font-size:20px;font-weight:700;line-height:1.35}
.face .ans{font-size:19px;font-weight:700;color:var(--ok);margin-bottom:8px}

/* Search results */
.answer{border:2px solid var(--red);border-radius:18px;background:var(--card);padding:16px;box-shadow:var(--shadow)}
.answer .lbl{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.answer .rep{font-size:18px;font-weight:700;margin:6px 0}
.res{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.res:hover{border-color:var(--muted)}
.res .meta{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.res p{margin:2px 0;color:var(--muted);font-size:14px}
.res b{display:block}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:42px}

/* Segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600}
.seg button.on{background:var(--navy);color:#fff}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;font-size:11px;font-weight:600;color:var(--muted)}
.nav a span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
.nav a.on{color:var(--red)}
.nav a.on span{filter:none;opacity:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b2230;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.foot{margin:28px 0 8px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:520px){
  .question{font-size:17px}
  .themes{grid-template-columns:1fr 1fr}
  .theme{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo" aria-hidden="true">🚒</div>
    <a class="brand" href="#/"><b>Révision Pompiers 34</b><small>Fiches · Quiz · Examens · Recherche</small></a>
    <button class="icon-btn" id="btnSearch" title="Rechercher (/)" aria-label="Rechercher">🔍</button>
  </div>
</header>
<main id="app"></main>
<nav class="nav" aria-label="Navigation principale">
  <div class="nav-in">
    <a href="#/" data-r="home"><span>🏠</span>Accueil</a>

  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================================
   CONTENU — doctrine nationale, adaptée au contexte de l'Hérault.
   Format des fiches : mini-markdown (## titre, - liste, | tableau |,
   > astuce, ! attention, **gras**).
   ========================================================================= */
function Q(q, choix, r, ex){ return { q, choix, r, ex }; }

const BASE = [
/* ---------------- Référentiels départementaux SDIS 34 ---------------- */
{ id:'rdeb', nom:'RDEB · Engagement des binômes', icone:'🫁', couleur:'#c62828', source:'SDIS 34 · RDEB v2 (avril 2026)',
  fiches:[
  { titre:"L'ARI-CO : nomenclature", tags:'ari ari-co bouteille 6 l 7,2 l type ii iv 300 bar avertisseur 55 manomètre indicateur pression détendeur sad soupape demande bipasse masque griffe filet raccord y cagoule évacuation 18 kg',
    contenu:`L'appareil respiratoire isolant à circuit ouvert (**ARI-CO**) est un EPI de **catégorie III**, vérifié chaque année par le GTL.
## Bouteilles (air comprimé, ogive noire et blanche)
| Type | Volume | Pression de service | Air disponible |
| Type II (métallique renforcée) | 6 L | 300 bar | 1 800 L |
| Type IV (composite, liner plastique) | 7,2 L | 300 bar | 2 160 L |
## Organes
- **Détendeur** : abaisse la pression de 300 à **7 bar ou moins**
- **Indicateur de pression** : gradué de 0 à 350 bar ; zone blanche de travail **55 à 300 bar**, zone rouge de sécurité **0 à 55 bar**
- **Avertisseur** pneumatique : déclenché à **55 bar**, 90 dB, au moins 10 s, consomme **5 l/min**
- **SAD** (soupape à la demande) avec **bipasse** (plus de 60 l/min)
- **Raccord moyenne pression Y** (flexible ≈ 1 m) et **cagoule d'évacuation** (55 l/min)
- **Masque** à griffes (fixé au casque) ou à filet, double jupe avec demi-masque intérieur
## À retenir
- Poids de l'ARI-CO : **18 kg maximum**
- Côté droit : engagement et progression ; côté gauche : sécurité et sauvetage
- Sur la bouteille : un **outil de force et déblai** pour le chef d'équipe, une **commande** pour l'équipier
- L'ARI-CO du conducteur sert de protection au conducteur, de réserve en cas de panne et de lot d'assistance en air
> Lors d'un remplacement de bouteille, la nouvelle doit afficher **270 bar ou plus**.` },
  { titre:"Contraintes du port de l'ARI", tags:'contraintes physiques physiologiques psychologiques espace mort co2 fréquence cardiaque stress consommation',
    contenu:`## Physiques
- Centre de gravité modifié, effort musculaire accru, passages étroits plus difficiles
## Physiologiques
- **Espace mort** augmenté par le masque : une partie du CO2 expiré est réinspirée
- Résistances respiratoires accrues : l'expiration demande un effort
- **Fréquence cardiaque** en hausse (effort, stress, chaleur) : déshydratation, hypoglycémie, épuisement plus rapide
## Psychologiques
- Inconfort du masque ; un porteur qui perd son calme **respire plus vite et consomme plus d'air**
## Liées à l'équipement et à l'air
- Perception, audition et communication réduites
- Durée d'intervention limitée par la **consommation** du porteur et la **capacité** de la bouteille
> L'entraînement régulier sous ARI retarde les effets de l'effort.` },
  { titre:'Habillage et contrôle croisé (RAPACE)', tags:'rapace contrôle croisé capeler coiffer encliqueter habillage binôme porteur sous ari robinet armement pression ajustement code étanchéité',
    contenu:`## Vocabulaire
- **Capeler** : porter l'ARI-CO
- **Coiffer** : placer le masque sur le visage
- **Encliqueter** : connecter la SAD au masque
- **Binôme porteur** d'ARI : masque en attente ; **binôme sous ARI** : masque coiffé et encliqueté
## Règles
- Sur engin-pompe urbain, **les deux binômes capellent** pendant le transit (sauf ordre contraire du chef d'agrès)
- Bijoux, piercings et montres sont interdits
- En attente, la SAD reste **encliquetée** sur le masque
- Le masque se coiffe **à l'air frais**, avant d'entrer en atmosphère viciée
- Binôme = un **chef d'équipe** + un **équipier**, **indissociable** en zone d'exclusion
## Contrôle croisé : RAPACE
| Lettre | Contrôle |
| R · Robinet | Bouteille ouverte jusqu'à la butée |
| A · Armement | Balise (BSD) ou indicateur (ICS) activé |
| P · Pression | Engagement initial à **270 bar ou plus** |
| A · Ajustement | EPI correctement portés |
| C · Code | Code de communication adapté |
| E · Étanchéité | Aucune fuite au masque ni à la SAD |
! Une anomalie au contrôle croisé interdit l'engagement.` },
  { titre:"Autonomie d'engagement et débits", tags:'autonomie débit consommation calcul abaque 10 50 105 135 l/min réserve 50 bar temps aller mission retour 30 min 36 min 14 min 17 min',
    contenu:`Un engagement comprend trois temps : **aller**, **mission**, **retour**.
| Situation | Débit | Autonomie à 300 bar (6 L / 7,2 L) |
| Survie, attente des secours | ≈ 10 l/min | 3 h / 3 h 36 |
| Engagement à vue | ≈ 50 l/min | 30 min / 36 min |
| Engagement avec ligne de vie (15 min max) | ≈ 105 l/min | 14 min / 17 min |
| Sauvetage (moins de 5 min) | ≈ 135 l/min | 11 min / 13 min |
## Calcul
- Autonomie = (pression d'engagement − **50 bar** de réserve) × volume ÷ consommation
- Exemple : 250 bar × 7,2 L ÷ 105 l/min ≈ **17 min**
- Les abaques du référentiel donnent l'heure de sortie prévisible au contrôleur
! Dès que l'avertisseur se déclenche, la sortie du binôme est immédiate : on n'attend pas d'arriver dans la réserve.` },
  { titre:'Enregistrement, contrôleur et binôme de sécurité', tags:'enregistrement contrôleur tgp tableau gestion personnels binôme sécurité attente engagement point engagement',
    contenu:`## Enregistrement
- Avant chaque engagement, en **zone contrôlée**, auprès du contrôleur (à défaut par le binôme, après avoir prévenu le chef d'agrès)
- Contenu : identité des porteurs, **pression d'engagement**, **heure d'entrée**, **heure de sortie prévisible**, **mission**
- Support privilégié : le **TGP** (tableau de gestion des personnels)
## Le contrôleur
- Régule **un seul point d'engagement**
- Supervise au maximum **5 binômes** : 4 engagés + 1 binôme de sécurité
- Gilet haute visibilité, radio sur la tactique de niveau 5
- En cas d'urgence : il engage le binôme de sécurité et rend compte
## Le binôme de sécurité
- Mis en place par le COS **dès que possible**, en zone contrôlée, sous l'autorité du contrôleur
- Même niveau de protection que les binômes engagés, moyen hydraulique à disposition
- **En attente** : bouteille ouverte, balise activée, masque en attente, contact visuel ou radio, maintient l'itinéraire de repli, surveille les balises, contrôle l'ouvrant d'engagement
- **Engagé** : assiste le binôme en difficulté, aide au dégagement, rend compte
- Dès qu'il est engagé, un **nouveau binôme de sécurité** est désigné
- Matériel possible : ligne de vie, caméra thermique, système de traction, outil de force, pince coupante, éclairage, assistance en air, échelle télescopique
> Un sauvetage peut justifier l'envoi immédiat d'un binôme sans contrôleur ni binôme de sécurité.` },
  { titre:'Zonage, façades et lecture du feu', tags:'zone exclusion contrôlée soutien zonage façade a b c d aiguilles montre r+5 chef secteur observation fumées chaudes opaques mobiles inflammables toxiques',

  { titre:'Ligne de vie, ligne guide et liaison personnelle', tags:'ligne vie ligne guide liaison personnelle nodule établissement ldv 40 776 m² 388 m² 60 m exploration linéaire latérale circulaire amarrage retournement croisement cat collier',
    contenu:`La **ligne de vie** assure un lien physique continu avec le point d'engagement, **par l'établissement** ou **par ligne guide** (pas les deux en même temps).
## Par l'établissement
- Établissement d'attaque Ø 45 sous pression (**LDV 40**) + liaison personnelle ou maintien physique
- Foyer à moins de **60 m** ; reconnaissance jusqu'à **776 m²** (60 m + exploration bilatérale)
## Par ligne guide
- Reconnaissance jusqu'à **388 m²** (60 m + exploration unilatérale), ou sauvetage sans moyen hydraulique
- Un moyen hydraulique reste à disposition (à sec ou en attente)
- Chaque engin-pompe urbain a **2 lignes guides** ; prolongements et dérivations : équipes **IBNB-ELD**
## Caractéristiques
| Élément | Valeurs |
| Ligne guide | 60 m, aramide, Ø 6 mm, résiste à 600 kg et 500 °C |
| Nodules (tous les 2,5 m) | **3 nodules = vers le sinistre** (IN-CEN-DIE), **1 nodule = vers la sortie** (VIE) |
| Liaison personnelle | 6 m : partie courte 1,25 m, partie longue 4,75 m |
## Rôles et techniques
- **Chef d'équipe** : garant de la sécurité collective (lance ou ligne guide, choix des amarrages)
- **Équipier** : caméra thermique
- Amarrages : initial, intermédiaires, final ; technique : **un tour mort et deux demi-nœuds**
- Retournement : le chef d'équipe finit derrière son équipier (serre-file)
- Explorations : **linéaire**, **latérale**, **circulaire** (jusqu'à 56 m² avec les 6 m de liaison)` },
  { titre:'Recherche de victimes, AIDES et marquage', tags:'aides accéder isoler désenfumer explorer sauver recherche primaire secondaire marquage r reconnu main gauche main droite eas espace attente sécurisé',
    contenu:`## Technique AIDES

- À l'abri des fumées, des flammes et du rayonnement ; au moins 2 par niveau` },

  { titre:"Après l'engagement : réengagement et décontamination", tags:'réengagement récupération bilan suie malaise 140 25 hydratation 1,5 l décontamination souillure je sais je sens je vois p3 douche decopi exposition',

  { titre:'Sauvetage, mise en sécurité, sauvegarde', tags:'sauvetage mise sécurité confinement évacuation sauvegarde opérationnelle auto-sauvetage règle minimums source flux cible ibnb eld',
    contenu:`## Sauvetage
- Extraire une personne soumise à un **danger vital et imminent** qui ne peut pas s'y soustraire seule
- Il peut justifier une plus grande exposition des sauveteurs : le COS décide selon la **balance bénéfice/risque**
- **À vue** : victime visible de l'extérieur (échelles, MEA, lots de sauvetage)
- **En exploration** : accès par l'intérieur, avec moyen hydraulique et ligne de vie
## Mise en sécurité
- Éloigner du danger des personnes **non menacées immédiatement**
- **Confinement** : laisser les personnes à l'abri, là où elles sont
- **Évacuation** : les déplacer en les accompagnant
## Sauvegarde opérationnelle
- Auto-sauvetage + sauvetage de sauveteur
## Actions du COS
- Sur la **source** (coupure gaz, attaque), sur le **flux** (désenfumage, ventilation), sur la **cible** (sauvetage, évacuation, confinement)
## Règle des minimums
- Minimum de **personnels** exposés, minimum de **temps** (air disponible), minimum de **risque** (identifié avant l'engagement)
> La spécialité **IBNB-ELD** appuie les primo-intervenants : ligne guide jusqu'à 420 m, cheminements complexes, parkings, tunnels.` },
  { titre:'Échelles et moyens élévateurs aériens (MEA)', tags:'mea eps epc échelle coulisse crochets panier polygone sustentation stabilisateur sol stable instable interdit détecteur tension passage vide',
    contenu:`## Évacuation par MEA
- **Isolée** : victime dans le panier, déposée sur la voie publique
- **Multiple** : personnes valides par la structure extensible
- **Par transfert** : panier vers un niveau inférieur ou un endroit sûr proche
## MEA du SDIS 34
- **EPS** (mouvements séquentiels) et **EPC** (mouvements combinés), de 18, 24 ou 30 m
- **Polygone de sustentation** : formé par les appuis des 4 stabilisateurs ; la résultante des forces doit rester à l'intérieur

  { titre:'Itinéraires de repli, de secours et évacuation générale', tags:'itinéraire repli secours évacuation générale étage échelle coulisse 2 plans 3 plans mea 18 24 30 point regroupement',

  { titre:'Message et appel de détresse (NELAR)', tags:'détresse urgent nelar nom engin localisation air renfort appel détresse mode direct sos dir 3 secondes 20 secondes tph 900 ber dir 1 bail-out évacuation urgence tuyau',
    contenu:`## Message de détresse

  { titre:'Sauvetage de sauveteur', tags:'sauvetage sauveteur intervenant difficulté renfort secours abordage packaging poignée sauvetage sim traction escalier déshabillage 270 bar exclusive',
    contenu:`## Principes

  { titre:'Composition du LSPCC', tags:'lspcc composition sac corde harnais triangle sangle connecteur descendeur poulie antichute cordelette protection lot engin échelle bleu jaune 30 m 60 m',
    contenu:`Le LSPCC est un EPI de **catégorie III**, vérifié **chaque année** par le GTL.

| Triangle d'évacuation | Charge max **150 kg**, 1 500 kg, 3 attaches sternales, 1 dorsale |
| Anneaux de sangle | **Bleue 80 cm**, **rouge 1,5 m**, 2 000 kg |
| Connecteurs | À vis (liaisons) ou automatique (charge) ; grand axe 2 000 kg, petit axe 750 kg |

| Poulie | Mouflage ou déviation, 2 000 kg |
| Antichute mobile | Progression verticale sur échelle, charge max 140 kg |

| Protection | Cuir, 45 cm, contre les frottements |
- Un connecteur travaille sur son **grand axe**, verrouillage fermé
- Lot EPI MEA : longe de maintien (1 m), longe antichute (1,75 m), harnais
## Rangement du sac

  { titre:'Principes : système, ancrage et amarrage', tags:'ancrage amarrage point fixe humain naturel structurel artificiel véhicule échelle commande connecteur automatique tête alouette 90° principal intermédiaire smpm garant',
    contenu:`Un système = **point d'ancrage** → **amarrage** → **frein de charge** (descendeur) → **tirant** → **charge**.
- La **commande** est emportée systématiquement (détection, tester une hauteur, écarter une victime)
- Sac placé du côté du **garant** ; surveiller le système en permanence
! Le connecteur **automatique** est toujours placé entre la corde et la charge.
## Les ancrages
- **Naturel** (arbre, rocher), **structurel** (colonne sèche, rambarde, balcon, poutre), **artificiel** (véhicule, échelle)
- En cas de doute, en choisir un autre ; à défaut, demander une équipe **SMPM**
- **Point fixe humain** : sauveteur allongé, jambes à 90° contre le mur ; au moins **20 cm** entre l'axe du descendeur et l'appui de la corde
- **Véhicule** : moteur arrêté, frein serré, calé sur les roues arrière ; amarrage sur manille, jante froide ou essieu arrière (**jamais l'enjoliveur**)
- **Échelle** à coulisse 2 plans, ou à crochets 2 plans reployée (sauvetage uniquement) : sangles autour des 4 montants
## Les amarrages
- Minimum : **une sangle + un connecteur à vis**
- **Têtes d'alouette interdites**
- Sangle en double ≈ 4 000 kg
- Angle entre deux sangles : **90° maximum**
- **Principal** : sangle(s) + connecteur(s) + descendeur
- **Intermédiaire** : sangle(s) + connecteur ou poulie (déviation, prolongement, mouflage)
- Plusieurs amarrages intermédiaires en descente ou remontée : équipe spécialisée` },
  { titre:'Chute : facteur de chute, tirant d\'air, syndrome du harnais', tags:'facteur chute 0,3 1 2 tirant air marge 1 m effet pendulaire syndrome harnais suspension 600 kg epi tsi casque gants',
    contenu:`## Facteur de chute
Facteur = **hauteur de chute ÷ longueur de corde** qui amortit la chute.

| 2 | Au-dessus de l'amarrage | Interdit (tout facteur supérieur à 1) |
- Seuil de lésions (normes européennes) : **600 kg**
## Tirant d'air

## Effet pendulaire

## EPI

  { titre:'Techniques générales du LSPCC', tags:'abordage victime péril sauvetage extérieur excavation reconnaissance appartement évolution risque chute toiture triangle passage vide régulateur garant',
    contenu:`| Technique | Dispositif |

  { titre:'Nœuds, clé d\'arrêt et entretien', tags:'nœud noeud 8 double français clé arrêt répartiteur sangle rouge harnais entretien lavage réforme durée vie 10 ans cahier suivi kimoce',
    contenu:`## Nœuds et dispositifs

- Durée de vie des textiles : **10 ans maximum**
- Remplir le **cahier de suivi** après chaque utilisation (formation comprise) ; signaler toute chute ou doute (KIMOCE)` }

  { titre:'DECI : poteaux, bouches et besoins en eau', tags:'deci pei poteau bouche incendie couleur rouge bleu jaune vert noir aspiration surpressé borne puisage pi 80 100 150 débit tours risque courant faible ordinaire important particulier 450 m3 signalisation plaque réseau maillé étoilé',
    contenu:`## Couleurs
| Appareil | Couleur |
| Poteau sous pression, poteau relais | Rouge |
| Poteau d'eau brute (non potable) | Rouge avec cerclage vert de 20 cm |
| Poteau ou bouche d'aspiration | Bleu |
| Poteau ou bouche surpressé / prémélange (statique > 8 bar) | Jaune |
| Borne de puisage (hors DECI, **interdite** aux SP) | Vert |
| Bouche sous pression | Rouge ou noire |
## Poteaux et bouches sous pression
| Conduite | Prises | Débit | Ouverture |
| PI Ø80 | 1 × 65 (+ 2 × 40) | 30 m³/h · 500 l/min | 13 tours |
| PI Ø100 | 1 × 100 + 2 × 65 | 60 m³/h · 1 000 l/min | 13 tours |
| PI Ø150 | 1 × 65 + 2 × 100 | 120 m³/h · 2 000 l/min | 17 tours |
| BI Ø100 | Douille de 100 | 60 m³/h · 1 000 l/min | 17 tours |
- Pression dynamique : **1 bar minimum**, 16 bar maximum ; ouverture dans le sens **inverse** des aiguilles d'une montre
- Coffre : partie grise = PI 100, partie jaune = PI 150
- PEI **surpressé** : précautions pour ne pas abîmer les garnitures de la pompe
## Besoins en eau
| Risque | Quantité minimale |
| Courant faible (habitation isolée) | 30 m³ en 1 h |
| Courant ordinaire (lotissement, collectif) | 60 m³ (60 m³/h 1 h ou 30 m³/h 2 h) |
| Courant important (quartier dense, historique) | 120 m³ en 2 h |
| Particulier (ERP, industrie, patrimoine) | Étude spécifique |
- Limite opérationnelle du SDIS 34 : **450 m³/h** simultanés, soit 900 m³ en 2 h
- Réseau **maillé** (eau dans tous les sens) ou **étoilé** (un seul sens, un incident condamne un secteur)
## Signalisation
- Plaque rouge à flèche blanche : en haut le **type** de PEI, dans le rond le diamètre, le volume ou le débit, en bas la **distance** (linéaire au-dessus du trait, latérale à côté)
- Cartographie : PI, PR (relais), BI, PA (aspiration), BA (borne agricole), CI-RI (citerne, réserve)` },
  { titre:'Hydraulique : pressions et pertes de charge', tags:'hydraulique pression statique dynamique perte charge tuyau 25 45 70 110 débit bar dénivelé pièce jonction ldv lance canon injecteur 6 bar 10 bar 500 l/min taux extinction',
    contenu:`## Pressions
- **Statique** : lances fermées ; **dynamique** : eau en mouvement
- Le **conducteur** est le conseiller technique hydraulique du chef d'agrès : il doit connaître le débit aux lances, la longueur, le dénivelé ou la colonne sèche, et le nombre de pièces de jonction
## Pertes de charge
- Proportionnelles à la **longueur** et au **carré du débit**
- Plus le **diamètre** est grand, plus elles sont faibles
- Indépendantes de la pression : seul le débit compte
- **± 1 bar par 10 m** de dénivelé ; **+ 1 bar par pièce** de jonction
| Tuyau de 20 m | Débit | Perte |
| Ø25 | 150 l/min | 2,2 bar |
| Ø45 | 250 l/min / 500 l/min | 0,3 bar / 1,2 bar |
| Ø70 | 500 / 1 000 / 2 000 l/min | 0,1 / 0,4 / 1,8 bar |
| Ø110 | 1 000 / 2 000 l/min | 0,1 / 0,2 bar |
## Pressions de fonctionnement
- **6 bar** : LDV, lance rideau mobile, lance canon
- **10 bar** : injecteur proportionneur
## Règles du SDIS 34
- Débit de référence pour un binôme sur feu de structure : **500 l/min**
- Au maximum **3 tuyaux Ø45/20 m** après la prise d'eau
- Plusieurs lances : calculer pour la **plus défavorisée** ; lance sur MEA : ne pas dépasser sa pression de référence
> Exemple : LDV 40 à 500 l/min, 3 tuyaux Ø45 et une division, à plat : 6 + 3 × 1,2 + 1 ≈ 10,6 bar à la pompe.
## Taux d'extinction réflexe
| Surface | Risque classique | Risque important |
| Moins de 300 m² | 1 L/min/m² | 2 L/min/m² |
| 300 m² et plus | 2,4 L/min/m² | 3 L/min/m² |
- Défense linéaire : 500 L/min pour 15 m` },
  { titre:"Familles d'habitation et parkings", tags:'famille habitation 1re 2e 3e a b 4e immeuble moyenne hauteur colonne sèche escalier encloisonné 28 m 50 m r+9 r+17 parc stationnement',
    contenu:`| Famille | Caractéristiques |

  { titre:'Binômes, conducteur et additifs', tags:'binôme organique circonstance 1er 2e conducteur missions additif eau dopée moussante mousse m51 pictogramme concentration 0,1 1 % autonomie',
    contenu:`## Le binôme
- Un **chef d'équipe** + un **équipier** ; **organique** (armement de l'engin) ou **de circonstance** (personnels d'autres engins)
- **1er binôme** : en général l'attaque ; **2e binôme** : la prise d'eau et/ou l'alimentation
- Il exécute les ordres, rend compte, contrôle les EPI de l'autre, reste dans l'engin sans mission, entre **toujours en binôme** en zone d'exclusion
## Le conducteur
- Cale l'engin en pente, sécurise la zone, met en place un parc matériel
- Alimente une prise d'eau à moins de **60 m**, alimente l'engin seul ou aidé
- Reste attentif à la radio (demande d'ouverture de l'eau), assure le reconditionnement
## Les additifs
- **Eau dopée** : 0,1 à 0,4 % (mouillant, pénètre mieux)
- **Moussante** : 0,5 à 1 % (isole aussi les vapeurs)
- **À mousse** : 1 % avec adaptateur (petits feux d'hydrocarbures)
| Pictogramme | Taux | Utilisation |
| 1 | 0,1 % | Cartons |
| 2 | 0,2 % | Bois |
| 3 | 0,3 % | Pneus, solides liquéfiables |
| 4 | 0,4 % | Habitation, industrie |
| 5 | 0,5 % | Véhicules |
| 6 | 1 % | Petites flaques d'hydrocarbure |
- Le M51+ monte à 3 %, mais la référence départementale est **1 % maximum**
- À 1 % et 500 l/min : environ 16 min (lot INC CCFU, 80 L), 32 min (FPTL, 160 L), 40 min (FPT/FPTGP, 200 L)` },
  { titre:'Conduite des opérations : départ, transit, reconnaissance', tags:'avant départ transit statut ber 01 02 opensis radio n5 n3/4 gte gto 613 634 653 674 reconnaissance réactions immédiates message ambiance crid vrob chef agrès',
    contenu:`## Avant le départ
- Exploiter la feuille de départ : nature, moyens engagés, victimes, risques, requérant, adresse précise
- Cartographie : plan, itinéraire, **PEI** (papier ou opensis)
- Matériel complémentaire : caméra thermique, détecteur multigaz, plan ETARE…
- EPI pour tous, **gilet haute visibilité** pour le conducteur
- Radios : tactique **N5** (603, 624, 643, 664) pour CA, conducteur et chefs d'équipe ; tactique **N3/4** (GTE 613-634, GTO 653-674) ; chef d'agrès : N5 à gauche, N3/4 à droite
- Statut **01** (départ) sur le BER
## Pendant le transit
- Informer le conducteur (itinéraire) et le personnel (ordre de mission)
- **1er et 2e binômes capellent** l'ARI-CO
- Le binôme d'alimentation repère **deux PEI** proches du sinistre
- Statut **02** à l'arrivée sur les lieux
## La reconnaissance
- Sauvetages et mises en sécurité ; plan d'intervention s'il existe
- Configuration du bâtiment, emplacement, surface et nature du feu, risques de propagation
- **Couper les énergies, barrer les fluides**, ramener l'ascenseur au RDC
- Choisir le moyen d'extinction ; appui possible de la CRID ou du VROB
## Réactions immédiates
- Du domaine de l'**action** (sauvetages), du **renseignement** et de l'**information** (message d'ambiance)
- Face à un péril imminent, chacun fait les actions conservatoires nécessaires et rend compte` },
  { titre:'Raisonnement tactique et ordres (SMES)', tags:'smes situation mission exécution sécurité raisonnement tactique ordre initial conduite préparatoire exécution établissez à vos rangs analyse systémique source flux cible balance bénéfice risque',
    contenu:`## SMES : ordre initial et ordre de conduite
| Lettre | Question | Contenu |
| S · Situation | Quoi ? Où, par où ? | Description de la situation |
| M · Mission | Quoi faire ? | Objectifs à atteindre |
| E · Exécution | Comment, avec qui ? | Les ordres |
| S · Sécurité | Quelles règles ? | Protections individuelles et collectives |
- Compléments : **analyse systémique** (source, flux, cible) et **balance bénéfice/risque** (la prise de risque en vaut-elle la peine ?)
## Ordre préparatoire
- Sans matériel : « **1er binôme, en reconnaissance !** » (EPI seuls)
- Avec matériel : « 1er binôme, pour l'établissement d'une LDV 40, en reconnaissance ! »
- « **À vos rangs !** » : binômes et conducteur se placent **à l'arrière de l'engin**
## Ordre d'exécution
- C'est le **E** du SMES ; il indique au minimum le **point d'attaque** et la **prise d'eau**
- Il se termine par « **Établissez !** » ; les restrictions (à sec, engagement sur ordre) sont données avant
> Exemple : « Feu d'appartement au R+5. 1er binôme : extinction, ligne d'attaque, point d'attaque ici. 2e binôme : prise d'eau. Contrôle croisé avant l'engagement. Établissez ! »` },
  { titre:'Groupe incendie et placement des engins', tags:'groupe incendie 19 fptl fptgp mea vsav vlcg rang appel engin attaque appui renforcement placement 4 ldv 40 2 ldv 65',
    contenu:`## Le groupe incendie
- Capacité : **4 LDV 40** ou **2 LDV 65**, et prise en charge des premières victimes
- **19 sapeurs-pompiers** : 4 binômes organiques + 1 binôme de circonstance
| Rang d'appel | Engin |
| 1er | FPT(L) |
| 2e | MEA |
| 3e | FPT(L) |
| 4e | VSAV |
| 5e | VLCG |
- Même CIS : en général **FPTL** (engin d'attaque, ≈ 2 000 L d'eau, moins volumineux) puis **MEA** puis **FPTGP** (engin d'appui)
## L'engin d'attaque (1er engin-pompe)
- **Dépasse l'adresse** pour laisser l'accès aux autres moyens
- Se place à l'abri : chutes de matériaux, rayonnement, explosion, fumées
- Reconnaissance, réactions immédiates, attaque ; s'alimente sur un PEI si possible
## Le MEA
- Contacte le premier COS ; se place sur la façade des sauvetages, de préférence **aux angles**
- Peut servir d'itinéraire de secours ; laisse la place à un 2e MEA
## L'engin d'appui (2e engin-pompe)
- Complète l'engin d'attaque (personnel, matériel, eau)
- Alimente l'engin d'attaque **avec le matériel de celui-ci** pour ne pas se désarmer
- S'alimente sur un PEI pour un relais ou un établissement de manœuvre ; ne gêne pas les MEA
## L'engin de renforcement
- Prend contact avec le premier COS` },
  { titre:'Tuyaux et établissements : généralités', tags:'tuyau alimentation manœuvre attaque conditionnement écheveau z o dévidoir mobile couronne caisse appellation lance à disposition en cours à sec en attente en manœuvre vertical rampant étages commande',
    contenu:`## Trois types d'établissement
- **Alimentation** : alimente la pompe (Ø110, Ø70)
- **Manœuvre** : alimente une prise d'eau (Ø110/40, Ø70)
- **Attaque** : alimente une lance (Ø70, Ø45, Ø25)
## Conditionnement
| Tuyau | Conditionnement |
| Ø25/20 m | Dévidoir tournant |
| Ø45/20 m | Dévidoir de 45, écheveau Z ou O |
| Ø70/20 m | Écheveau Z |
| Ø70/40 m | Dévidoir mobile |
| Ø110/20 m | Couronne double |
| Ø110/40 m | Écheveau Z |
- Dispositifs de maintien : **rouges** pour le Ø45, **noirs** pour le Ø70
- **Écheveau O** : Ø45/20 m avec LDV 40 pré-raccordée ; réserve de 20 m au point d'attaque, effet ressort
- **Caisse** : 2 tuyaux Ø70/20 m, **40 kg max**, permet au conducteur d'établir jusqu'à **40 m**
## Estimer le nombre de tuyaux
- Établissement **vertical** : 1 tuyau ≈ **4 étages**
- Établissement **rampant** (dans l'escalier) : 1 tuyau ≈ **2 étages**
## Appellation d'une lance
| Appellation | État |
| À disposition | Tuyaux près de la prise d'eau et des intervenants |
| En cours d'établissement | Ordonné mais pas terminé |
| À sec | Établie et raccordée, mais pas en eau |
| En attente | En eau, prête à fonctionner |
| En manœuvre | En fonctionnement |
## Sécurité
- Ne pas établir dans l'**axe de l'ouvrant**, attention aux aplombs
- Avoir un moyen hydraulique **avant** d'entrer en zone d'exclusion
- Sur la voie publique : baliser, établir au bord des voies, protéger les traversées de chaussée` },
  { titre:"Tableau d'aide aux établissements", tags:'tableau aide établissements colonne sèche en charge ligne attaque ldt ldv 40 ldv 65 commande échelle coulisse r+1 r+2 r+4 r+6 r+8 r+12 r+17 dévidoir 110 alimentation 20 m 60 m 200 m',
    contenu:`| Établissement | Jusqu'au |

| Ligne d'attaque rampante avec 1 LDV 40 | R+12 |

## Alimentation de l'engin-pompe
- PEI à moins de 20 m : un **tuyau Ø110/20 m** ; division **Ø100/2×65** pour profiter de toute la capacité du poteau

- Tuyaux Ø70 de l'engin : jusqu'à **200 m** ; au-delà, 2 dévidoirs mobiles
## Sur MEA
- Une lance sur structure extensible a **3 amarrages** ; chaque MEA a **6 ligatures** (2 LDV 40)` }

{ id:'org', nom:'Organisation & culture SP', icone:'🏛️', couleur:'#3949ab',
  fiches:[
  { titre:'Le SDIS : missions et organisation', tags:'sdis casdis ddsis sdacr ro cta codis cis hérault 34 missions',
    contenu:`## Statut
Le **SDIS** (service départemental d'incendie et de secours) est un établissement public départemental. Dans l'Hérault : le **SDIS 34**.
## Missions (art. L1424-2 du CGCT)
- Prévention, protection et lutte contre les **incendies**
- Prévention et évaluation des **risques de sécurité civile**
- Préparation des mesures de sauvegarde et organisation des moyens de secours
- Protection des personnes, des biens et de l'**environnement**
- **Secours d'urgence** aux personnes victimes d'accidents, de sinistres ou de catastrophes, et leur évacuation
## Gouvernance
- **CASDIS** : conseil d'administration, présidé par le président du conseil départemental (ou un élu qu'il désigne)
- **DDSIS** : directeur départemental, sous l'autorité du **préfet** pour l'opérationnel et du président du CASDIS pour la gestion
## Documents clés
- **SDACR** : schéma départemental d'analyse et de couverture des risques, arrêté par le préfet
- **RO** : règlement opérationnel, il décline le SDACR (règles d'engagement, effectifs…)
## Structures
- **CTA-CODIS** : traite les appels d'urgence et coordonne les opérations
- **CIS** : centre d'incendie et de secours, d'où partent les engins
> Les règles locales (RO, ordres et notes de service du SDIS 34) priment toujours sur les généralités.` },
  { titre:'DOS et COS', tags:'directeur commandant opérations secours maire préfet orsec police',
    contenu:`## DOS : directeur des opérations de secours
- C'est une **autorité de police administrative** : le **maire** sur sa commune
- Le **préfet** lorsque l'événement dépasse la commune, à la demande du maire ou en cas de déclenchement du plan **ORSEC**
## COS : commandant des opérations de secours
- Sapeur-pompier qui commande les moyens engagés sur le terrain, sous l'autorité du DOS
- Au départ, le premier chef d'agrès arrivé ; un chef de niveau supérieur reprend le commandement lors de la montée en puissance
> Le DOS décide (quoi faire), le COS commande les secours (comment le faire).` },
  { titre:'La chaîne de commandement', tags:'chef agrès groupe colonne site hiérarchie commandement',
    contenu:`| Niveau | Commande |
| Chef d'agrès | Un engin et son équipage |

- Le commandement suit la montée en puissance : chaque niveau supérieur prend le COS à son arrivée
- Principe : **un seul chef** par niveau, des ordres clairs et des comptes rendus réguliers` },

  { titre:"Les sapeurs-pompiers et les risques de l'Hérault", tags:'spv spp jsp bspp bmpm uiisc militaires volontaires professionnels hérault risques inondation cévenol',
    contenu:`## Qui sont les sapeurs-pompiers ?
- **SPV** : sapeurs-pompiers volontaires, la grande majorité des effectifs
- **SPP** : sapeurs-pompiers professionnels
- **Militaires** : Brigade de sapeurs-pompiers de Paris (**BSPP**, armée de Terre), Bataillon de marins-pompiers de Marseille (**BMPM**, Marine nationale), unités d'instruction et d'intervention de la sécurité civile (**UIISC**)
- **JSP** : jeunes sapeurs-pompiers, formés en section et validés par le **brevet national de JSP**
## Risques marquants de l'Hérault
- **Feux de forêts** : garrigue, massifs boisés, vents forts (tramontane, mistral)
- **Inondations** lors des **épisodes méditerranéens** (dits « cévenols »), surtout en automne
- Risques **littoraux** : baignade, submersion marine
- Grands axes routiers et ferroviaires (A9, A75…)` }

{ id:'inc', nom:'Incendie : le feu', icone:'🔥', couleur:'#e53935',
  fiches:[
  { titre:'Triangle du feu et extinction', tags:'triangle tétraèdre combustible comburant énergie activation oxygène réaction chaîne extinction refroidissement étouffement inhibition',
    contenu:`## Le triangle du feu
Pour qu'un feu naisse, il faut réunir trois éléments :
- **Combustible** : ce qui brûle (bois, papier, essence, gaz…)
- **Comburant** : en général l'**oxygène** de l'air
- **Énergie d'activation** : flamme, étincelle, chaleur, frottement…
## Le tétraèdre du feu
On ajoute un 4e élément : la **réaction en chaîne**, qui entretient la combustion.
## Les modes d'extinction
- **Refroidissement** : on retire l'énergie (eau)
- **Étouffement** : on prive le feu de comburant (couverture, mousse, CO2)
- **Inhibition** : on casse la réaction en chaîne (poudre)
- **Suppression du combustible** : on retire ou isole ce qui brûle (fermer une vanne de gaz, coupure de végétation)
> Supprimer un seul élément suffit à éteindre le feu.` },
  { titre:'Les classes de feux', tags:'classe a b c d f solide liquide gaz métaux huile friteuse extincteur',
    contenu:`| Classe | Nature | Exemples | Agents adaptés |
| A | Solides (font des braises) | Bois, papier, tissu | Eau, eau + additif, poudre ABC |
| B | Liquides ou solides liquéfiables | Essence, fioul, cire | Mousse, poudre, CO2 |
| C | Gaz | Butane, propane, gaz naturel | Poudre, après coupure de l'alimentation |
| D | Métaux | Sodium, magnésium | Poudre spéciale D |
| F | Huiles et graisses de cuisson | Friteuse | Extincteur classe F, couvercle |
! Jamais d'eau sur une friteuse en feu : projection d'huile enflammée.
- Les feux d'origine électrique ne forment pas une classe : couper le courant d'abord, puis CO2 ou poudre.` },
  { titre:'Modes de propagation', tags:'propagation conduction convection rayonnement projection chaleur',
    contenu:`- **Conduction** : la chaleur traverse un matériau (poutre métallique, cloison)
- **Convection** : les gaz chauds et les fumées montent et se déplacent (cages d'escalier, gaines, combles)
- **Rayonnement** : la chaleur est émise à distance, comme le soleil (bâtiment voisin, véhicule proche)
- **Déplacement de matières enflammées** : projections, brandons, liquides enflammés qui s'écoulent
> Pour limiter la propagation : refroidir les parois, fermer les portes, établir des lances de protection.` },
  { titre:'Phénomènes thermiques : EGE, explosion de fumées', tags:'flashover backdraft ege embrasement généralisé éclair explosion fumées fgi rollover lecture feu',
    contenu:`## Embrasement généralisé éclair (EGE / flashover)
Passage brutal d'un feu localisé à un feu qui embrase **tout le volume** : les fumées et les objets atteignent leur température d'inflammation sous l'effet du rayonnement.
- Signes : chaleur intense qui oblige à se baisser, fumées qui descendent, flammes dans les fumées (**rollover**)
## Explosion de fumées (backdraft)
Inflammation explosive des gaz imbrûlés d'un local **sous-ventilé** quand on lui apporte brutalement de l'air (ouverture de porte, bris de vitre).
- Signes : fumées sombres, épaisses, **pulsantes** sortant par les interstices, vitres noircies et chaudes, porte chaude, sifflements, peu de flammes visibles
## Inflammation des fumées (FGI)
Inflammation de fumées accumulées loin du foyer, au contact d'une source de chaleur.
## Conduite à tenir
- Lire le feu avant d'ouvrir (fumées, porte, vitres)
- Ouvrir une porte uniquement **lance en eau**, en se tenant sur le côté
- Refroidir les fumées par **impulsions** à la lance
! Signes d'explosion de fumées : ne pas créer d'ouverture et rendre compte immédiatement.` },
  { titre:'Agents extincteurs et BLEVE', tags:'eau mousse poudre co2 additif extincteur bleve citerne gaz liquéfié',
    contenu:`| Agent | Action principale | Feux |
| Eau (jet ou diffusé) | Refroidissement | A |
| Eau + additif | Refroidissement + meilleure pénétration | A, et B selon l'additif |
| Mousse | Étouffement | B (et A) |
| Poudre ABC | Inhibition | A, B, C |
| Poudre BC | Inhibition | B, C |
| CO2 | Étouffement | B, électrique |
- Le CO2 sort très froid (risque de gelure) et devient dangereux en local clos.
## BLEVE
Vaporisation explosive d'un réservoir de **gaz liquéfié** chauffé (ex. citerne de propane) : boule de feu et projections.
- Refroidir le réservoir **à distance**, établir un grand périmètre de sécurité` }
  ],
  questions:[
  Q("Quels sont les trois éléments du triangle du feu ?",["Combustible, comburant, énergie d'activation","Combustible, eau, oxygène","Chaleur, fumée, flamme","Bois, air, étincelle"],0,"Sans l'un des trois, le feu ne peut ni naître ni durer."),

  Q("Une explosion de fumées survient typiquement :",["Lors d'un apport brutal d'air dans un local sous-ventilé","Au moment du déblai","Quand on refroidit les fumées","Dans un feu de végétation"],0,"Exemple : ouverture d'une porte d'un local fermé où le feu couve."),
  Q("Quel signe annonce une explosion de fumées ?",["Fumées sombres et pulsantes sortant par les interstices","Grandes flammes claires","Absence totale de fumée","Porte froide au toucher"],0,"Autres signes : vitres noircies, sifflements, porte chaude."),
  Q("La poudre ABC agit principalement par :",["Inhibition","Refroidissement","Dilution","Soufflage"],0,"Elle casse la réaction en chaîne."),

  Q("Le BLEVE concerne surtout :",["Un réservoir de gaz liquéfié chauffé","Un feu de forêt","Un feu de poubelle","Un feu de cheminée"],0,"Refroidir à distance et établir un grand périmètre.")
  ]},

{ id:'secu', nom:'Sécurité, EPI & ARI', icone:'🛡️', couleur:'#fb8c00',
  fiches:[
  { titre:'Équipements de protection individuelle', tags:'epi tenue casque cagoule veste gants bottes protection',
    contenu:`## Équipements
- **Casque** avec visière et/ou lunettes, **cagoule** de protection
- **Veste et surpantalon** d'intervention
- **Gants** d'attaque, **bottes** ou rangers d'intervention
- Ceinturon et matériel de sauvetage selon les missions
- **ARI** pour toute atmosphère toxique, enfumée ou appauvrie en oxygène
## Règles de base
- Tenue **complète et fermée** avant d'arriver sur intervention
- Visière baissée et cagoule en place en zone de feu
- EPI adaptés à la mission : tenue feux de forêts, gilet haute visibilité sur la route, tenue de protection chimique…` },
  { titre:"L'ARI (appareil respiratoire isolant)", tags:'ari appareil respiratoire isolant bouteille sifflet alarme manomètre masque bar pression réserve',
    contenu:`## Composition
- **Dossard** et sangles, **bouteille** d'air comprimé (au SDIS 34 : 6 L ou 7,2 L à 300 bar, soit 1 800 ou 2 160 L d'air)

    contenu:`## Reconnaître

  { titre:'Facteurs de propagation et règle des 30', tags:'feu forêt végétation garrigue vent température humidité relief pente règle 30 saute brandon',
    contenu:`## Les facteurs
- **Combustible** : végétation (herbes, garrigue, maquis, pins), état de sécheresse
- **Météo** : vent, température, humidité de l'air
- **Relief** : un feu monte une pente **plus vite** qu'il ne la descend
## Règle des 30
Risque très élevé quand : **température > 30 °C**, **humidité < 30 %**, **vent > 30 km/h**.
- Le **vent** est le facteur principal : il pousse les flammes et transporte les brandons
- **Sautes de feu** : des brandons allument des **foyers secondaires** en avant du front` },
  { titre:"Anatomie d'un feu et techniques d'attaque", tags:'tête front flanc queue arrière doigt gant foyer secondaire attaque ancrage',
    contenu:`| Partie | Description |
| Tête (front) | Partie la plus active, poussée par le vent |
| Flancs | Côtés du feu, moins violents |
| Arrière (queue) | Partie la plus calme, opposée à la tête |
| Doigts de gant | Avancées du feu sur les flancs |
| Foyers secondaires | Nouveaux feux créés par les sautes |
## Techniques d'attaque
- Toujours partir d'un **point d'ancrage** (zone sûre : route, zone déjà brûlée, rocher)
- **Attaque de flanc** : progression le long des flancs vers la tête
- **Attaque de front** : sur la tête, seulement si elle est faible et sans danger
- **Attaque par l'arrière** : on éteint en remontant vers la tête
- Protection des points sensibles : habitations, campings, routes` },
  { titre:'GIFF, sécurité et autoprotection', tags:'giff ccf groupe intervention autoprotection rideau eau repli old débroussaillement 50 m',
    contenu:`## Le GIFF
- **Groupe d'intervention feux de forêts** : **4 CCF** et **1 véhicule de commandement** (chef de groupe)
- **CCF** : camion-citerne feux de forêts, équipage de **4** (chef d'agrès, conducteur, 2 équipiers)
- Plusieurs groupes forment une colonne
## Sécurité
- Repérer les **zones et itinéraires de repli** avant l'attaque
- Garer l'engin **orienté dans le sens du départ**
- Conserver une **réserve d'eau** pour l'autoprotection
## Autoprotection du CCF
- Rester **dans l'engin**, cabine fermée, **moteur tournant**
- Déclencher le dispositif d'autoprotection (**rideau d'eau**)
- Se protéger (couvertures) et rester bas dans la cabine
## Prévention
- **OLD** : obligations légales de débroussaillement, **50 m** autour des constructions (jusqu'à 100 m sur décision du maire)` }

/* ---------- Mini-markdown ---------- */
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
function md(src){
  const lines = String(src||'').split('\n'); let html='', list=false, table=false;
  const close = () => { if(list){ html+='</ul>'; list=false; } if(table){ html+='</tbody></table></div>'; table=false; } };
  for(const raw of lines){
    const l = raw.trim();
    if(l.startsWith('- ')){ if(table) close(); if(!list){ html+='<ul>'; list=true; } html+='<li>'+inline(l.slice(2))+'</li>'; continue; }
    if(l.startsWith('|')){
      if(list) close();
      const cells = l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
      if(!table){ html+='<div class="tbl"><table><thead><tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'; table=true; }
      else html+='<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
      continue;
    }
    close();
    if(!l) continue;
    if(l.startsWith('## ')) html+='<h3>'+inline(l.slice(3))+'</h3>';
    else if(l.startsWith('> ')) html+='<div class="callout">'+inline(l.slice(2))+'</div>';
    else if(l.startsWith('! ')) html+='<div class="callout warn">'+inline(l.slice(2))+'</div>';
    else html+='<p>'+inline(l)+'</p>';
  }
  close(); return html;
}
function plain(line){ return line.replace(/^(##|-|>|!)\s+/,'').replace(/^\||\|$/g,'').split('|').map(s=>s.trim()).filter(Boolean).join(' · ').replace(/\*\*/g,''); }

let IDX = [];
function countMap(arr){ const m=new Map(); arr.forEach(t => m.set(t,(m.get(t)||0)+1)); return m; }

function queryTokens(q){

function matchMap(map, t){

}
function scoreDoc(d, qt){

  }
  if(!s) return 0;
  s *= 0.35 + 0.65*hit/Math.max(1,nOrig);
  if(d.type==='fiche') s *= 1.1;
  return s;
}
function search(q){
  const qt = queryTokens(q); if(!qt.length) return {qt, res:[]};
  const res = IDX.map(d => ({d, s:scoreDoc(d, qt)})).filter(r => r.s > 0).sort((a,b) => b.s - a.s).slice(0, 40);
  return {qt, res};
}
function hl(text, toks){
  const n = normAligned(text); const rs = [];
  toks.forEach(t => {
    if(!t) return;
    const re = new RegExp('(^|[^a-z0-9])(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'g'); let m;
    while((m = re.exec(n))){ const st = m.index + m[1].length; let en = st + m[2].length; while(en < n.length && /[a-z0-9]/.test(n[en])) en++; rs.push([st,en]); }
  });
  if(!rs.length) return esc(text);
  rs.sort((a,b) => a[0]-b[0]); const mg = [];
  rs.forEach(r => { const l = mg[mg.length-1]; if(l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else mg.push(r.slice()); });
  let out='', p=0; mg.forEach(([a,b]) => { out += esc(text.slice(p,a)) + '<mark>' + esc(text.slice(a,b)) + '</mark>'; p=b; });
  return out + esc(text.slice(p));
}
function highlightDom(el, toks){
  if(!toks.length) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes = [];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(nd => { const h = hl(nd.nodeValue, toks); if(h.includes('<mark>')){ const sp=document.createElement('span'); sp.innerHTML=h; nd.replaceWith(...sp.childNodes); } });
}
function bestLines(f, qt){
  const orig = qt.map(q => q.t);
  return f.contenu.split('\n').map((l,i) => ({l:plain(l.trim()), i, s: tokens(l).filter(t => orig.some(o => t===o || (o.length>=4 && t.startsWith(o)))).length}))
    .filter(x => x.s>0 && x.l).sort((a,b) => b.s-a.s || a.i-b.i).slice(0,3).sort((a,b) => a.i-b.i);
}

function startQuiz(qs, {mode='train', title='Quiz', minutes=0} = {}){
  if(!qs.length){ toast('Aucune question disponible'); return; }
  QUIZ = { items: qs.map(q => ({q, order: shuffle(q.choix.map((_,i) => i)), pick:null, rec:false})), i:0, mode, title, end: minutes ? Date.now()+minutes*60000 : 0, done:false };
  go('#/quiz');
}
function fmt(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function tick(){
  if(!QUIZ || !QUIZ.end || QUIZ.done) return;
  const r = QUIZ.end - Date.now(); const el = $('#timer');
  if(el){ el.textContent = '⏱ '+fmt(r); el.classList.toggle('low', r < 60000); }
  if(r <= 0){ toast('Temps écoulé !'); finishQuiz(); }
}
function viewQuiz(){
  if(!QUIZ) return go('#/');
  if(QUIZ.done) return viewResults();
  const Z = QUIZ, it = Z.items[Z.i], q = it.q, n = Z.items.length, train = Z.mode==='train';
  const answered = it.pick !== null, t = themeOf(q.theme);

    let cls = '';

    else if(!train && it.pick===ci) cls='sel';
    return `<button class="choice ${cls}" data-c="${ci}" ${train&&answered?'disabled':''}><span class="k">${L[k]}</span><span>${esc(q.choix[ci])}</span></button>`;
  }).join('');
  let fb = '';
  if(train && answered){
    const ok = it.pick===q.r;
    fb = `<div class="feedback ${ok?'ok':'ko'}"><b>${ok?'✅ Bonne réponse !':'❌ Raté. Réponse : '+esc(q.choix[q.r])}</b>${q.ex?`<p style="margin:6px 0 0">${esc(q.ex)}</p>`:''}</div>`;
  }
  const doneCount = Z.items.filter(x => x.pick!==null).length;
  app.innerHTML = `<div class="fade">
  <div class="qhead"><button class="back" id="qquit" style="margin:0">✕</button>

  <div class="card">
    <div class="row"><span class="tag" style="--c:${esc(t.couleur)}">${esc(t.icone)} ${esc(t.nom)}</span><span class="spacer"></span><span class="small muted">${esc(Z.title)}</span></div>

    <div class="qnav">
      ${!train && Z.i>0 ? '<button class="btn" id="qprev">‹ Précédente</button>' : ''}
      ${train ? (answered ? `<button class="btn primary" id="qnext">${Z.i<n-1?'Suivante ›':'Voir mes résultats'}</button>` : '')
              : (Z.i<n-1 ? '<button class="btn primary" id="qnext">Suivante ›</button>' : '<button class="btn primary" id="qend">Terminer l\'examen</button>')}
    </div>
    ${!train ? `<div class="dots">${Z.items.map((x,k) => `<button data-g="${k}" class="${x.pick!==null?'done':''} ${k===Z.i?'cur':''}">${k+1}</button>`).join('')}</div>` : ''}
  </div>
  <p class="small muted" style="text-align:center">Astuce clavier : touches 1-4 pour répondre, Entrée pour continuer.</p></div>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => pick(+b.dataset.c));

function pick(ci){
  const Z = QUIZ, it = Z.items[Z.i];
  if(Z.mode==='train'){ if(it.pick!==null) return; it.pick = ci; record(it.q, ci===it.q.r); it.rec = true; }
  else it.pick = ci;
  viewQuiz();
}
function next(){ const Z = QUIZ; if(Z.i < Z.items.length-1){ Z.i++; viewQuiz(); window.scrollTo(0,0); } else finishQuiz(); }
function finishQuiz(){
  const Z = QUIZ; if(!Z || Z.done) return;
  Z.done = true; clearInterval(TIMER); TIMER = null;
  Z.items.forEach(it => { if(!it.rec){ record(it.q, it.pick===it.q.r); it.rec = true; } });
  viewResults(); window.scrollTo(0,0);
}

    <div class="row" style="margin-top:10px"><button class="btn" id="eAll">Tout sélectionner</button><button class="btn" id="eNone">Tout désélectionner</button></div>
    <div style="margin-top:16px"><b>Nombre de questions</b></div>
    <div class="seg" style="margin-top:8px">${[10,20,40,60].map(k => `<button data-n="${k}" class="${cfg.n===k?'on':''}">${k}</button>`).join('')}</div>
    <div style="margin-top:16px"><label class="row"><input type="checkbox" id="eT" ${cfg.timer?'checked':''} style="width:20px;height:20px"> <span>Chronomètre (45 s par question)</span></label></div>
    <p class="small muted">${avail} questions disponibles dans la sélection.</p>
    <button class="btn primary block" id="eGo" ${avail?'':'disabled'}>🚀 Lancer l'examen</button>
  </div></div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const id=b.dataset.t; EXAM_SEL.has(id)?EXAM_SEL.delete(id):EXAM_SEL.add(id); viewExam(); });
  app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { cfg.n = +b.dataset.n; store.set('examcfg', cfg); viewExam(); });
  $('#eT').onchange = e => { cfg.timer = e.target.checked; store.set('examcfg', cfg); };
  $('#eAll').onclick = () => { EXAM_SEL = new Set(THEMES.map(t => t.id)); viewExam(); };
  $('#eNone').onclick = () => { EXAM_SEL = new Set(); viewExam(); };
  $('#eGo').onclick = () => {
    const pool = shuffle(THEMES.filter(t => EXAM_SEL.has(t.id)).flatMap(t => t.questions)).slice(0, cfg.n);
    startQuiz(pool, {mode:'exam', title:'Examen blanc', minutes: cfg.timer ? Math.ceil(pool.length*0.75) : 0});
  };
}

/* ---------- Flashcards ---------- */
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
function startFlash(qs, title){
  if(!qs.length){ toast('Aucune carte'); return; }
  const now = Date.now();
  const due = qs.filter(q => LEIT[q.id] && LEIT[q.id].due <= now);
  const fresh = qs.filter(q => !LEIT[q.id]);
  let deck = [...shuffle(due), ...shuffle(fresh)].slice(0, 20);
  if(!deck.length) deck = shuffle(qs).slice(0, 20);
  FLASH = {deck, i:0, flipped:false, title, known:0};
  go('#/flash');
}
function viewFlash(){
  if(!FLASH) return go('#/');
  const F = FLASH;
  if(F.i >= F.deck.length){
    app.innerHTML = `<div class="fade card" style="text-align:center"><div style="font-size:48px">🎉</div><h2 style="justify-content:center">Session terminée !</h2>
      <p>${F.known} / ${F.deck.length} cartes sues.</p><div class="row" style="justify-content:center"><a class="btn primary" href="#/">🏠 Accueil</a><a class="btn" href="#/progress">📈 Mes progrès</a></div></div>`;
    return;
  }
  const q = F.deck[F.i], t = themeOf(q.theme), box = LEIT[q.id] ? LEIT[q.id].box : 0;
  app.innerHTML = `<div class="fade">
  <div class="qhead"><a class="back" href="#/" style="margin:0">✕</a><div class="bar" style="--c:var(--navy2)"><i style="width:${pct(F.i, F.deck.length)}%"></i></div><b class="small">${F.i+1}/${F.deck.length}</b></div>
  <div class="row"><span class="tag" style="--c:${esc(t.couleur)}">${esc(t.icone)} ${esc(t.nom)}</span><span class="spacer"></span><span class="small muted">Boîte ${box}/6</span></div>
  <div class="flash ${F.flipped?'flipped':''}" id="card" role="button" tabindex="0" aria-label="Retourner la carte">
    <div class="flash-in">
      <div class="face"><div class="lbl">Question</div><div class="big">${esc(q.q)}</div><p class="small muted" style="margin-top:16px">Touche la carte pour voir la réponse</p></div>
      <div class="face back"><div class="lbl">Réponse</div><div class="ans">✅ ${esc(q.choix[q.r])}</div>${q.ex?`<p>${esc(q.ex)}</p>`:''}</div>
    </div>
  </div>
  <div class="qnav" ${F.flipped?'':'style="visibility:hidden"'}>
    <button class="btn" id="fNo" style="border-color:var(--ko);color:var(--ko)">🔁 À revoir</button>
    <button class="btn primary" id="fYes" style="background:var(--ok);border-color:var(--ok)">✅ Je savais</button>
  </div></div>`;
  const flip = () => { F.flipped = !F.flipped; viewFlash(); };
  $('#card').onclick = flip; $('#card').onkeydown = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } };
  $('#fNo').onclick = () => rate(false); $('#fYes').onclick = () => rate(true);
}
function rate(ok){
  const F = FLASH, q = F.deck[F.i]; const e = LEIT[q.id] || {box:0};
  e.box = ok ? Math.min(6, e.box+1) : 1;
  e.due = Date.now() + INTERVALS[e.box]*86400000;
  LEIT[q.id] = e; store.set('leitner', LEIT); markDay();
  if(ok) F.known++;
  F.i++; F.flipped = false; viewFlash();
}

/* ---------- Progrès ---------- */
function viewProgress(){
  const all = allQuestions(); const seen = all.filter(q => STATS[q.id]);
  const ok = seen.reduce((a,q) => a+STATS[q.id].ok, 0), tot = seen.reduce((a,q) => a+STATS[q.id].ok+STATS[q.id].ko, 0);
  const mast = pct(all.filter(q => STATS[q.id] && STATS[q.id].last===1).length, all.length);
  const learned = all.filter(q => LEIT[q.id] && LEIT[q.id].box>=4).length;
  const err = errors().length;
  app.innerHTML = `<div class="fade">
  <h1>📈 Mes progrès</h1>
  <div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <div class="ring" style="--p:${mast};margin:0"><div><b>${mast}%</b><small>maîtrisé</small></div></div>
    <div style="flex:1;min-width:180px"><b>Niveau global</b><p class="muted small" style="margin:4px 0">Part des questions dont ta dernière réponse est juste.</p>
      ${err?`<button class="btn primary" id="pErr">🎯 Retravailler mes ${err} erreur${err>1?'s':''}</button>`:''}</div>
  </div>
  <div class="kpis" style="margin-top:12px">
    <div class="kpi"><b>${seen.length}/${all.length}</b><span>questions vues</span></div>
    <div class="kpi"><b>${pct(ok,tot)} %</b><span>taux de réussite</span></div>
    <div class="kpi"><b>🔥 ${streak()}</b><span>jour(s) de suite</span></div>
    <div class="kpi"><b>${learned}</b><span>cartes mémorisées</span></div>
  </div>
  <h2>Par thème</h2>
  <div class="list">${THEMES.map(t => { const m = mastery(t), e = errors(t.questions).length; return `<a class="item" href="#/theme/${t.id}" style="--c:${esc(t.couleur)}"><span style="font-size:22px">${esc(t.icone)}</span>
    <div class="t"><b>${esc(t.nom)}</b><div class="bar"><i style="width:${m}%"></i></div><small>${m} % maîtrisé${e?' · '+e+' erreur'+(e>1?'s':''):''}</small></div><span class="muted">›</span></a>`; }).join('')}</div>
  </div>`;
  const pe = $('#pErr'); if(pe) pe.onclick = () => startQuiz(shuffle(errors()), {title:'Mes erreurs'});
}

/* ---------- Réglages ---------- */
const TEMPLATE = {
  themes:[
    { id:'fdf', nom:'(thème existant : les fiches et questions sont ajoutées)', fiches:[
      { titre:'Ordre d\'opération FDF du SDIS 34', tags:'mots clés pour la recherche', contenu:'## Titre de section\n- Point clé **en gras**\n- Autre point\n> Astuce\n! Attention\n| Colonne 1 | Colonne 2 |\n| valeur | valeur |' } ],
      questions:[ { q:'Ta question ?', choix:['Bonne réponse','Mauvaise 1','Mauvaise 2','Mauvaise 3'], r:0, ex:'Explication affichée après la réponse' } ] },
    { id:'mon-theme', nom:'Nouveau thème', icone:'📘', couleur:'#546e7a', fiches:[], questions:[] }
  ]
};
function download(name, obj){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function validateImport(data){
  const themes = Array.isArray(data) ? data : data && data.themes;
  if(!Array.isArray(themes)) throw new Error('Le fichier doit contenir une liste "themes".');
  return themes.map((t, i) => {
    if(!t || typeof t.id !== 'string' || !t.id.trim()) throw new Error('Thème n°'+(i+1)+' : "id" manquant.');
    const fiches = (t.fiches||[]).map((f, j) => { if(!f.titre || typeof f.contenu !== 'string') throw new Error('Thème "'+t.id+'", fiche n°'+(j+1)+' : "titre" et "contenu" requis.'); return {titre:String(f.titre), tags:String(f.tags||''), contenu:f.contenu}; });
    const questions = (t.questions||[]).map((q, j) => {
      if(!q.q || !Array.isArray(q.choix) || q.choix.length<2 || q.choix.length>6 || !Number.isInteger(q.r) || q.r<0 || q.r>=q.choix.length) throw new Error('Thème "'+t.id+'", question n°'+(j+1)+' invalide (q, choix[2 à 6], r).');
      return {q:String(q.q), choix:q.choix.map(String), r:q.r, ex:String(q.ex||'')};
    });
    return {id:t.id.trim(), nom:t.nom?String(t.nom):undefined, icone:t.icone?String(t.icone):undefined, couleur:/^#[0-9a-f]{3,8}$/i.test(t.couleur||'')?t.couleur:undefined, fiches, questions};
  });
}
function viewMore(){
  const th = store.get('theme', 'auto'); const custom = store.get('custom', []);
  const nF = custom.reduce((a,t) => a+t.fiches.length, 0), nQ = custom.reduce((a,t) => a+t.questions.length, 0);
  app.innerHTML = `<div class="fade">
  <h1>⚙️ Réglages</h1>
  <div class="card"><b>Apparence</b><div style="margin-top:8px" class="seg">
    ${[['auto','🌗 Auto'],['light','☀️ Clair'],['dark','🌙 Sombre']].map(([k,l]) => `<button data-th="${k}" class="${th===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="card" style="margin-top:12px">
    <b>📥 Ajouter le contenu de ton référentiel (SDIS 34)</b>
    <p class="small muted">Importe un fichier JSON contenant tes fiches et questions. Si l'<code>id</code> d'un thème existe déjà (org, inc, secu, ope, sap, sr, fdf, risq, div, trans), le contenu y est ajouté ; sinon un nouveau thème est créé. Tout reste stocké sur ton appareil.</p>
    <p class="small">Contenu importé : <b>${custom.length}</b> thème(s), <b>${nF}</b> fiche(s), <b>${nQ}</b> question(s).</p>
    <div class="row">
      <label class="btn primary">📂 Importer un JSON<input type="file" id="imp" accept=".json,application/json" hidden></label>
      <button class="btn" id="tpl">📄 Télécharger le modèle</button>
      ${custom.length?'<button class="btn" id="exp">💾 Exporter mes imports</button><button class="btn" id="clr">🗑️ Retirer les imports</button>':''}
    </div>
  </div>
  <div class="card" style="margin-top:12px"><b>Progression</b>
    <p class="small muted">Statistiques, flashcards, favoris et série sont enregistrés dans ce navigateur.</p>
    <button class="btn" id="rst" style="color:var(--ko)">♻️ Réinitialiser ma progression</button></div>
  <div class="card" style="margin-top:12px"><b>À propos</b>
    <p class="small muted">Contenu de base : ${THEMES.reduce((a,t) => a+t.fiches.length, 0)} fiches et ${allQuestions().length} questions, construites à partir des référentiels départementaux du SDIS 34 (RDMI v6, RDEB v2, RDSMES v2, RDLSPCC v1), de la doctrine nationale (GDO/GTO, référentiel PSE, ADR) et des risques de l'Hérault. Cette application est une aide à la révision : en cas de différence, <b>les référentiels, le règlement opérationnel et les notes de service du SDIS 34 font foi</b>.</p></div>
  </div>`;
  app.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { store.set('theme', b.dataset.th); applyTheme(); viewMore(); });
  $('#tpl').onclick = () => download('modele-revision-sdis34.json', TEMPLATE);
  $('#imp').onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const themes = validateImport(JSON.parse(rd.result));
        const cur = store.get('custom', []);
        themes.forEach(t => { const ex = cur.find(c => c.id===t.id); if(ex){ ex.fiches.push(...t.fiches); ex.questions.push(...t.questions); Object.assign(ex, {nom:t.nom||ex.nom, icone:t.icone||ex.icone, couleur:t.couleur||ex.couleur}); } else cur.push(t); });
        store.set('custom', cur); buildThemes();
        toast('Import réussi : '+themes.reduce((a,t)=>a+t.fiches.length,0)+' fiche(s), '+themes.reduce((a,t)=>a+t.questions.length,0)+' question(s)'); viewMore();
      }catch(err){ alert('Import impossible : '+err.message); }
    };
    rd.readAsText(file);
  };
  const ex = $('#exp'); if(ex) ex.onclick = () => download('mes-fiches-sdis34.json', {themes:store.get('custom', [])});
  const cl = $('#clr'); if(cl) cl.onclick = () => { if(confirm('Retirer tout le contenu importé ? (ta progression sur ces questions sera conservée mais inutilisée)')){ store.set('custom', []); buildThemes(); viewMore(); toast('Imports retirés'); } };
  $('#rst').onclick = () => { if(confirm('Effacer toute ta progression ?')){ STATS={}; LEIT={}; FAVS=[]; ['stats','leitner','favs','days'].forEach(k => store.set(k, k==='stats'||k==='leitner'?{}:[])); toast('Progression réinitialisée'); viewMore(); } };
}
function applyTheme(){
  const th = store.get('theme', 'auto');
  if(th==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
}

/* ---------- Routeur ---------- */
function render(){
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?'); const params = new URLSearchParams(qs||'');
  const parts = path.split('/').filter(Boolean);
  const r = parts[0] || 'home';
  if(r !== 'quiz' && TIMER){ clearInterval(TIMER); TIMER = null; }
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.r === (['theme','fiche','quiz','flash'].includes(r) ? 'home' : r)));
  window.scrollTo(0,0);
  switch(r){
    case 'theme': return viewTheme(parts[1]);
    case 'fiche': return viewFiche(parts[1], params);
    case 'search': return viewSearch(params);
    case 'quiz': return viewQuiz();
    case 'flash': return viewFlash();
    case 'exam': return viewExam();
    case 'progress': return viewProgress();
    case 'more': return viewMore();
    default: return viewHome();
  }
}
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase(); const typing = tag==='input' || tag==='textarea';
  if(e.key==='/' && !typing){ e.preventDefault(); if(location.hash.startsWith('#/search')) $('#sq').focus(); else go('#/search'); return; }
  if(typing) return;
  if(location.hash==='#/quiz' && QUIZ && !QUIZ.done){
    const it = QUIZ.items[QUIZ.i];
    if(/^[1-6]$/.test(e.key)){ const k = +e.key-1; if(k < it.order.length) pick(it.order[k]); }
    else if(e.key==='Enter'){ const b = $('#qnext') || $('#qend'); if(b) b.click(); }
  }
  if(location.hash==='#/flash' && FLASH && FLASH.i < FLASH.deck.length){
    if(e.key===' '){ e.preventDefault(); FLASH.flipped = !FLASH.flipped; viewFlash(); }
    else if(FLASH.flipped && (e.key==='1' || e.key==='ArrowLeft')) rate(false);
    else if(FLASH.flipped && (e.key==='2' || e.key==='ArrowRight')) rate(true);
  }
});
$('#btnSearch').onclick = () => go('#/search');
window.addEventListener('hashchange', render);
applyTheme(); buildThemes(); render();
</script>
</body>
</html>
